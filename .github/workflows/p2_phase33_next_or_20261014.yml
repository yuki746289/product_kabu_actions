# Created: 2026-10-14 JST
# Phase33 NEXT OR2/OR3 scoped canary, feature groups disjoint from earlier OR audits.
# No previous successful artifact reruns, full OR generator, Production or deployment.
name: P2 Phase33 next source-bound OR producer eight datasets
on:
  push:
    branches: [automation/p2-common-postextract-20261012]
    paths:
      - '.github/workflows/p2_phase33_next_or_20261014.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-phase33-next-OR-disjoint-20261014
  cancel-in-progress: false
env:
  CORE_SHA: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  selftest:
    name: Pin certified Phase32 final success and validate next OR auditor contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fixed Phase32 SHA and next component scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          python -m py_compile scripts/p2_common_phase33_next_or_bounded_20261014.py
          python scripts/p2_common_phase33_next_or_bounded_20261014.py --selftest
          gh api repos/yuki746289/product_kabu_actions/actions/runs/38510437816 --jq '.conclusion + " " + .head_sha' | \
            grep -Fx 'success 61aebbd671506230d19d4f1d261d8ade186925b0'

  canary:
    name: Phase33 next unseen OR2+OR3 (${{ matrix.dataset }})
    needs: selftest
    if: ${{ needs.selftest.result == 'success' }}
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - dataset: "technology"
            dir: "225_group_all_period/technology"
            sourceRun: 0
            sourceArtifact: ""
            proof4: "p2-common-exact-six-group-identities"
            proofFile: "group.json"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Sparse immutable Private core and original OR references
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
            /preview/kabu/analysis/${{ matrix.dir }}/signal_level_features.csv
            /preview/kabu/analysis/${{ matrix.dir }}/advantage_single_candidates.csv
            /preview/kabu/analysis/${{ matrix.dir }}/or_pairwise_all.csv
            /preview/kabu/analysis/${{ matrix.dir }}/or_triple_all.csv
            /preview/kabu/analysis/${{ matrix.dir }}/semantic_status.json
          persist-credentials: false
      - name: Mandatory Public-only, exact Private SHA and architecture preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Private workflow detected"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse original saved exclusion features artifact unchanged
        if: ${{ matrix.sourceRun != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sourceArtifact }}
          run-id: ${{ matrix.sourceRun }}
          github-token: ${{ github.token }}
          path: original_source
      - name: Reuse independently certified original source identity
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.proof4 }}
          run-id: 38239501315
          github-token: ${{ github.token }}
          path: source_proof
      - name: Reuse already successful Phase31 saved triple source-bound proof
        uses: actions/download-artifact@v4
        with:
          name: p2-phase31-${{ matrix.dataset }}-start-0
          run-id: 38506898455
          github-token: ${{ github.token }}
          path: prior_triple
      - name: Reuse exact successful Phase32 4+4 previous OR proof
        uses: actions/download-artifact@v4
        with:
          name: p2-phase32-${{ matrix.dataset }}-or2-or3-new
          run-id: 38510437816
          github-token: ${{ github.token }}
          path: previous_or
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install pinned canonical requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Compare next 8 plus 8 never-before-audited OR component combinations
        shell: bash
        run: |
          set -euo pipefail
          test -f "source_proof/${{ matrix.proofFile }}"
          test -f prior_triple/audit.json && test -f previous_or/audit.json
          python scripts/p2_common_phase33_next_or_bounded_20261014.py \
            --core core --dataset "$DATASET" \
            --reference "core/preview/kabu/analysis/${{ matrix.dir }}" \
            --source-root original_source \
            --proof4 "source_proof/${{ matrix.proofFile }}" \
            --phase31 prior_triple/audit.json \
            --phase32 previous_or/audit.json \
            --report "$RUNNER_TEMP/audit.json"
      - name: Fail-closed independent scope, SHA and numerical equality gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"audit.json").read_text(encoding="utf-8"))
          assert d["status"]=="PASS_PHASE33_NEXT_UNSEEN_OR2_OR3_BOUNDED"
          assert d["dataset"]==os.environ["DATASET"]
          assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert d["source_rows"]>0 and d["source_tickers"]>0
          assert d["new_or2_conditions"]==d["new_or3_conditions"]==8
          assert d["numeric_fields_checked"]>=600
          assert d["mismatch_count"]==0 and d["first_errors"]==[]
          assert d["skipped_prior_phase32_per_kind"]==4
          assert d["prior_phase32_new_or_recomputed"] is False
          assert d["new_canonical_combo_metrics_called"] is True
          for k in ("already_certified_prior_or_conditions_recomputed",
                    "previous_artifacts_recomputed","full_or_bundle_generated",
                    "full_semantic_bundle_generated","historical_signals_recomputed",
                    "html_generated","production_changed","release_ready"):
              assert d[k] is False,k
          print("PASS_PHASE33_NEXT_UNSEEN_OR2_OR3",d["dataset"])
          PY
      - name: Confirm saved original Private bytes unmodified
        if: always()
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Upload only compact OR parity audit metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase33-${{ matrix.dataset }}-or2-or3-new
          path: ${{ runner.temp }}/audit.json
          retention-days: 14
          if-no-files-found: error


  remaining:
    name: Phase33 next unseen OR2+OR3 (${{ matrix.dataset }})
    needs: canary
    if: ${{ needs.canary.result == 'success' }}
    strategy:
      fail-fast: true
