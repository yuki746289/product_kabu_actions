          name: p2-phase33-${{ matrix.dataset }}-or2-or3-new
          path: ${{ runner.temp }}/audit.json
          retention-days: 14
          if-no-files-found: error

  final_gate:
    name: Independent eight-dataset next OR2 OR3 numerical equality proof
    needs: [selftest, canary, remaining]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Stop unless all earlier gates PASS
        env:
          TEST: ${{ needs.selftest.result }}
          CANARY: ${{ needs.canary.result }}
          REMAINING: ${{ needs.remaining.result }}
        run: |
          set -euo pipefail
          test "$TEST" = success && test "$CANARY" = success && test "$REMAINING" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: p2-phase33-*-or2-or3-new
          path: evidence
      - name: Confirm all eight source-bound OR metadata reports
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          ds={"technology","financials","consumer_goods","materials",
              "capital_goods_others","transportation_utilities",
              "exclude_capital_goods_transportation_utilities","exclude_transportation_utilities"}
          root=Path("evidence")
          expected={"p2-phase33-"+d+"-or2-or3-new" for d in ds}
          found={p.name for p in root.iterdir() if p.is_dir()}
          assert expected==found,(expected-found,found-expected)
          for dataset in sorted(ds):
              d=json.loads((root/("p2-phase33-"+dataset+"-or2-or3-new")/"audit.json").read_text(encoding="utf-8"))
              assert d["status"]=="PASS_PHASE33_NEXT_UNSEEN_OR2_OR3_BOUNDED"
              assert d["dataset"]==dataset and d["mismatch_count"]==0
              assert d["new_or2_conditions"]==d["new_or3_conditions"]==8
              assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
              assert d["release_ready"] is False
              print("PASS_PHASE33_DATASET",dataset,d["numeric_fields_checked"])
          print("PASS_PHASE33_EIGHT_DATASETS_NEXT_UNSEEN_OR2_OR3")
          PY
      - name: Declare non-release limited proof
        run: |
          echo "8 dataset x (8 OR2 + 8 OR3) NEW common OR producer numeric parity only." >> "$GITHUB_STEP_SUMMARY"
          echo "Full OR dedupe/candidate/semantic 29 CSV/HTML/all225/Nikkei890 remain uncertified." >> "$GITHUB_STEP_SUMMARY"
          echo "No original output replacement, PR merge, release or deploy." >> "$GITHUB_STEP_SUMMARY"
