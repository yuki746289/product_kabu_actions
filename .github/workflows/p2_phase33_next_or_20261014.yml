            /preview/kabu/analysis/${{ matrix.dir }}/advantage_single_candidates.csv
            /preview/kabu/analysis/${{ matrix.dir }}/or_pairwise_all.csv
            /preview/kabu/analysis/${{ matrix.dir }}/or_triple_all.csv
            /preview/kabu/analysis/${{ matrix.dir }}/semantic_status.json
          persist-credentials: false
      - name: Mandatory Public-only, exact Private SHA and architecture preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Private workflow detected"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse original saved exclusion features artifact unchanged
        if: ${{ matrix.sourceRun != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sourceArtifact }}
          run-id: ${{ matrix.sourceRun }}
          github-token: ${{ github.token }}
          path: original_source
      - name: Reuse independently certified original source identity
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.proof4 }}
          run-id: 38239501315
          github-token: ${{ github.token }}
          path: source_proof
      - name: Reuse already successful Phase31 saved triple source-bound proof
        uses: actions/download-artifact@v4
        with:
          name: p2-phase31-${{ matrix.dataset }}-start-0
          run-id: 38506898455
          github-token: ${{ github.token }}
          path: prior_triple
      - name: Reuse exact successful Phase32 4+4 previous OR proof
        uses: actions/download-artifact@v4
        with:
          name: p2-phase32-${{ matrix.dataset }}-or2-or3-new
          run-id: 38510437816
          github-token: ${{ github.token }}
          path: previous_or
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install pinned canonical requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Compare next 8 plus 8 never-before-audited OR component combinations
        shell: bash
        run: |
          set -euo pipefail
          test -f "source_proof/${{ matrix.proofFile }}"
          test -f prior_triple/audit.json && test -f previous_or/audit.json
          python scripts/p2_common_phase33_next_or_bounded_20261014.py \
            --core core --dataset "$DATASET" \
            --reference "core/preview/kabu/analysis/${{ matrix.dir }}" \
            --source-root original_source \
            --proof4 "source_proof/${{ matrix.proofFile }}" \
            --phase31 prior_triple/audit.json \
            --phase32 previous_or/audit.json \
