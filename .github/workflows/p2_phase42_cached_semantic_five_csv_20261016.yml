# User approved Phase42 NumPy cached research optimization after empirical 12.5x metrics / 3.7x stability benchmark.
# Does NOT rerun full semantic (6h timed out), Phase40 or Phase41 successes, or any production computations.
name: P2 Phase42 cached semantic five CSV full numerical parity
on:
  push:
    branches: [automation/p2-common-postextract-20261012]
    paths:
      - '.github/workflows/p2_phase42_cached_semantic_five_csv_20261016.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-phase42-optimized-semantic-five-csv-20261016
  cancel-in-progress: false
env:
  CORE_SHA: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  selftest:
    name: Verify immutable successful Phase40/41 and new accelerated research code structure
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Phase40 64-shard and Phase41 56-shard numerical proof gate and syntax selftest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          python -m py_compile scripts/p2_phase42_numpy_cached_stability_20261016.py
          python scripts/p2_phase42_numpy_cached_stability_20261016.py --selftest
          gh api repos/yuki746289/product_kabu_actions/actions/runs/38582105679 --jq '.conclusion + " " + .head_sha' | \
            grep -Fx 'success 99d884384661054e281552633fffaf4749e747b1'
          gh api repos/yuki746289/product_kabu_actions/actions/runs/38834103298 --jq '.conclusion + " " + .head_sha' | \
            grep -Fx 'success d78f10bd7c6ac740b88c33112973a5ed39792974'

  canary:
    name: Phase42 fast cached 5 original stability CSVs (${{ matrix.dataset }})
    needs: selftest
    if: ${{ needs.selftest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      max-parallel: 2
      fail-fast: true
      matrix:
        include:
          - dataset: "technology"
            dir: "225_group_all_period/technology"
            sourceRun: 0
            sourceArtifact: ""
    env:
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Read only pinned Private original code and saved semantic reference CSVs
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
            /preview/kabu/analysis/${{ matrix.dir }}/signal_level_features.csv
            /preview/kabu/analysis/${{ matrix.dir }}/representative_single_categories.csv
            /preview/kabu/analysis/${{ matrix.dir }}/all_pairwise_combinations.csv
            /preview/kabu/analysis/${{ matrix.dir }}/tested_triple_combinations.csv
            /preview/kabu/analysis/${{ matrix.dir }}/yearly_stability.csv
            /preview/kabu/analysis/${{ matrix.dir }}/monthly_stability.csv
            /preview/kabu/analysis/${{ matrix.dir }}/rolling_3y_stability.csv
            /preview/kabu/analysis/${{ matrix.dir }}/rolling_5y_stability.csv
            /preview/kabu/analysis/${{ matrix.dir }}/regime_stability.csv
          persist-credentials: false
      - name: Enforce original fixed SHA, public-only runner and zero private workflows
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Private workflows are forbidden"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse original SHA pinned excluded features if required
        if: ${{ matrix.sourceRun != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sourceArtifact }}
          run-id: ${{ matrix.sourceRun }}
          github-token: ${{ github.token }}
          path: old_features
      - name: Reuse exact prior 29CSV original source proof, no recalculation
        uses: actions/download-artifact@v4
        with:
          name: p2-phase38-${{ matrix.dataset }}-saved-29csv-inventory
          run-id: 38524279221
          github-token: ${{ github.token }}
          path: evidence38
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install exact original numerical requirements
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Compute only unverified original-stability semantic vectors with accelerated NumPy cache
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="core/preview/kabu/analysis/${{ matrix.dir }}/signal_level_features.csv"
          if [ "${{ matrix.sourceRun }}" != "0" ]; then
            SOURCE="$(find old_features -name features.csv -type f -print -quit)"
            test -n "$SOURCE"
          fi
          python scripts/p2_phase42_numpy_cached_stability_20261016.py \
            --core core --dataset "$DATASET" \
            --reference "core/preview/kabu/analysis/${{ matrix.dir }}" \
            --source "$SOURCE" --phase38 evidence38/audit.json \
            --report "$RUNNER_TEMP/report.json"
      - name: Require 5 exact-source old/new row and numeric parity, never full 29CSV false claims
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"report.json").read_text())
          assert d["status"]=="PASS_PHASE42_FIVE_CACHED_SEMANTIC_OUTPUTS"
          assert d["dataset"]==os.environ["DATASET"]
          assert d["original_private_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert d["file_count"]==len(d["files"])==5
          assert all(v["rows"]>0 and v["numeric_and_label_parity"] is True
                     for v in d["files"].values())
          assert d["phase40_and_41_successful_work_recomputed"] is False
          assert d["full_semantic_producer_rerun"] is False
          assert d["production_p2_v12_changed"] is False
          assert d["original_csv_html_modified"] is False
          assert d["phase42_full_29csv_certified"] is False
          assert d["phase43_full_pipeline_certified"] is False and d["release_ready"] is False
          print("PASS_PHASE42_REAL_NEW_CACHED_NUMERICAL_STABILITY",d["dataset"])
          PY
      - name: Confirm Private source not changed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Store ONLY SHA/counters/PASS and timings JSON, never private source rows
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase42-${{ matrix.dataset }}-five-semantic-cached-parity
          path: ${{ runner.temp }}/report.json
          retention-days: 30
          if-no-files-found: error


  remaining:
    name: Phase42 fast cached 5 original stability CSVs (${{ matrix.dataset }})
    needs: canary
    if: ${{ needs.canary.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      max-parallel: 2
      fail-fast: true
      matrix:
        include:
          - dataset: "financials"
            dir: "225_group_all_period/financials"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "consumer_goods"
            dir: "225_group_all_period/consumer_goods"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "materials"
            dir: "225_group_all_period/materials"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "capital_goods_others"
            dir: "225_group_all_period/capital_goods_others"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "transportation_utilities"
            dir: "225_group_all_period/transportation_utilities"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "exclude_capital_goods_transportation_utilities"
            dir: "225_exclusion_all_period/exclude_capital_goods_transportation_utilities"
            sourceRun: 37201520569
            sourceArtifact: "p2-225-exclusion-no-capital-transport-features"
          - dataset: "exclude_transportation_utilities"
            dir: "225_exclusion_all_period/exclude_transportation_utilities"
            sourceRun: 37201518110
            sourceArtifact: "p2-225-exclusion-no-transport-features"
    env:
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Read only pinned Private original code and saved semantic reference CSVs
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
            /preview/kabu/analysis/${{ matrix.dir }}/signal_level_features.csv
            /preview/kabu/analysis/${{ matrix.dir }}/representative_single_categories.csv
            /preview/kabu/analysis/${{ matrix.dir }}/all_pairwise_combinations.csv
            /preview/kabu/analysis/${{ matrix.dir }}/tested_triple_combinations.csv
            /preview/kabu/analysis/${{ matrix.dir }}/yearly_stability.csv
            /preview/kabu/analysis/${{ matrix.dir }}/monthly_stability.csv
            /preview/kabu/analysis/${{ matrix.dir }}/rolling_3y_stability.csv
            /preview/kabu/analysis/${{ matrix.dir }}/rolling_5y_stability.csv
            /preview/kabu/analysis/${{ matrix.dir }}/regime_stability.csv
          persist-credentials: false
      - name: Enforce original fixed SHA, public-only runner and zero private workflows
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Private workflows are forbidden"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse original SHA pinned excluded features if required
        if: ${{ matrix.sourceRun != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sourceArtifact }}
          run-id: ${{ matrix.sourceRun }}
          github-token: ${{ github.token }}
          path: old_features
      - name: Reuse exact prior 29CSV original source proof, no recalculation
        uses: actions/download-artifact@v4
        with:
          name: p2-phase38-${{ matrix.dataset }}-saved-29csv-inventory
          run-id: 38524279221
          github-token: ${{ github.token }}
          path: evidence38
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install exact original numerical requirements
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Compute only unverified original-stability semantic vectors with accelerated NumPy cache
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="core/preview/kabu/analysis/${{ matrix.dir }}/signal_level_features.csv"
          if [ "${{ matrix.sourceRun }}" != "0" ]; then
            SOURCE="$(find old_features -name features.csv -type f -print -quit)"
            test -n "$SOURCE"
          fi
          python scripts/p2_phase42_numpy_cached_stability_20261016.py \
            --core core --dataset "$DATASET" \
            --reference "core/preview/kabu/analysis/${{ matrix.dir }}" \
            --source "$SOURCE" --phase38 evidence38/audit.json \
            --report "$RUNNER_TEMP/report.json"
      - name: Require 5 exact-source old/new row and numeric parity, never full 29CSV false claims
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"report.json").read_text())
          assert d["status"]=="PASS_PHASE42_FIVE_CACHED_SEMANTIC_OUTPUTS"
          assert d["dataset"]==os.environ["DATASET"]
          assert d["original_private_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert d["file_count"]==len(d["files"])==5
          assert all(v["rows"]>0 and v["numeric_and_label_parity"] is True
                     for v in d["files"].values())
          assert d["phase40_and_41_successful_work_recomputed"] is False
          assert d["full_semantic_producer_rerun"] is False
          assert d["production_p2_v12_changed"] is False
          assert d["original_csv_html_modified"] is False
          assert d["phase42_full_29csv_certified"] is False
          assert d["phase43_full_pipeline_certified"] is False and d["release_ready"] is False
          print("PASS_PHASE42_REAL_NEW_CACHED_NUMERICAL_STABILITY",d["dataset"])
          PY
      - name: Confirm Private source not changed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Store ONLY SHA/counters/PASS and timings JSON, never private source rows
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase42-${{ matrix.dataset }}-five-semantic-cached-parity
          path: ${{ runner.temp }}/report.json
          retention-days: 30
          if-no-files-found: error

  final_gate:
    name: Ensure complete 8-dataset 5-CSV semantic numerical parity evidence
    needs: [selftest,canary,remaining]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Every dataset must have passed bounded NumPy cached 5-CSV parity
        shell: bash
        env:
          PREFLIGHT: ${{ needs.selftest.result }}
          FIRST: ${{ needs.canary.result }}
          MORE: ${{ needs.remaining.result }}
        run: |
          set -euo pipefail
          test "$PREFLIGHT" = success && test "$FIRST" = success && test "$MORE" = success
      - uses: actions/checkout@v4
      - name: Download only 8 SHA original numeric parity metadata JSON artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: p2-phase42-*-five-semantic-cached-parity
          path: audit
      - name: Verify 40 independent old/new saved stability outputs matched completely
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          datasets=("technology","financials","consumer_goods","materials","capital_goods_others",
                    "transportation_utilities","exclude_capital_goods_transportation_utilities",
                    "exclude_transportation_utilities")
          root=Path("audit")
          expected={"p2-phase42-"+d+"-five-semantic-cached-parity" for d in datasets}
          actual={p.name for p in root.iterdir() if p.is_dir()}
          assert expected==actual,(sorted(expected-actual),sorted(actual-expected))
          total=0
          for d in datasets:
              x=json.loads((root/("p2-phase42-"+d+"-five-semantic-cached-parity")/"report.json").read_text())
              assert x["status"]=="PASS_PHASE42_FIVE_CACHED_SEMANTIC_OUTPUTS"
              assert x["dataset"]==d and x["file_count"]==len(x["files"])==5
              assert not x["full_semantic_producer_rerun"]
              assert not x["phase40_and_41_successful_work_recomputed"]
              assert not x["phase42_full_29csv_certified"] and not x["release_ready"]
              assert all(v["numeric_and_label_parity"] and v["rows"]>0 for v in x["files"].values())
              total+=len(x["files"])
              print("PASS_PHASE42_5_CSV",d,x["total_seconds"])
          assert total==40
          print("PASS_PHASE42_CACHED_NUMPY_8_DATASETS_40_SAVED_CSV_NUMERICAL_PARITY")
          PY
      - name: No promotion of unverified Phase42 remaining outputs
        if: always()
        run: |
          echo "This certifies five semantic stability CSVs for eight original datasets only." >> "$GITHUB_STEP_SUMMARY"
          echo "Remaining Phase42 semantic CSV families and Phase43 full 29 CSV producer not certified." >> "$GITHUB_STEP_SUMMARY"
          echo "Private original Production P2 v12/source and successful artifact files were not modified." >> "$GITHUB_STEP_SUMMARY"
          echo "No merge/release/deployment." >> "$GITHUB_STEP_SUMMARY"
