name: P2 225 six-group comparison v2 20261004

on:
  push:
    branches: [main]
    paths:
      - '.github/p2_225_group_comparison_v2_trigger'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  SOURCE_RUN_ID: "36979444713"
  SOURCE_ARTIFACT: "p2-225-raw-canonical-mirror-asset-final"
  CORE_BRANCH: "research/p2-nikkei-complete-baseline-20260915"

jobs:
  build_qa_publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve contract
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/p2_225_group_comparison_v2_trigger
          SHA="$(awk -F': ' '$1=="expected_core_head"{print $2}' "$FILE")"
          test -n "$SHA"
          echo "core_sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: ${{ steps.cfg.outputs.core_sha }}
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements.txt

      - run: pip install -r core/requirements.txt

      - name: Compile comparison implementation
        working-directory: core
        run: |
          python -m py_compile             scripts/generate_p2_225_group_comparison_v2.py             scripts/qa_p2_225_group_comparison_v2.py

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: /tmp/source
          repository: yuki746289/product_kabu_actions
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify canonical source
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/source/signal_level_features.csv
          test -f /tmp/source/final_qa_status.json
          test -f /tmp/source/status.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/source")
          q=json.loads((p/"final_qa_status.json").read_text(encoding="utf-8"))
          s=json.loads((p/"status.json").read_text(encoding="utf-8"))
          assert q.get("overall_pass") is True, q
          assert s.get("overall_pass") is True, s
          assert int(s.get("baseline_rows",-1)) == 181318, s
          assert int(s.get("unique_tickers",-1)) == 225, s
          print("canonical source PASS", s.get("baseline_rows"), s.get("unique_tickers"))
          PY

      - name: Generate six-group comparison
        working-directory: core
        run: |
          python scripts/generate_p2_225_group_comparison_v2.py             --features-csv /tmp/source/signal_level_features.csv             --site-root preview/kabu             --output-dir preview/kabu/analysis/225_group_all_period             --expected-rows 181318             --expected-tickers 225

      - name: Verify deterministic regeneration
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/comparison-repro
          python scripts/generate_p2_225_group_comparison_v2.py --features-csv /tmp/source/signal_level_features.csv --site-root preview/kabu --output-dir /tmp/comparison-repro --expected-rows 181318 --expected-tickers 225
          cmp preview/kabu/analysis/225_group_all_period/comparison.html /tmp/comparison-repro/comparison.html
          diff -qr preview/kabu/analysis/225_group_all_period/comparison_data /tmp/comparison-repro/comparison_data

      - name: QA six-group comparison
        working-directory: core
        run: |
          python scripts/qa_p2_225_group_comparison_v2.py             --comparison-dir preview/kabu/analysis/225_group_all_period

      - name: Restrict generated diff
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          BAD="$(git diff --name-only | grep -vE '^preview/kabu/analysis/225_group_all_period/(comparison\.html|comparison_data/)' || true)"
          if [ -n "$BAD" ]; then
            echo "Unexpected generated files:"
            echo "$BAD"
            exit 3
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: p2-225-six-group-comparison-v2
          path: |
            core/preview/kabu/analysis/225_group_all_period/comparison.html
            core/preview/kabu/analysis/225_group_all_period/comparison_data
          retention-days: 30

      - name: Commit and push private core
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/kabu/analysis/225_group_all_period/comparison.html
          git add preview/kabu/analysis/225_group_all_period/comparison_data
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No comparison output changes; verification-only run."
          else
            git commit -m "data: add six-group comparison summary"
            git push origin HEAD:refs/heads/${CORE_BRANCH}
          fi
