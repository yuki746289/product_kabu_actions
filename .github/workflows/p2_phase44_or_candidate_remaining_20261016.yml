# v13: independent all225 canonical combo walkforward bounded test-years 2013-2014 ONLY.
name: P2 Phase44 OR candidate monthly remaining five shards
on:
  push:
    branches: [automation/p2-common-postextract-20261012]
    paths: ['.github/workflows/p2_phase44_or_candidate_remaining_20261016.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-phase44-or-candidate-remaining-20261016
  cancel-in-progress: false
env:
  CORE_SHA: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  remaining:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
          persist-credentials: false
      - name: Preflight immutable Private core and no private workflow
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then exit 1; fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
          python -m py_compile scripts/p2_phase44_or_candidate_shard_20261016.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
          python scripts/p2_phase44_or_candidate_shard_20261016.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: p2-225-raw-canonical-mirror-final
          run-id: 36844054546
          github-token: ${{ github.token }}
          path: core/build/phase44_or_candidate_remaining/reference
      - uses: actions/download-artifact@v4
        with:
          name: p2-225-raw-features-20260930
          run-id: 36703088996
          github-token: ${{ github.token }}
          path: core/build/phase44_or_candidate_remaining/features
      - name: Independently recompute bounded OR candidate monthly-stability shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python scripts/p2_phase44_or_candidate_shard_20261016.py \
            --shard ${{ matrix.shard }} --core core \
            --source core/build/phase44_or_candidate_remaining/features/features.csv \
            --reference core/build/phase44_or_candidate_remaining/reference \
            --report "$RUNNER_TEMP/shard.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'shard.json').read_text())
          assert d['status']=='PASS_PHASE44_NEW_OR_CANDIDATE_MONTHLY_SHARD'
          assert d['shard']==int(os.environ['SHARD']) and d['rows_newly_calculated']==d['end']-d['start'] and d['canonical_total_candidates']==60
          assert d['entire_candidate_key_selection_coverage'] is True and d['numeric_value_and_identity_parity'] is True
          assert d['private_core_sha']=='52df33a6b26f988a1f71f0b61839d6888a96e1b8'
          assert d['prior_success_artifacts_recomputed'] is False
          assert not d['phase44_complete'] and not d['release_ready']
          print("PASS_PHASE44_OR_CANDIDATE_NEXT_SHARD")
          PY
      - name: Cleanup original temporary data and verify no source mutations
        if: always()
        run: |
          rm -rf -- core/build/phase44_or_candidate_remaining
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: p2-phase44-or-candidate-remaining-20261016
          path: ${{ runner.temp }}/shard.json
          retention-days: 21
          if-no-files-found: error

  final_gate:
    needs: remaining
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p2-phase44-or-candidate-canary-20261016
          run-id: 38885382341
          github-token: ${{ github.token }}
          path: original
      - uses: actions/download-artifact@v4
        with:
          pattern: p2-phase44-or-candidate-remaining-*-20261016
          path: evidence
          merge-multiple: false
      - name: Prove all 60 candidate rows, 6 disjoint shards, no source rerun
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          SRC='71fb0dc947a4777610fec2d07e08fac168a7ab1d49ac5028c39ad1b7ec03bdc9'
          SHA='52df33a6b26f988a1f71f0b61839d6888a96e1b8'
          covered=set()
          ok=[]
          errors=[]
          for shard in range(6):
              p=(Path('original/canary.json') if shard==0 else
                 Path('evidence')/
                 ('p2-phase44-or-candidate-remaining-'+str(shard)+'-20261016')/
                 'shard.json')
              if not p.is_file():
                  errors.append(f'missing:{shard}')
                  continue
              d=json.loads(p.read_text(encoding='utf-8'))
              start,end=d.get('start'),d.get('end')
              if (d.get('status')!='PASS_PHASE44_NEW_OR_CANDIDATE_MONTHLY_SHARD'
                  or d.get('shard')!=shard
                  or d.get('total_shards')!=6
                  or d.get('source_sha256')!=SRC
                  or d.get('private_core_sha')!=SHA
                  or d.get('entire_candidate_key_selection_coverage') is not True
                  or d.get('numeric_value_and_identity_parity') is not True
                  or d.get('old_raw_or_recomputed') is not False
                  or d.get('prior_success_artifacts_recomputed') is not False
                  or not isinstance(start,int) or not isinstance(end,int)
                  or start<0 or end>60 or end<=start
                  or end-start!=d.get('rows_newly_calculated')):
                  errors.append(f'invalid:{shard}')
                  continue
              chunk=set(range(start,end))
              if covered.intersection(chunk):
                  errors.append(f'overlap:{shard}')
                  continue
              covered.update(chunk)
              ok.append(shard)
          success=not errors and ok==list(range(6)) and covered==set(range(60))
          result={
              'phase':44,
              'status':'PASS_PHASE44_ALL225_NEW_OR_CANDIDATE_60_ROWS'
                          if success else 'BLOCKED_OR_CANDIDATE_60',
              'verified_shards':ok,'verified_rows':len(covered),
              'errors':errors,'full_new_or_candidate_calculation_certified':success,
              'all_29_new_producer_certified':False,'phase44_complete':False,
              'phase45_allowed':False,'release_ready':False,
          }
          Path('final.json').write_text(json.dumps(result,indent=2)+'\n')
          print('PHASE44_OR_CANDIDATE_FINAL_COVERAGE',result)
          if not success: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-phase44-or-candidate-complete-six-shards-20261016
          path: final.json
          retention-days: 21
          if-no-files-found: warn
