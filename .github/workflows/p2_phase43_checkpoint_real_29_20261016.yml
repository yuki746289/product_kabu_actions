# Phase43 after *finished* Phase42 gate only. Reuse certified original numeric results.
# Run real original common 29CSV assembler with checkpointed inputs and strict SHA.
# Not a claim all Semantic/OR were freshly regenerated in one new producer run.
name: P2 Phase43 real 29 CSV checkpointed pipeline 8 datasets
on:
  push:
    branches: [automation/p2-common-postextract-20261012]
    paths:
      - '.github/workflows/p2_phase43_checkpoint_real_29_20261016.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-phase43-original-checkpoint-real-29-20261016
  cancel-in-progress: false
env:
  CORE_SHA: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
  PYTHONUNBUFFERED: '1'
jobs:
  preflight:
    name: Fail closed unless Phase42 23 Semantic original numeric proof SUCCESS
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Exact old success checks with Phase42 strictly first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/p2_phase43_checkpoint_29_actual_assembler_20261016.py
          for item in '38850891084 f9709aabbfbac6769e9d5d464693085f2416cfd5' \
                      '38844201706 f654c2f1c7380c08c42b1eb0cd31fa3e4809b36b' \
                      '38843586335 2a27bfe7d834a3aec5d21b27fd30ff52782cb8cf' \
                      '38514178506 21f8d9c26529f30b7387ba56153f37769d719214' \
                      '38512534788 de0005db964488955edb4f38d863d485f74840a2' \
                      '38518149928 54c5b357a6e8a9c8767fac8b33b4720c260c70d9' \
                      '38518904606 cadb894e695702aad9b5ff2a3bf91eb32aa0596d'; do
            set -- $item
            q="$(gh api repos/yuki746289/product_kabu_actions/actions/runs/"$1" --jq '.conclusion + " " + .head_sha')"
            test "$q" = "success $2"
          done
          echo "PHASE42_PASSED_BEFORE_PHASE43_CHECKPOINTED_RUN"

  canary:
    name: Real checkpoint-linked 29 CSV assembly (${{ matrix.dataset }})
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - dataset: "technology"
            dir: "225_group_all_period/technology"
            originalRun: 0
            originalArtifact: ""
    env:
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Immutable original Private 29 saved file checkpoints and original assembler
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/assemble_p2_common_dataset_csv.py
            /scripts/p2_html_core/
            /preview/kabu/analysis/${{ matrix.dir }}/*.csv
          persist-credentials: false
      - name: Mandatory Public-only Actions original SHA and no Private workflows
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Private workflows forbidden"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Recover exact pinned exclusion original features if required
        if: ${{ matrix.originalRun != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.originalArtifact }}
          run-id: ${{ matrix.originalRun }}
          github-token: ${{ github.token }}
          path: external_saved
      - name: Prior Phase38 original SHA all29 CSV
        uses: actions/download-artifact@v4
        with:
          name: p2-phase38-${{ matrix.dataset }}-saved-29csv-inventory
          run-id: 38524279221
          github-token: ${{ github.token }}
          path: proof38
      - name: Prior Phase42 23 CSV disaggregated final PASS (all eight source bound)
        uses: actions/download-artifact@v4
        with:
          name: p2-phase42-23-semantic-eight-source-ledger-gate-20261016
          run-id: 38850891084
          github-token: ${{ github.token }}
          path: proof42
      - name: Prior Phase43 original saved lineage
        uses: actions/download-artifact@v4
        with:
          name: p2-phase43-${{ matrix.dataset }}-saved-lineage-crossproof
          run-id: 38842234272
          github-token: ${{ github.token }}
          path: proof43
      - name: Prior genuine FRESH 8 Semantic canonical numerical output ledger
        uses: actions/download-artifact@v4
        with:
          name: p2-phase43-${{ matrix.dataset }}-eight-fresh-canonical-semantic
          run-id: 38844201706
          github-token: ${{ github.token }}
          path: proof8
      - name: Prior actual original Private assembler plus SHA tamper negative controls
        uses: actions/download-artifact@v4
        with:
          name: p2-phase43-${{ matrix.dataset }}-actual-assembler-fixture
          run-id: 38843586335
          github-token: ${{ github.token }}
          path: assembler
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Dependencies required by actual common assembler
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Integrate old numerical checkpoint ledger and call REAL fixed Private 29 CSV assembler
        shell: bash
        run: |
          set -euo pipefail
          python scripts/p2_phase43_checkpoint_29_actual_assembler_20261016.py \
            --dataset "$DATASET" --core core \
            --reference "core/preview/kabu/analysis/${{ matrix.dir }}" \
            --external external_saved \
            --proof38 proof38/audit.json \
            --phase42 "proof42/$DATASET/result.json" \
            --phase43 proof43/report.json \
            --fresh8 proof8/report.json --assembler assembler/report.json \
            --out "$RUNNER_TEMP/report.json"
      - name: Exact SHA and 29 reference CSV parity; explicitly no fresh all producer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"report.json").read_text())
          assert d["dataset"]==os.environ["DATASET"]
          assert d["status"]=="PASS_PHASE43_SOURCE_BOUND_CHECKPOINT_REAL_29_CSV_ASSEMBLY"
          assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert d["physical_output_sha_and_column_parity_files"]==29
          assert d["original_23_semantic_numeric_evidence_passed"] is True
          assert d["real_canonical_29_csv_assembler_executed"] is True
          assert d["full_fresh_single_run_29_numeric_certified"] is False
          assert d["phase43_strict_fresh_only_passed"] is False
          assert d["prior_successful_numeric_computation_repeated"] is False
          assert d["phase48_started"] is False and d["release_ready"] is False
          print("PASS_PHASE43_CHECKPOINTED_REAL_29_CSV_NO_FALSE_FRESH",d["dataset"])
          PY
      - name: Enforce no modification of any original Private canonical source files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Export JSON-only output receipts, no original data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase43-${{ matrix.dataset }}-verified-real-checkpoint-29
          path: ${{ runner.temp }}/report.json
          retention-days: 30
          if-no-files-found: error


  remaining:
    name: Real checkpoint-linked 29 CSV assembly (${{ matrix.dataset }})
    needs: canary
    if: ${{ needs.canary.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - dataset: "financials"
            dir: "225_group_all_period/financials"
            originalRun: 0
            originalArtifact: ""
          - dataset: "consumer_goods"
            dir: "225_group_all_period/consumer_goods"
            originalRun: 0
            originalArtifact: ""
          - dataset: "materials"
            dir: "225_group_all_period/materials"
            originalRun: 0
            originalArtifact: ""
          - dataset: "capital_goods_others"
            dir: "225_group_all_period/capital_goods_others"
            originalRun: 0
            originalArtifact: ""
          - dataset: "transportation_utilities"
            dir: "225_group_all_period/transportation_utilities"
            originalRun: 0
            originalArtifact: ""
          - dataset: "exclude_capital_goods_transportation_utilities"
            dir: "225_exclusion_all_period/exclude_capital_goods_transportation_utilities"
            originalRun: 37201520569
            originalArtifact: "p2-225-exclusion-no-capital-transport-features"
          - dataset: "exclude_transportation_utilities"
            dir: "225_exclusion_all_period/exclude_transportation_utilities"
            originalRun: 37201518110
            originalArtifact: "p2-225-exclusion-no-transport-features"
    env:
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Immutable original Private 29 saved file checkpoints and original assembler
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/assemble_p2_common_dataset_csv.py
            /scripts/p2_html_core/
            /preview/kabu/analysis/${{ matrix.dir }}/*.csv
          persist-credentials: false
      - name: Mandatory Public-only Actions original SHA and no Private workflows
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Private workflows forbidden"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Recover exact pinned exclusion original features if required
        if: ${{ matrix.originalRun != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.originalArtifact }}
          run-id: ${{ matrix.originalRun }}
          github-token: ${{ github.token }}
          path: external_saved
      - name: Prior Phase38 original SHA all29 CSV
        uses: actions/download-artifact@v4
        with:
          name: p2-phase38-${{ matrix.dataset }}-saved-29csv-inventory
          run-id: 38524279221
          github-token: ${{ github.token }}
          path: proof38
      - name: Prior Phase42 23 CSV disaggregated final PASS (all eight source bound)
        uses: actions/download-artifact@v4
        with:
          name: p2-phase42-23-semantic-eight-source-ledger-gate-20261016
          run-id: 38850891084
          github-token: ${{ github.token }}
          path: proof42
      - name: Prior Phase43 original saved lineage
        uses: actions/download-artifact@v4
        with:
          name: p2-phase43-${{ matrix.dataset }}-saved-lineage-crossproof
          run-id: 38842234272
          github-token: ${{ github.token }}
          path: proof43
      - name: Prior genuine FRESH 8 Semantic canonical numerical output ledger
        uses: actions/download-artifact@v4
        with:
          name: p2-phase43-${{ matrix.dataset }}-eight-fresh-canonical-semantic
          run-id: 38844201706
          github-token: ${{ github.token }}
          path: proof8
      - name: Prior actual original Private assembler plus SHA tamper negative controls
        uses: actions/download-artifact@v4
        with:
          name: p2-phase43-${{ matrix.dataset }}-actual-assembler-fixture
          run-id: 38843586335
          github-token: ${{ github.token }}
          path: assembler
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Dependencies required by actual common assembler
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Integrate old numerical checkpoint ledger and call REAL fixed Private 29 CSV assembler
        shell: bash
        run: |
          set -euo pipefail
          python scripts/p2_phase43_checkpoint_29_actual_assembler_20261016.py \
            --dataset "$DATASET" --core core \
            --reference "core/preview/kabu/analysis/${{ matrix.dir }}" \
            --external external_saved \
            --proof38 proof38/audit.json \
            --phase42 "proof42/$DATASET/result.json" \
            --phase43 proof43/report.json \
            --fresh8 proof8/report.json --assembler assembler/report.json \
            --out "$RUNNER_TEMP/report.json"
      - name: Exact SHA and 29 reference CSV parity; explicitly no fresh all producer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"report.json").read_text())
          assert d["dataset"]==os.environ["DATASET"]
          assert d["status"]=="PASS_PHASE43_SOURCE_BOUND_CHECKPOINT_REAL_29_CSV_ASSEMBLY"
          assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert d["physical_output_sha_and_column_parity_files"]==29
          assert d["original_23_semantic_numeric_evidence_passed"] is True
          assert d["real_canonical_29_csv_assembler_executed"] is True
          assert d["full_fresh_single_run_29_numeric_certified"] is False
          assert d["phase43_strict_fresh_only_passed"] is False
          assert d["prior_successful_numeric_computation_repeated"] is False
          assert d["phase48_started"] is False and d["release_ready"] is False
          print("PASS_PHASE43_CHECKPOINTED_REAL_29_CSV_NO_FALSE_FRESH",d["dataset"])
          PY
      - name: Enforce no modification of any original Private canonical source files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Export JSON-only output receipts, no original data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase43-${{ matrix.dataset }}-verified-real-checkpoint-29
          path: ${{ runner.temp }}/report.json
          retention-days: 30
          if-no-files-found: error

  final_gate:
    name: Require 8 datasets, 29 old source SHA output and genuine original assembler
    needs: [preflight,canary,remaining]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Mandatory preflight and every previous partial proof PASS
        shell: bash
        env:
          P: ${{ needs.preflight.result }}
          C: ${{ needs.canary.result }}
          R: ${{ needs.remaining.result }}
        run: |
          set -euo pipefail
          test "$P" = success && test "$C" = success && test "$R" = success
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p2-phase43-*-verified-real-checkpoint-29
          path: evidence
      - name: Source-bound checkpointed Phase43 eight dataset all 29 receipts must PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=("technology","financials","consumer_goods","materials","capital_goods_others",
              "transportation_utilities","exclude_capital_goods_transportation_utilities",
              "exclude_transportation_utilities")
          root=Path("evidence")
          expected={"p2-phase43-"+name+"-verified-real-checkpoint-29" for name in d}
          assert {p.name for p in root.iterdir() if p.is_dir()}==expected
          for name in d:
              x=json.loads((root/("p2-phase43-"+name+"-verified-real-checkpoint-29")/"report.json").read_text())
              assert x["status"]=="PASS_PHASE43_SOURCE_BOUND_CHECKPOINT_REAL_29_CSV_ASSEMBLY"
              assert x["dataset"]==name and x["physical_output_sha_and_column_parity_files"]==29
              assert x["full_fresh_single_run_29_numeric_certified"] is False
              assert x["phase43_strict_fresh_only_passed"] is False
              assert x["release_ready"] is False
              print("PASS_PHASE43_29_SHA_SOURCE_CHECKPOINT_ONLY",name)
          print("PASS_PHASE43_8_DATASETS_232_CHECKPOINT_REPLAY_CSV_FILES")
          PY
      - name: Clear strict producer scope and release gate
        if: always()
        run: |
          echo "PASS here is checkpointed replay of previous genuinely independently certified Semantic and OR calculations via ACTUAL common 29CSV assembler, NOT all-fresh 29 CSV single-run numeric validation." >> "$GITHUB_STEP_SUMMARY"
          echo "No successful numeric artifact recomputed, no Private workflow, no PR merge, release or deploy." >> "$GITHUB_STEP_SUMMARY"
