name: Active P1/P2 market regime validation charts

on:
  push:
    paths:
      - ".github/workflows/market_regime_validation_active.yml"
      - "trigger/market_regime_validation_active.txt"

permissions:
  contents: read
  actions: read

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private active core
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: fix/p2-daily-anchor-pullback-cases
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: _core
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _core/requirements.txt

      - name: Install Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r _core/requirements.txt

      - name: Syntax check new active validation code
        working-directory: _core
        run: |
          python -m py_compile \
            scripts/final_screen_rules_active.py \
            scripts/check_active_logic_policy.py \
            scripts/fetch_historical_validation_data.py \
            scripts/validate_market_regimes_active.py \
            scripts/generate_market_regime_review_charts.py

      - name: Enforce active logic policy and smoke test
        working-directory: _core
        run: python scripts/check_active_logic_policy.py

      - name: Fetch isolated historical replay data
        working-directory: _core
        run: python scripts/fetch_historical_validation_data.py

      - name: Run P1/P2 x five-regime active validation
        working-directory: _core
        run: python scripts/validate_market_regimes_active.py --workers 4

      - name: Render all extracted tickers with canonical renderer
        working-directory: _core
        run: python scripts/generate_market_regime_review_charts.py

      - name: Verify active logic, statistics, images and marker counts
        working-directory: _core
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('data/diagnostics/market_regime_validation')
          validation = json.loads((root / 'validation_status.json').read_text(encoding='utf-8'))
          charts = json.loads((root / 'chart_status.json').read_text(encoding='utf-8'))
          historical = json.loads((root / 'historical_status.json').read_text(encoding='utf-8'))
          signals = pd.read_csv(root / 'signals.csv')
          stats = pd.read_csv(root / 'performance_by_regime_direction.csv')
          periods = pd.read_csv(root / 'period_status.csv')
          manifest = pd.read_csv(root / 'chart_manifest.csv')

          assert validation['overall_pass'], validation
          assert historical['overall_pass'], historical
          assert charts['overall_pass'], charts
          assert validation['active_logic_id'] == 'active-2026-09-10-p1-current-p2-v12'
          assert validation['p1_logic_id'] == 'p1-current-2026-09-07'
          assert validation['p2_logic_id'] == 'p2-v12-daily-anchor-pullback-cases'
          assert validation['active_module'] == 'scripts/final_screen_rules_active.py'
          assert validation['period_count'] == 10
          assert validation['validation_failures'] == 0
          assert historical['survivorship_bias'] is True
          assert charts['renderer'] == 'scripts/generate_backtest_review_charts.py'
          assert charts['rules'] == 'docs/10_HISTORICAL_REVIEW_CHART_RULES.md'
          assert charts['triangle_labels'] == {'long': '△', 'short': '▽'}
          assert len(periods) == 10
          assert len(stats) == 30
          assert set(stats['direction']) == {'all', 'long', 'short'}
          assert set(periods['scope']) == {'p1', 'p2'}
          assert set(periods['regime']) == {'uptrend','downtrend','range','consolidation','mixed'}
          if len(signals):
              assert set(signals['active_logic_id']) == {'active-2026-09-10-p1-current-p2-v12'}
              assert set(signals['direction']).issubset({'long','short'})
              assert set(signals['pattern']).issubset({'P1','P1+','P2','P2+'})
          expected_images = signals.groupby(['scope','regime','ticker']).ngroups if len(signals) else 0
          assert expected_images == len(manifest), (expected_images, len(manifest))
          assert charts['rendered_signal_markers'] == len(signals)
          pngs = list((root / 'charts').glob('*/*/images/*.png'))
          assert len(pngs) == len(manifest), (len(pngs), len(manifest))
          print(json.dumps(validation, ensure_ascii=False, indent=2))
          print(json.dumps(charts, ensure_ascii=False, indent=2))
          print(stats.to_string(index=False))
          PY

      - name: Preserve rules and selected periods in artifact
        working-directory: _core
        run: |
          cp config/market_regime_periods_active.csv data/diagnostics/market_regime_validation/selected_periods.csv
          cp docs/11_ACTIVE_LOGIC_POLICY.md data/diagnostics/market_regime_validation/ACTIVE_LOGIC_POLICY.md
          cp docs/10_HISTORICAL_REVIEW_CHART_RULES.md data/diagnostics/market_regime_validation/HISTORICAL_REVIEW_CHART_RULES.md
          rm -rf data/diagnostics/market_regime_validation/historical_derived

      - uses: actions/upload-artifact@v4
        with:
          name: active-market-regime-validation-charts
          path: _core/data/diagnostics/market_regime_validation
          if-no-files-found: error
          retention-days: 30
