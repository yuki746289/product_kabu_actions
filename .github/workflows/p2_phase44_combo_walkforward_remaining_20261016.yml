# v13: independent all225 canonical combo walkforward bounded test-years 2013-2014 ONLY.
name: P2 Phase44 combo walkforward all225 six remaining shards
on:
  push:
    branches: [automation/p2-common-postextract-20261012]
    paths: ['.github/workflows/p2_phase44_combo_walkforward_remaining_20261016.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-phase44-combo-walkforward-remaining-20261016
  cancel-in-progress: false
env:
  CORE_SHA: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  remaining_shards:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
          persist-credentials: false
      - name: Preflight immutable Private core and no private workflow
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then exit 1; fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
          python -m py_compile scripts/p2_phase44_all225_combo_walkforward_shard_20261016.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
          python scripts/p2_phase44_all225_combo_walkforward_shard_20261016.py --selftest
      - uses: actions/download-artifact@v4
        with:
          name: p2-225-raw-canonical-mirror-final
          run-id: 36844054546
          github-token: ${{ github.token }}
          path: core/build/phase44_combo_sharded/reference
      - uses: actions/download-artifact@v4
        with:
          name: p2-225-raw-features-20260930
          run-id: 36703088996
          github-token: ${{ github.token }}
          path: core/build/phase44_combo_sharded/features
      - name: Independently recompute only selected 2-year shard, all pair/triple candidates
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python scripts/p2_phase44_all225_combo_walkforward_shard_20261016.py \
            --shard ${{ matrix.shard }} --core core \
            --source core/build/phase44_combo_sharded/features/features.csv \
            --reference core/build/phase44_combo_sharded/reference \
            --report "$RUNNER_TEMP/shard.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'shard.json').read_text())
          assert d['status']=='PASS_PHASE44_ALL225_CANONICAL_COMBO_WALKFORWARD_TWO_YEARS'
          assert d['years']==[2013+2*int(os.environ['SHARD']),2014+2*int(os.environ['SHARD'])] and d['rows_compared']==12
          assert d['all_column_value_and_identity_equal'] is True
          assert d['private_core_sha']=='52df33a6b26f988a1f71f0b61839d6888a96e1b8'
          assert d['source_signals_recomputed'] is False
          assert not d['all_29_full_newproducer_certified'] and not d['release_ready']
          print("PASS_PHASE44_COMBO_WALKFORWARD_CANARY_YEAR_GROUP")
          PY
      - name: Cleanup original temporary data and verify no source mutations
        if: always()
        run: |
          rm -rf -- core/build/phase44_combo_sharded
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: p2-phase44-combo-walkforward-shard-${{ matrix.shard }}-20261016
          path: ${{ runner.temp }}/shard.json
          retention-days: 21
          if-no-files-found: error

  full_year_gate:
    name: Verify all 7 original-data two-year certificates without recomputing canary
    needs: remaining_shards
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p2-phase44-combo-walkforward-canary-20261016
          run-id: 38883633174
          github-token: ${{ github.token }}
          path: canary
      - uses: actions/download-artifact@v4
        with:
          pattern: p2-phase44-combo-walkforward-shard-*-20261016
          path: receipts
          merge-multiple: false
      - name: All 14 test-years, exact source and numerical rows
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          SHA='52df33a6b26f988a1f71f0b61839d6888a96e1b8'
          SOURCE='71fb0dc947a4777610fec2d07e08fac168a7ab1d49ac5028c39ad1b7ec03bdc9'
          done=[]
          observed=set()
          rows=0
          problems=[]
          for shard in range(7):
              path=(Path('canary/canary.json') if shard==0 else
                  Path('receipts')/
                  ('p2-phase44-combo-walkforward-shard-'+str(shard)+'-20261016')/
                  'shard.json')
              if not path.exists():
                  problems.append('Missing shard '+str(shard))
                  continue
              d=json.loads(path.read_text(encoding='utf-8'))
              if (d.get('status')!='PASS_PHASE44_ALL225_CANONICAL_COMBO_WALKFORWARD_TWO_YEARS'
                  or d.get('shard')!=shard or d.get('private_core_sha')!=SHA
                  or d.get('old_full_source_sha256')!=SOURCE
                  or d.get('years')!=[2013+2*shard,2014+2*shard]
                  or d.get('rows_compared')!=12
                  or d.get('all_column_value_and_identity_equal') is not True
                  or d.get('source_signals_recomputed') is not False
                  or d.get('prior_success_artifacts_recomputed') is not False):
                  problems.append('Invalid provenance in shard '+str(shard))
                  continue
              if observed.intersection(d['years']):
                  problems.append('Duplicate year in shard '+str(shard))
                  continue
              observed.update(d['years'])
              done.append(shard)
              rows+=d['rows_compared']
          passed=(not problems and len(done)==7 and rows==84
                  and observed==set(range(2013,2027)))
          result={
              'phase':44,
              'status':'PASS_PHASE44_ALL225_COMBO_WALKFORWARD_84_ROWS_NUMERIC'
                         if passed else 'BLOCKED_PHASE44_COMBO_WALKFORWARD',
              'source_sha256':SOURCE,'private_core_sha':SHA,
              'shards_passed':done,'year_count':len(observed),
              'canonical_result_rows_verified':rows,
              'missing_or_bad':problems,
              'one_more_new_csv_family_pass':passed,
              'full_29_new_producer_certified':False,
              'phase44_complete':False,'phase45_allowed':False,
              'release_ready':False,'phase48_authorized':False}
          Path('final.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print('PHASE44_ORIGINAL_WALKFORWARD_SHARDED_GATE',result)
          if not passed:raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-phase44-combo-walkforward-all14-years-gate-20261016
          path: final.json
          if-no-files-found: warn
          retention-days: 21
