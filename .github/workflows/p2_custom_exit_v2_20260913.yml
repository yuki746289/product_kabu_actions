name: P2 custom exit v2 20260913

on:
  push:
    branches:
      - research/p2-custom-exit-v2-20260913
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: research/p2-hypotheses-20260911
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy tabulate yfinance
      - name: Download canonical P2 features
        uses: actions/download-artifact@v4
        with:
          name: p2-stage-b-b9w-aggregate
          path: core/data/diagnostics/p2_stage_b/custom_v2_input
          repository: yuki746289/product_kabu_actions
          run-id: 34681101657
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Syntax check
        working-directory: core
        run: |
          python -m py_compile scripts/analyze_p2_custom_exit_v2.py
          python -m py_compile scripts/analyze_p2_custom_exit_v2_cap.py
      - name: Run analysis
        working-directory: core
        run: python scripts/analyze_p2_custom_exit_v2_cap.py --features data/diagnostics/p2_stage_b/custom_v2_input/features.csv
      - name: Verify result
        working-directory: core
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          p=Path('data/diagnostics/p2_stage_b/custom_exit_v2_20260913/status.json')
          s=json.loads(p.read_text(encoding='utf-8'))
          assert s['test']=='p2_custom_exit_v2', s
          assert s['overall_pass'] is True, s
          assert s['bad_hold_rows']==0, s
          q=pd.read_csv('data/diagnostics/p2_stage_b/custom_exit_v2_20260913/signal_custom_v2.csv')
          assert pd.to_numeric(q['V2_5PT_next_open_hold_days'], errors='coerce').max() <= 20, 'V2_5PT next-open >20D'
          assert pd.to_numeric(q['V2_2DAY_next_open_hold_days'], errors='coerce').max() <= 20, 'V2_2DAY next-open >20D'
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-custom-exit-v2-20260913
          path: core/data/diagnostics/p2_stage_b/custom_exit_v2_20260913
          retention-days: 7
