# Created: 2026-10-14 JST
# Phase35 new common raw OR2/OR3 exhaustive unseen conditions, disjoint modulo SHA.
# Prior Phase15/16/21/23/24 and Phase32/33 successes are SKIPPED, never rerun.
# Canary technology OR2 shard 0 -> OR2 remainder -> OR3 all -> final coverage.
# Stop on any missing prior proof, code SHA, original CSV SHA or numeric inequality.
# No old artifacts, CSV, signals, HTML or Production P2 changes, no release/deploy.
name: P2 Phase35 unseen full raw OR numeric gated shards
on:
  push:
    branches: [automation/p2-common-postextract-20261012]
    paths:
      - '.github/workflows/p2_phase35_unseen_raw_or_20261014.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-phase35-raw-or-unseen-20261014
  cancel-in-progress: false
env:
  CORE_SHA: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  selftest:
    name: Confirm Phase34 success SHA and Phase35 disjoint selector contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax/selftest, original Phase34 final gate, and fixed SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          python -m py_compile scripts/p2_common_phase35_raw_or_shard_20261014.py
          python scripts/p2_common_phase35_raw_or_shard_20261014.py --selftest
          gh api repos/yuki746289/product_kabu_actions/actions/runs/38512534788 --jq '.conclusion + " " + .head_sha' | \
            grep -Fx 'success de0005db964488955edb4f38d863d485f74840a2'

  canary:
    name: Phase35 unseen ${{ matrix.kind }} full numeric shard (${{ matrix.dataset }}, ${{ matrix.index }})
    needs: selftest
    if: ${{ needs.selftest.result == 'success' }}
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        include:
          - dataset: "technology"
            kind: "or2"
            index: 0
            dir: "225_group_all_period/technology"
            sourceRun: 0
            sourceArtifact: ""
            proof4: "p2-common-exact-six-group-identities"
            proofFile: "group.json"
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      DATASET: ${{ matrix.dataset }}
      KIND: ${{ matrix.kind }}
      INDEX: '${{ matrix.index }}'
    steps:
      - uses: actions/checkout@v4
      - name: Read immutable original code, saved features and full raw OR CSVs
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
            /preview/kabu/analysis/${{ matrix.dir }}/signal_level_features.csv
            /preview/kabu/analysis/${{ matrix.dir }}/advantage_single_candidates.csv
            /preview/kabu/analysis/${{ matrix.dir }}/or_pairwise_all.csv
            /preview/kabu/analysis/${{ matrix.dir }}/or_triple_all.csv
            /preview/kabu/analysis/${{ matrix.dir }}/semantic_status.json
          persist-credentials: false
      - name: Enforce Public-only, Private core fixed SHA and zero private workflows
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Private workflows prohibited"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse original exclusion saved feature artifact (no new extraction)
        if: ${{ matrix.sourceRun != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sourceArtifact }}
          run-id: ${{ matrix.sourceRun }}
          github-token: ${{ github.token }}
          path: original_source
      - name: Reuse prior immutable Phase4 source identity proof
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.proof4 }}
          run-id: 38239501315
          github-token: ${{ github.token }}
          path: phase4
      - name: Reuse successful Phase33 source-bound new OR proof
        uses: actions/download-artifact@v4
        with:
          name: p2-phase33-${{ matrix.dataset }}-or2-or3-new
          run-id: 38510961490
          github-token: ${{ github.token }}
          path: proof33
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install pinned original requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Calculate only new raw OR conditions in this deterministic shard
        shell: bash
        run: |
          set -euo pipefail
          test -f "phase4/${{ matrix.proofFile }}" && test -f proof33/audit.json
          python scripts/p2_common_phase35_raw_or_shard_20261014.py \
            --core core --dataset "$DATASET" --kind "$KIND" --index "$INDEX" \
            --reference "core/preview/kabu/analysis/${{ matrix.dir }}" \
            --source-root original_source \
            --proof4 "phase4/${{ matrix.proofFile }}" \
            --proof33 proof33/audit.json \
            --report "$RUNNER_TEMP/audit.json"
      - name: Independently validate SHA, per-kind complete reference and no prior rerun
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"audit.json").read_text(encoding="utf-8"))
          assert d["status"]=="PASS_PHASE35_NEW_RAW_OR_SHARD"
          assert d["dataset"]==os.environ["DATASET"]
          assert d["kind"]==os.environ["KIND"] and d["shard_index"]==int(os.environ["INDEX"])
          assert d["shard_count"]==(4 if d["kind"]=="or2" else 8)
          assert d["raw_file"]==("or_pairwise_all.csv" if d["kind"]=="or2" else "or_triple_all.csv")
          assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert d["selected_raw_rows"]>0 and d["numeric_fields_checked"]>=d["selected_raw_rows"]*35
          assert d["original_raw_count"]==d["remaining_unseen_total"]+52
          assert d["prior_legacy_skipped"]==40 and d["prior_new_skipped"]==12
          assert d["mismatch_count"]==0 and d["error_sample"]==[]
          assert d["new_common_combo_metrics_called"] is True
          assert d["legacy_direct_proof_is_new_producer_certification"] is False
          for flag in ("prior_certified_conditions_recomputed","prior_success_artifacts_recomputed",
                       "full_raw_bundle_recomputed","source_signals_recomputed",
                       "original_data_modified","production_changed","html_generated",
                       "release_ready"):
              assert d[flag] is False,flag
          print("PASS_PHASE35_UNSEEN_RAW_OR_NUMERIC",d["dataset"],d["kind"],d["shard_index"])
          PY
      - name: Confirm immutable Private tracked files unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Upload only compact metadata JSON, no original private OR rows
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase35-${{ matrix.dataset }}-${{ matrix.kind }}-part-${{ matrix.index }}
          path: ${{ runner.temp }}/audit.json
          retention-days: 14
          if-no-files-found: error


