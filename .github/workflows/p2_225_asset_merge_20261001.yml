name: P2 225 asset-chart merge 20261001

on:
  push:
    branches: [main]
    paths:
      - '.github/p2_225_asset_merge_trigger'

concurrency:
  group: p2-225-asset-merge-20261001
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  BASE_SHELL_RUN_ID: "36844054546"
  NEW_SHARD_RUN_ID: "36844054546"

jobs:
  merge_qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve core SHA
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(awk -F': ' '$1=="core_expected_commit"{print $2}' .github/p2_225_asset_merge_trigger)"
          test -n "$SHA"
          echo "core_sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: ${{ steps.cfg.outputs.core_sha }}
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements.txt

      - name: Verify Actions architecture
        run: |
          python scripts/check_actions_architecture.py \
            --core-dir core \
            --expected-core-sha "${{ steps.cfg.outputs.core_sha }}"

      - name: Install QA dependencies
        run: pip install -r core/requirements.txt

      - name: Download previous validated shell
        uses: actions/download-artifact@v4
        with:
          name: p2-225-raw-render-shell
          path: /tmp/merged
          repository: yuki746289/product_kabu_actions
          run-id: ${{ env.BASE_SHELL_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download new asset-chart condition shards
        uses: actions/download-artifact@v4
        with:
          pattern: p2-225-raw-condition-shard-*
          path: /tmp/shards
          merge-multiple: false
          repository: yuki746289/product_kabu_actions
          run-id: ${{ env.NEW_SHARD_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge new condition pages
        shell: bash
        run: |
          set -euo pipefail
          test "$(find /tmp/shards -mindepth 1 -maxdepth 1 -type d -name 'p2-225-raw-condition-shard-*' | wc -l)" -eq 16
          mkdir -p /tmp/merged/conditions/charts
          find /tmp/merged/conditions -maxdepth 1 -type f -name '*.html' ! -name 'index.html' -delete
          rm -f /tmp/merged/conditions/charts/*.html
          for d in /tmp/shards/p2-225-raw-condition-shard-*; do
            cp "$d"/conditions/*.html /tmp/merged/conditions/
            cp "$d"/conditions/charts/*.html /tmp/merged/conditions/charts/
          done

      - name: Regenerate high-entry page and non-canonical candidate charts
        run: |
          PYTHONPATH=core/scripts python - <<'PY'
          from pathlib import Path
          import generate_p2_high_entry_accuracy_report as high

          root=Path("/tmp/merged")
          high.OUT=root
          high.ANALYSIS=root/"analysis"
          high.r.OUT=root
          high.main()
          PY

      - name: Verify requested condition link and asset chart
        run: |
          python - <<'PY'
          import html
          import re
          from pathlib import Path

          root=Path("/tmp/merged")
          label="EMAモーション：転換 × 週足RCI26：中位・上向き"
          esc=html.escape(label)
          high=(root/"analysis"/"high_entry_accuracy.html").read_text(encoding="utf-8")
          pat=r'<a href="([^"]+)"[^>]*>'+re.escape(esc)+r'</a>'
          m=re.search(pat,high)
          assert m, "requested condition is still not clickable"
          href=m.group(1)
          assert href.startswith("high_entry_charts/") or href.startswith("../conditions/charts/"), href

          if href.startswith("high_entry_charts/"):
              chart=root/"analysis"/href
          else:
              chart=(root/"analysis"/href).resolve()
          assert chart.exists(), chart
          text=chart.read_text(encoding="utf-8")
          for marker in ("参考資産指数","assetChart","assetCurrent","assetDrawdown","monthlyReturn"):
              assert marker in text, marker
          assert '"r5":' in text and '"r10":' in text and '"r20":' in text
          print("verified_href=",href)
          print("verified_chart=",chart)
          PY

      - name: Verify canonical filename inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          canonical=Path("core/preview/kabu")
          merged=Path("/tmp/merged")
          for rel in ("conditions","conditions/charts"):
              a=sorted(p.name for p in (canonical/rel).glob("*.html"))
              b=sorted(p.name for p in (merged/rel).glob("*.html"))
              print(rel,"canonical=",len(a),"merged=",len(b))
              assert a==b, rel
          PY

      - name: Final QA
        working-directory: core
        run: |
          python scripts/qa_p2_225_nikkei_mirror.py \
            --canonical-dir preview/kabu \
            --mirror-dir /tmp/merged
          python - <<'PY'
          import json
          p="/tmp/merged/final_qa_status.json"
          x=json.load(open(p,encoding="utf-8"))
          assert x["overall_pass"] is True, x
          assert x["new_broken_link_count"] == 0, x
          print(json.dumps(x,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: p2-225-raw-canonical-mirror-asset-final
          path: /tmp/merged
          retention-days: 30
