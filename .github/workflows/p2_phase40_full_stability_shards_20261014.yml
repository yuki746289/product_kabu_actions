          name: full-phase40-${{ matrix.dataset }}-shard-${{ matrix.part }}
          path: ${{ runner.temp }}/report.json
          retention-days: 20
          if-no-files-found: error

  final_gate:
    name: Prove 8 datasets all previous + newly calculated original stability candidates accounted for
    needs: [selftest,canary,remaining]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Never claim complete when any shard was skipped or failed
        env:
          S: ${{ needs.selftest.result }}
          A: ${{ needs.canary.result }}
          B: ${{ needs.remaining.result }}
        run: |
          set -euo pipefail
          test "$S" = success && test "$A" = success && test "$B" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: full-phase40-*-shard-*
          path: evidence
      - name: Exact disjoint exhaustive all-original-candidate source coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          ds=("technology","financials","consumer_goods","materials","capital_goods_others",
              "transportation_utilities","exclude_capital_goods_transportation_utilities",
              "exclude_transportation_utilities")
          root=Path("evidence")
          expected={"full-phase40-"+d+"-shard-"+str(i) for d in ds for i in range(8)}
          observed={x.name for x in root.iterdir() if x.is_dir()}
          assert expected==observed,(sorted(expected-observed),sorted(observed-expected))
          for dataset in ds:
              parts=[]
              for n in range(8):
                  j=json.loads((root/("full-phase40-"+dataset+"-shard-"+str(n))/"report.json").read_text(encoding="utf-8"))
                  assert j["status"]=="PASS_FULL_REMAINING_COMBO_STABILITY_SHARD"
                  assert j["dataset"]==dataset and j["shard"]==n
                  assert j["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
                  assert j["previously_certified_conditions_recomputed"] is False
                  assert j["failures"]==[] and j["release_ready"] is False
                  parts.append(j)
              keys=[x for j in parts for x in j["new_condition_digest_list"]]
              assert len(keys)==len(set(keys))
              assert len({j["source_sha256"] for j in parts})==1
              assert len({j["original_stability_sha256"] for j in parts})==1
              sum_for_dataset=0
              for kind in ("pair","triple"):
                  totals={j["kinds"][kind]["saved_candidate_total"] for j in parts}
                  assert len(totals)==1
                  total=next(iter(totals))
                  actual=sum(j["kinds"][kind]["new_rows_checked"] for j in parts)
                  assert actual+23==total,(dataset,kind,actual,total)
                  sum_for_dataset+=total
              assert sum_for_dataset==parts[0]["expected_original_stability_rows"]
              assert len(keys)==sum_for_dataset-46
              print("PASS_ALL_REMAINING_STABILITY_NUMERIC",dataset,"old+new",sum_for_dataset)
          print("PASS_ALL_EIGHT_FULL_COMBINATION_STABILITY_CONDITION_NUMERIC_PARITY")
          PY
      - name: State no release and no full walkforward or 29CSV claim
        if: always()
        run: |
          echo "This verifies exhaustive original candidate combination stability only." >> "$GITHUB_STEP_SUMMARY"
          echo "Walkforward full numerical parity, 29CSV end-to-end and all225 remain separately uncertified." >> "$GITHUB_STEP_SUMMARY"
          echo "Private P2 v12 and saved artifacts unchanged. No release, PR merge or deployment." >> "$GITHUB_STEP_SUMMARY"
