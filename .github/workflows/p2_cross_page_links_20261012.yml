# Created: 2026-10-12 JST
# Read-only, sharded predeploy checks. No deployment step, no data regeneration.
name: P2 predeploy cross-page legacy URL and navigation audit
on:
  push:
    branches:
      - audit/p2-cross-page-links-20261012
    paths:
      - .github/workflows/p2_cross_page_links_20261012.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: p2-predeploy-crosslinks-20261012
  cancel-in-progress: false

env:
  CORE_SHA: d3b173fb073a5938631d9bccf57edaf0bb6a8c51
  PYTHONUNBUFFERED: '1'

jobs:
  crosslinks:
    name: crosslinks (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - shard: root
            sparse: |
              /preview/kabu/*.html
              /preview/kabu/*.htm
              /preview/kabu/*.js
              /preview/kabu/*.xml
              /preview/kabu/_runtime/**
              /preview/kabu/_samples/**
          - shard: conditions
            sparse: |
              /preview/kabu/conditions/**
          - shard: details
            sparse: |
              /preview/kabu/details/**
          - shard: summaries
            sparse: |
              /preview/kabu/summaries/**
          - shard: analysis_root
            sparse: |
              /preview/kabu/analysis/*.html
              /preview/kabu/analysis/*.htm
              /preview/kabu/analysis/*.js
              /preview/kabu/analysis/*.xml
              /preview/kabu/analysis/*.json
          - shard: 225_exclusion_all_period
            sparse: |
              /preview/kabu/analysis/225_exclusion_all_period/**
          - shard: 225_indicator_stageb
            sparse: |
              /preview/kabu/analysis/225_indicator_stageb/**
          - shard: 225_indicators
            sparse: |
              /preview/kabu/analysis/225_indicators/**
          - shard: 225_sector_all_period
            sparse: |
              /preview/kabu/analysis/225_sector_all_period/**
          - shard: or_charts
            sparse: |
              /preview/kabu/analysis/or_charts/**
          - shard: or_details
            sparse: |
              /preview/kabu/analysis/or_details/**
          - shard: group_globals
            sparse: |
              /preview/kabu/analysis/225_group_all_period/*.html
              /preview/kabu/analysis/225_group_all_period/*.htm
              /preview/kabu/analysis/225_group_all_period/*.js
              /preview/kabu/analysis/225_group_all_period/*.xml
              /preview/kabu/analysis/225_group_all_period/*.json
              /preview/kabu/analysis/225_group_all_period/charts/**
              /preview/kabu/analysis/225_group_all_period/comparison_data/**
          - shard: group_technology
            sparse: |
              /preview/kabu/analysis/225_group_all_period/technology/**
          - shard: group_financials
            sparse: |
              /preview/kabu/analysis/225_group_all_period/financials/**
          - shard: group_consumer_goods
            sparse: |
              /preview/kabu/analysis/225_group_all_period/consumer_goods/**
          - shard: group_materials
            sparse: |
              /preview/kabu/analysis/225_group_all_period/materials/**
          - shard: group_capital_goods_others
            sparse: |
              /preview/kabu/analysis/225_group_all_period/capital_goods_others/**
          - shard: group_transportation_utilities
            sparse: |
              /preview/kabu/analysis/225_group_all_period/transportation_utilities/**
    steps:
      - name: Checkout public audit code
        uses: actions/checkout@v4
      - name: Read-only sparse checkout of fixed private release
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: d3b173fb073a5938631d9bccf57edaf0bb6a8c51
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            ${{ matrix.sparse }}
          persist-credentials: false
      - name: Enforce public Actions architecture before analysis
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'yuki746289/product_kabu_actions'
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD -- .github/workflows | grep -E '\.ya?ml$'; then
            echo '::error::Private workflow present'; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse six successful 2026-10-12 old URL inventories
        uses: actions/download-artifact@v4
        with:
          run-id: 38127100421
          github-token: ${{ github.token }}
          pattern: p2-nextstage-gate-*
          merge-multiple: false
          path: manifests
      - name: Compile auditor
        run: python -m py_compile scripts/p2_cross_page_links_20261012.py
      - name: Audit assigned source HTML JS sitemap and internal links
        run: |
          python scripts/p2_cross_page_links_20261012.py --mode scan \
            --core core --manifests manifests --shard "${{ matrix.shard }}" \
            --out "audit_out/${{ matrix.shard }}"
      - name: Confirm private checkout unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Persist shard checkpoint including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-crosslink-${{ matrix.shard }}-20261012
          path: audit_out/${{ matrix.shard }}/cross_links.json
          if-no-files-found: warn
          retention-days: 30

  final_gate:
    needs: crosslinks
    if: ${{ needs.crosslinks.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download all existing shard result JSONs
        uses: actions/download-artifact@v4
        with:
          pattern: p2-crosslink-*-20261012
          merge-multiple: false
          path: audit_results
      - name: Require exactly all expected successful shards
        run: |
          python scripts/p2_cross_page_links_20261012.py --mode final \
            --folder audit_results --out final_result
      - name: Store final cross-page gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-crosslink-final-gate-20261012
          path: final_result/final_cross_link_gate.json
          if-no-files-found: warn
          retention-days: 30
