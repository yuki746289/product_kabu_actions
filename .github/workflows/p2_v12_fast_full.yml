name: P2 v12 optimized full diagnostic

on:
  push:
    paths:
      - ".github/workflows/p2_v12_fast_full.yml"
      - "trigger/p2_v12_fast_full.txt"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private prototype
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: fix/p2-daily-anchor-pullback-cases
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: _core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _core/requirements.txt
      - run: pip install -r _core/requirements.txt
      - name: Run optimized full diagnostic
        working-directory: _core
        run: python scripts/diagnose_p2_v12_fast_full.py
      - uses: actions/upload-artifact@v4
        with:
          name: p2-v12-fast-full
          path: _core/data/diagnostics/p2_v12_fast
          if-no-files-found: error
          retention-days: 14
