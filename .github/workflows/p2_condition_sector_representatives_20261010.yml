# Created: 2026-10-10 JST
# Approved scope: five remaining sectors, S/P/T 15 condition pairs, 30 HTML pages. No deployment.
# Updated: 2026-10-10 JST - five-sector SPT 30 pages PASS; manual dispatch only.
name: P2 Five sector SPT representatives audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p2-condition-five-sector-representatives-20261010
  cancel-in-progress: false

jobs:
  audit_sector:
    name: Representative audit - ${{ matrix.dataset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        dataset: [financials, consumer_goods, materials, capital_goods_others, transportation_utilities]
    env:
      CORE_SHA: c0c69be8e28ddfa5812c1bbe4ba3d33f432fbf02
      CORE_BRANCH: research/p2-nikkei-complete-baseline-20260915
      LEGACY_RENDER_SHA: 3dfb14cd0f05125c4bfce81d710db0ced073b7c3
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: scripts
    steps:
      - name: Checkout public Actions repository
        uses: actions/checkout@v4
      - name: Checkout immutable private core (selected dataset inputs only)
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: c0c69be8e28ddfa5812c1bbe4ba3d33f432fbf02
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/
            /requirements.txt
            /docs/ACTIONS_MIGRATION.md
            /preview/kabu/analysis/225_group_all_period/${{ matrix.dataset }}/signal_level_features.csv
            /preview/kabu/analysis/225_group_all_period/${{ matrix.dataset }}/condition_detail_manifest.csv
            /preview/kabu/analysis/225_group_all_period/${{ matrix.dataset }}/conditions/s-a7c0898c14b3170f.html
            /preview/kabu/analysis/225_group_all_period/${{ matrix.dataset }}/conditions/charts/s-a7c0898c14b3170f.html
            /preview/kabu/analysis/225_group_all_period/${{ matrix.dataset }}/conditions/p-6aec83150eec9a88.html
            /preview/kabu/analysis/225_group_all_period/${{ matrix.dataset }}/conditions/charts/p-6aec83150eec9a88.html
            /preview/kabu/analysis/225_group_all_period/${{ matrix.dataset }}/conditions/t-2a923d7b3e9a62a5.html
            /preview/kabu/analysis/225_group_all_period/${{ matrix.dataset }}/conditions/charts/t-2a923d7b3e9a62a5.html
          persist-credentials: false
      - name: Checkout immutable Oct-03 HTML renderer sources only
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 3dfb14cd0f05125c4bfce81d710db0ced073b7c3
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: legacy
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/p2_monthly_chart.py
            /scripts/refine_p2_report_information_architecture.py
            /scripts/postprocess_p2_accuracy_highlight.py
          persist-credentials: false
      - name: Verify Public-only architecture and pinned private SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "yuki746289/product_kabu_actions"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          if git -C core ls-tree -r --name-only HEAD | grep -E '^\.github/workflows/.*\.ya?ml$'; then
            echo "::error::Private repository contains forbidden workflow"
            exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install locked-range dependencies
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
      - name: Audit-gate synthetic unit tests
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_p2_condition_pair_byte_audit_20261010.py' -v
      - name: Prepare isolated legacy-template stage
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          # All files here are temporary and untracked: the pinned current core is immutable.
          test "$(git -C ../legacy rev-parse HEAD)" = "$LEGACY_RENDER_SHA"
          mkdir -p build/representative_legacy_source
          cp -a scripts build/representative_legacy_source/
          for item in \
            "p2_monthly_chart.py:e304d81b17ba73ce98628f7021b8faf219e3a80b" \
            "refine_p2_report_information_architecture.py:f0d915dba0fa9ca479651bbe13e5ee583c57b234" \
            "postprocess_p2_accuracy_highlight.py:77ffb7a0c13e5e754696b23979ce88ba3a330ddb"; do
            name="${item%%:*}"
            blob="${item#*:}"
            test "$(git -C ../legacy hash-object "scripts/$name")" = "$blob"
            cp "../legacy/scripts/$name" "build/representative_legacy_source/scripts/$name"
          done
          printf '{"legacy_renderer_sha":"%s","current_core_sha":"%s","page_scope":"five sector S/P/T detail/chart representative pairs only","preserved_source":true}\n' "$LEGACY_RENDER_SHA" "$CORE_SHA" > build/representative_legacy_source/legacy_renderer_provenance.json
          python scripts/migrate_p2_html_templates_20261009.py --repo-root build/representative_legacy_source --output-root build/representative_extract > /dev/null
          python scripts/prepare_p2_template_stage_20261009.py --repo-root build/representative_legacy_source --extraction build/representative_extract --destination build/representative_stage > /dev/null
      - name: Generate and compare exactly six representative HTML pages for this sector
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          types=(S P T)
          ids=(P2C-A7C0898C14B3 P2C-6AEC83150EEC P2C-2A923D7B3E9A)
          keys=('S:fan=CONVERGED' 'P:fan=CONVERGED&ema=STRONG_CONTINUING' 'T:fan=CONVERGED&ema=DECELERATING&daily_rci14_position=LOW')
          for index in 0 1 2; do
            kind="${types[$index]}"
            condition_id="${ids[$index]}"
            condition_key="${keys[$index]}"
            printf 'AUDIT dataset=%s kind=%s id=%s\n' "${{ matrix.dataset }}" "$kind" "$condition_id"
            python scripts/p2_html_build.py --repo-root . --site-root preview/kabu --stage-root build/representative_stage --dataset "${{ matrix.dataset }}" --family conditions --condition-id "$condition_id" --output-dir "build/representative_${kind}_html"
            python scripts/verify_p2_condition_pair_byte_audit_20261010.py --repo-root . --site-root preview/kabu --build-root "build/representative_${kind}_html" --output-dir "build/representative_${kind}_audit" --dataset "${{ matrix.dataset }}" --condition-key "$condition_key"
          done
          for kind in S P T; do
            test -s "build/representative_${kind}_audit/p2_condition_pair_byte_audit.json"
          done
      - name: Verify source and tracked outputs remain unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
          echo "Read-only source contract: PASS"
      - name: Upload mandatory successful pair audit JSON
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-representatives-${{ matrix.dataset }}-audit
          path: |
            core/build/representative_S_audit/p2_condition_pair_byte_audit.json
            core/build/representative_P_audit/p2_condition_pair_byte_audit.json
            core/build/representative_T_audit/p2_condition_pair_byte_audit.json
            core/build/representative_legacy_source/legacy_renderer_provenance.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload failure diagnostic if generated
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p2-representatives-${{ matrix.dataset }}-failure-diagnostic
          path: |
            core/build/representative_S_audit/p2_condition_pair_byte_audit.json
            core/build/representative_P_audit/p2_condition_pair_byte_audit.json
            core/build/representative_T_audit/p2_condition_pair_byte_audit.json
            core/build/representative_legacy_source/legacy_renderer_provenance.json
            core/build/representative_S_html/build_manifest.json
            core/build/representative_P_html/build_manifest.json
            core/build/representative_T_html/build_manifest.json
            core/build/representative_S_html/unified_build_audit.json
            core/build/representative_P_html/unified_build_audit.json
            core/build/representative_T_html/unified_build_audit.json
          if-no-files-found: warn
          retention-days: 7
