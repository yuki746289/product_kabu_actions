name: P2 Stage B B7 prep purged HOG

on:
  push:
    branches: [research/p2-stage-b-b7-prep-20260912]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  hog-purged:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: research/p2-hypotheses-20260911
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy scikit-learn tabulate
      - name: Download B3 aggregate feature matrix
        uses: actions/download-artifact@v4
        with:
          name: p2-stage-b-b3-aggregate
          path: core/data/diagnostics/p2_stage_b/b7/input
          repository: yuki746289/product_kabu_actions
          run-id: 34671952644
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download B5 HOG feature matrix
        uses: actions/download-artifact@v4
        with:
          name: p2-stage-b-b5-hog-features
          path: core/data/diagnostics/p2_stage_b/b7/hog
          repository: yuki746289/product_kabu_actions
          run-id: 34676270003
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run purged HOG SVM walk-forward
        working-directory: core
        run: |
          python scripts/run_p2_stage_b_b7_hog_purged_oos.py \
            --features data/diagnostics/p2_stage_b/b7/input/features.csv \
            --hog-dir data/diagnostics/p2_stage_b/b7/hog \
            --output-dir data/diagnostics/p2_stage_b/b7/hog_purged \
            --embargo-days 35
      - name: Verify
        working-directory: core
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/diagnostics/p2_stage_b/b7/hog_purged')
          s=json.loads((p/'status.json').read_text())
          assert s['overall_pass'] is True and s['causal_violations']==0 and s['embargo_days']==35, s
          assert (p/'oos_predictions.csv').exists(), s
          print(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2-stage-b-b7-hog-purged-oos
          path: core/data/diagnostics/p2_stage_b/b7/hog_purged
          retention-days: 7
