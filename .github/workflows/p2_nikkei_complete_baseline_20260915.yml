name: P2 Nikkei complete baseline 20260915

on:
  push:
    branches:
      - research/p2-nikkei-complete-baseline-20260915
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: research/p2-nikkei-complete-baseline-20260915
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pandas numpy tabulate yfinance
      - name: Syntax check
        working-directory: core
        run: |
          python -m py_compile scripts/analyze_p2_nikkei_complete_baseline.py
          python -m py_compile scripts/augment_p2_nikkei_complete_daily_rci_groups.py
          python -m py_compile scripts/finalize_p2_nikkei_complete_baseline.py
          python -m py_compile scripts/append_p2_nikkei_monthly_report.py
          python -m py_compile scripts/generate_p2_nikkei_html_report.py
          python -m py_compile scripts/generate_p2_condition_drilldown.py
          python -m py_compile scripts/refine_p2_report_information_architecture.py
          python -m py_compile scripts/run_p2_report_information_architecture.py
          python -m py_compile scripts/analyze_p2_or_combinations.py
      - name: Run complete baseline analysis
        working-directory: core
        run: python scripts/analyze_p2_nikkei_complete_baseline.py
      - name: Enforce daily RCI position direction completeness
        working-directory: core
        run: python scripts/augment_p2_nikkei_complete_daily_rci_groups.py
      - name: Finalize combination candidates and stability
        working-directory: core
        run: python scripts/finalize_p2_nikkei_complete_baseline.py
      - name: Build monthly performance and stability data
        working-directory: core
        run: python scripts/append_p2_nikkei_monthly_report.py
      - name: Generate Japanese HTML report and detail tables
        working-directory: core
        run: python scripts/generate_p2_nikkei_html_report.py
      - name: Generate clickable condition drilldown pages
        working-directory: core
        run: python scripts/generate_p2_condition_drilldown.py
      - name: Refine overview-to-detail information architecture
        working-directory: core
        run: python scripts/run_p2_report_information_architecture.py
      - name: Verify complete baseline outputs
        working-directory: core
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          out = Path('data/diagnostics/p2_stage_b/nikkei_complete_baseline_20260915')
          s = json.loads((out / 'status.json').read_text(encoding='utf-8'))
          c = json.loads((out / 'completeness_status.json').read_text(encoding='utf-8'))
          ri = json.loads((out / 'report_interaction_validation.json').read_text(encoding='utf-8'))
          assert s['test'] == 'p2_nikkei_complete_baseline', s
          assert s['baseline_signals'] == 890, s
          assert s['causal_violations'] == 0, s
          assert s['failures'] == 0, s
          assert s['daily_rci_group_completeness_pass'] is True, s
          required = {f'daily_rci{span}_{group}' for span in (9,14,26) for group in ('position','direction','state')}
          rep = pd.read_csv(out / 'representative_single_categories.csv')
          actual = set(rep['feature'].astype(str))
          assert required <= actual, sorted(required-actual)
          r26 = rep[(rep['feature']=='daily_rci26_direction') & (rep['category']=='RISING')]
          assert len(r26)==1 and int(r26.iloc[0]['count'])==100, r26.to_dict('records')

          for f in (
              'advantage_single_candidates.csv','advantage_pairwise_candidates.csv','advantage_triple_candidates.csv',
              'combination_stability_summary.csv','combination_walkforward_results.csv',
              'monthly_baseline_performance.csv','monthly_baseline_stability_summary.csv','month_of_year_baseline_summary.csv',
              'monthly_candidate_stability_summary.csv','condition_detail_manifest.csv','report_interaction_validation.json',
              'FINAL_REVIEW.md','report.html','details/index.html','details/monthly_baseline_performance.html',
              'details/month_of_year_baseline_summary.html','details/monthly_candidate_stability_summary.html',
              'details/monthly_stability.html','details/yearly_stability.html','details/rolling_3y_stability.html',
              'details/rolling_5y_stability.html','details/regime_stability.html','details/walkforward_results.html',
              'details/parameter_plateau.html','conditions/index.html',
              'summaries/single_features.html','summaries/pair_features.html','summaries/triple_features.html',
              'or_pairwise_all.csv','or_triple_all.csv','or_pairwise_unique.csv','or_triple_unique.csv',
              'or_candidate_summary.csv','or_analysis_status.json',
              'analysis/or_combinations.html','analysis/or_pairwise_all.html','analysis/or_triple_all.html',
          ):
              assert (out / f).exists(), f
          assert not (out / 'report.md').exists(), 'legacy report.md must not be canonical artifact output'

          numeric_checks = {
              'all_single_categories.csv':['count'],'all_pairwise_combinations.csv':['count'],'tested_triple_combinations.csv':['count'],
              'candidate_registry.csv':['count'],'monthly_stability.csv':['count'],
              'monthly_candidate_stability_summary.csv':['total_count','active_months'],
              'monthly_baseline_performance.csv':['entries'],'condition_detail_manifest.csv':['count'],
              'or_pairwise_all.csv':['count','max_component_count','incremental_entries_vs_largest'],
              'or_triple_all.csv':['count','max_component_count','incremental_entries_vs_largest'],
              'or_candidate_summary.csv':['count','active_months','total_months'],
          }
          for filename, cols in numeric_checks.items():
              df = pd.read_csv(out / filename)
              for col in cols:
                  assert pd.to_numeric(df[col],errors='coerce').notna().all(), (filename,col)

          monthly = pd.read_csv(out / 'monthly_baseline_performance.csv')
          assert len(monthly) >= 100, len(monthly)
          assert {'month','entries','win_5d_pct','win_10d_pct','win_20d_pct'} <= set(monthly.columns)

          report = (out / 'report.html').read_text(encoding='utf-8')
          for token in (
              '概要','結論','主要な単独優位性候補','全体比','月平均','月中央値',
              '正解率','5D','10D','20D','条件別結果','conditions/index.html','summaries/pair_features.html',
              'details/monthly_baseline_performance.html','details/monthly_candidate_stability_summary.html',
              'analysis/or_combinations.html',
          ):
              assert token in report, token
          assert 'weekly_rci26' not in report, 'user-facing indicator labels must be Japanese'
          assert 'daily_rci26_direction' not in report, 'user-facing indicator labels must be Japanese'
          assert 'analysis/or_combinations.html' in report, 'OR analysis link missing from report'
          assert '<th colspan="3" class="group-start">正解率</th>' in report, 'accuracy group must be on the upper header row'
          assert '>5D</th>' in report and '>10D</th>' in report and '>20D</th>' in report, 'accuracy horizons must be on the lower header row'
          assert '<th rowspan="2">条件</th>' in report, 'standalone columns must merge the two header rows'

          or_status = json.loads((out / 'or_analysis_status.json').read_text(encoding='utf-8'))
          assert or_status['component_min_count'] == 20, or_status
          assert or_status['component_pool'] > 0, or_status
          assert or_status['or2_unique'] > 0 and or_status['or3_unique'] > 0, or_status
          assert or_status['candidate_summary_rows'] > 0, or_status
          assert or_status['detail_pages'] > 0, or_status
          assert or_status['production_changed'] is False, or_status
          or_html = (out / 'analysis/or_combinations.html').read_text(encoding='utf-8')
          for token in ('OR組み合わせ検証','件数 × 正解率のバランス候補','件数拡大型','高正解率型','OR2 全結果','OR3 全結果','総合指数'):
              assert token in or_html, token
          for page_name in ('or_pairwise_all.html','or_triple_all.html'):
              page = (out / 'analysis' / page_name).read_text(encoding='utf-8')
              for token in ('並び順','総合指数','pvTop','nxTop','or-head-scroll','or-body-scroll','hlBottom','横へ →','3期間平均正解率'):
                  assert token in page, (page_name, token)
          detail_files = sorted((out / 'analysis/or_details').glob('*.html'))
          assert len(detail_files) == or_status['detail_pages'], (len(detail_files), or_status)
          sample_or_detail = detail_files[0].read_text(encoding='utf-8')
          for token in ('詳細結果を選択','月別','年別','シグナル明細','best単独差'):
              assert token in sample_or_detail, token

          signals = pd.read_csv(out / 'signal_level_features.csv')
          signal_dates = pd.to_datetime(signals['as_of'], errors='raise')
          full_months = len(pd.period_range(signal_dates.min().to_period('M'), signal_dates.max().to_period('M'), freq='M'))
          signal_months = int(signal_dates.dt.to_period('M').nunique())
          month_label = f'全期間 {full_months}か月（シグナル発生月 {signal_months}か月）'
          assert month_label in report, (month_label, report[:1000])

          cond_index = (out / 'conditions/index.html').read_text(encoding='utf-8')
          for token in ('条件別結果一覧','条件','種別','件数','正解率','全体比','稼働率','月平均','5D','10D','20D'):
              assert token in cond_index, token

          manifest = pd.read_csv(out / 'condition_detail_manifest.csv')
          assert len(manifest)>0, 'no condition detail pages'
          for slug in manifest['slug'].astype(str):
              p = out / 'conditions' / f'{slug}.html'
              assert p.exists(), p
              text = p.read_text(encoding='utf-8')
              for token in ('詳細結果を選択','概要','月別','年別','Rolling 3年','Rolling 5年','相場状態別','全月数','月平均','正解率','5D','10D','20D'):
                  assert token in text, (slug,token)

          assert ri['REPORT_COMPLETENESS_STATUS']=='PASS', ri
          assert ri['clickable_conditions']==ri['condition_detail_pages']>0, ri
          assert ri['broken_condition_links']==0, ri
          assert ri['missing_detail_ui']==[], ri
          assert ri['japanese_header_failures']==[], ri
          assert ri['information_architecture']=='overview_to_feature_group_to_condition_to_detail', ri
          assert ri['all_month_zero_included_metrics'] is True, ri
          assert ri['feature_labels_japanese'] is True, ri
          assert ri['large_table_hierarchy'] is True, ri
          assert ri['feature_group_counts']['pair'] > 0, ri
          assert ri['feature_group_counts']['triple'] > 0, ri

          detail = (out / 'details/monthly_candidate_stability_summary.html').read_text(encoding='utf-8')
          for token in ('稼働月','月次安定性','基準超過月率'):
              assert token in detail, token
          assert c['COMPLETENESS_STATUS']=='PASS', c
          assert c['checks']['combination_stability_nonempty'] is True, c
          assert c['checks']['combination_walkforward_nonempty'] is True, c
          print(json.dumps(c,ensure_ascii=False,indent=2))
          print(json.dumps(ri,ensure_ascii=False,indent=2))
          print({'full_months': full_months, 'signal_months': signal_months})
          PY

      - name: Publish pre-generated static HTML to product_kabu
        working-directory: core
        run: |
          set -euo pipefail
          OUT="data/diagnostics/p2_stage_b/nikkei_complete_baseline_20260915"
          PREVIEW="preview/kabu"
          # The report generation can take several minutes. Other commits may land
          # on the research branch while this job is running, so update the tracked
          # checkout immediately before publishing the generated static files.
          git fetch origin research/p2-nikkei-complete-baseline-20260915
          git reset --hard origin/research/p2-nikkei-complete-baseline-20260915
          rm -rf "$PREVIEW"
          mkdir -p "$PREVIEW"
          while IFS= read -r -d '' file; do
            rel="${file#$OUT/}"
            mkdir -p "$PREVIEW/$(dirname "$rel")"
            cp "$file" "$PREVIEW/$rel"
          done < <(find "$OUT" -type f -name '*.html' -print0)
          cp "$OUT/report.html" "$PREVIEW/index.html"
          printf 'Generated by P2 complete-baseline workflow\nRun: %s\nSource revision: %s\n' "${{ github.run_id }}" "$(git rev-parse HEAD)" > "$PREVIEW/GENERATED.txt"
          test -f "$PREVIEW/report.html"
          test -f "$PREVIEW/index.html"
          test -f "$PREVIEW/conditions/index.html"
          test -f "$PREVIEW/details/index.html"
          test -f "$PREVIEW/summaries/pair_features.html"
          test -f "$PREVIEW/analysis/or_combinations.html"
          test -f "$PREVIEW/analysis/or_pairwise_all.html"
          test -f "$PREVIEW/analysis/or_triple_all.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A preview/kabu
          if git diff --cached --quiet; then
            echo "Static preview is already up to date."
          else
            git commit -m "report: publish pre-generated P2 HTML preview"
            git push origin HEAD:research/p2-nikkei-complete-baseline-20260915
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-nikkei-complete-baseline-20260915
          path: core/data/diagnostics/p2_stage_b/nikkei_complete_baseline_20260915
          retention-days: 7
