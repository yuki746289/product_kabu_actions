name: P2 Nikkei complete baseline 20260915

on:
  push:
    branches:
      - research/p2-nikkei-complete-baseline-20260915
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: research/p2-nikkei-complete-baseline-20260915
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pandas numpy tabulate yfinance
      - name: Syntax check
        working-directory: core
        run: |
          python -m py_compile scripts/analyze_p2_nikkei_complete_baseline.py
          python -m py_compile scripts/augment_p2_nikkei_complete_daily_rci_groups.py
      - name: Run complete baseline analysis
        working-directory: core
        run: python scripts/analyze_p2_nikkei_complete_baseline.py
      - name: Enforce daily RCI position direction completeness
        working-directory: core
        run: python scripts/augment_p2_nikkei_complete_daily_rci_groups.py
      - name: Verify complete baseline outputs
        working-directory: core
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          out = Path('data/diagnostics/p2_stage_b/nikkei_complete_baseline_20260915')
          s = json.loads((out / 'status.json').read_text(encoding='utf-8'))
          assert s['test'] == 'p2_nikkei_complete_baseline', s
          assert s['baseline_signals'] == 890, s
          assert s['causal_violations'] == 0, s
          assert s['failures'] == 0, s
          assert s['missing_artifacts'] == [], s
          assert s['daily_rci_group_completeness_pass'] is True, s
          assert s['missing_daily_rci_group_features'] == [], s
          required = {
              f'daily_rci{span}_{group}'
              for span in (9, 14, 26)
              for group in ('position', 'direction', 'state')
          }
          rep = pd.read_csv(out / 'representative_single_categories.csv')
          actual = set(rep['feature'].astype(str))
          assert required <= actual, sorted(required - actual)
          r26 = rep[(rep['feature'] == 'daily_rci26_direction') & (rep['category'] == 'RISING')]
          assert len(r26) == 1 and int(r26.iloc[0]['count']) == 100, r26.to_dict('records')
          assert s['overall_pass'] is True, s
          print(json.dumps(s, ensure_ascii=False, indent=2))
          print(r26.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-nikkei-complete-baseline-20260915
          path: core/data/diagnostics/p2_stage_b/nikkei_complete_baseline_20260915
          retention-days: 7
