name: P2 Stage B B9 Short 5D

on:
  push:
    branches: [research/p2-stage-b-b9-20260912]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        variant: [b11_compact,short_path_summary,short_recent4,short_recent4_summary,short_pullback_quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: research/p2-hypotheses-20260911
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy scikit-learn lightgbm tabulate
      - name: Download B3 aggregate feature matrix
        uses: actions/download-artifact@v4
        with:
          name: p2-stage-b-b3-aggregate
          path: core/data/diagnostics/p2_stage_b/b9/input
          repository: yuki746289/product_kabu_actions
          run-id: 34671952644
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Short 5D feature validation
        working-directory: core
        run: |
          python scripts/run_p2_stage_b_b9_short_5d.py \
            --features data/diagnostics/p2_stage_b/b9/input/features.csv \
            --output-dir data/diagnostics/p2_stage_b/b9/${{ matrix.variant }} \
            --variant ${{ matrix.variant }}
      - name: Verify result
        working-directory: core
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('data/diagnostics/p2_stage_b/b9')/os.environ['VARIANT']
          s=json.loads((p/'status.json').read_text())
          assert s['overall_pass'] is True and s['causal_violations']==0 and s['embargo_days']==14, s
          assert (p/'summary.csv').exists() and (p/'oos_predictions.csv').exists()
          print(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2-stage-b-b9-${{ matrix.variant }}
          path: core/data/diagnostics/p2_stage_b/b9/${{ matrix.variant }}
          retention-days: 7

  compare:
    needs: models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas tabulate
      - uses: actions/download-artifact@v4
        with:
          pattern: p2-stage-b-b9-*
          path: results
          merge-multiple: false
      - name: Build B9 comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, pandas as pd
          frames=[pd.read_csv(p) for p in Path('results').glob('**/summary.csv')]
          x=pd.concat(frames,ignore_index=True)
          Path('final').mkdir(exist_ok=True)
          x.to_csv('final/model_comparison.csv',index=False)
          r=x.loc[x.target_retention_pct.eq(60)].copy().sort_values(['pooled_win_uplift_5d_pp','positive_win_year_share_5d_pct','mean_auc'],ascending=[False,False,False])
          r.to_csv('final/rank_retention60.csv',index=False)
          cols=['variant','feature_count','mean_auc','mean_ap','baseline_entries','kept_entries','pooled_retention_pct','baseline_win_5d_pct','kept_win_5d_pct','pooled_win_uplift_5d_pp','positive_win_year_share_5d_pct','pooled_return_uplift_5d_pp','kept_win_10d_pct','pooled_win_uplift_10d_pp','kept_win_20d_pct','pooled_win_uplift_20d_pp']
          Path('final/report.md').write_text('# B9 Short 5D comparison\n\n'+r[cols].to_markdown(index=False)+'\n',encoding='utf-8')
          control=r.loc[r.variant.eq('b11_compact')].iloc[0]
          passed=[]
          for _,z in r.iterrows():
              if z.variant=='b11_compact': continue
              ok=(z.pooled_win_uplift_5d_pp>control.pooled_win_uplift_5d_pp and z.positive_win_year_share_5d_pct>=control.positive_win_year_share_5d_pct and z.pooled_win_uplift_10d_pp>=control.pooled_win_uplift_10d_pp-0.30 and z.pooled_win_uplift_20d_pp>=control.pooled_win_uplift_20d_pp-0.30)
              if ok: passed.append(z.variant)
          Path('final/status.json').write_text(json.dumps({'variants':sorted(x.variant.unique().tolist()),'rows':len(x),'primary_retention':60,'control':'b11_compact','predeclared_passed_variants':passed,'overall_pass':len(x)==20},indent=2)+'\n')
          print(r[cols].to_string(index=False)); print('passed=',passed)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2-stage-b-b9-final
          path: final
          retention-days: 7
