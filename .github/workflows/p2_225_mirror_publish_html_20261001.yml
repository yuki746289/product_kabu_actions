name: Publish P2 225 validated HTML mirror 20261001

on:
  push:
    branches: [main]
    paths:
      - '.github/p2_225_mirror_publish_html_trigger'

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve publish contract
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/p2_225_mirror_publish_html_trigger
          awk -F': ' '
            $1=="target_branch"{print "target_branch="$2}
            $1=="expected_core_head"{print "expected_core_head="$2}
            $1=="source_run_id"{print "source_run_id="$2}
            $1=="source_artifact"{print "source_artifact="$2}
            $1=="target_path"{print "target_path="$2}
          ' "$FILE" >> "$GITHUB_OUTPUT"

      - name: Checkout private core
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: ${{ steps.cfg.outputs.target_branch }}
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Actions architecture
        run: |
          python scripts/check_actions_architecture.py \
            --core-dir core \
            --expected-core-sha "${{ steps.cfg.outputs.expected_core_head }}"

      - name: Verify target branch head
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ steps.cfg.outputs.expected_core_head }}"
          echo "expected=$EXPECTED"
          echo "actual=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Download final validated artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.source_artifact }}
          path: generated
          repository: yuki746289/product_kabu_actions
          run-id: ${{ steps.cfg.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify final QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("generated")
          q=json.loads((root/"final_qa_status.json").read_text(encoding="utf-8"))
          m=json.loads((root/"mirror_status.json").read_text(encoding="utf-8"))
          s=json.loads((root/"status.json").read_text(encoding="utf-8"))
          assert q.get("overall_pass") is True, q
          assert m.get("overall_pass") is True, m
          assert m.get("data_substitution_pass") is True, m
          assert s.get("overall_pass") is True, s
          assert s.get("baseline_rows")==181318, s
          assert s.get("unique_tickers")==225, s
          assert q.get("new_broken_link_count")==0, q
          print("validated rows=181318 tickers=225 QA=PASS")
          PY

      - name: Build HTML-only publish tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir -p publish
          cd generated
          find . -type f -name '*.html' -print0 | while IFS= read -r -d '' f; do
            mkdir -p "../publish/$(dirname "$f")"
            cp "$f" "../publish/$f"
          done
          cd ..
          for f in status.json mirror_status.json final_qa_status.json report_interaction_validation.json; do
            if [ -f "generated/$f" ]; then cp "generated/$f" "publish/$f"; fi
          done

          # signal_level_features.html is >100 MB for the 181,318-row population.
          # GitHub rejects individual files over 100 MB, so replace only this audit
          # view with a lightweight index plus chunked HTML pages generated from
          # the already-validated CSV. Analytical values are unchanged.
          rm -f publish/details/signal_level_features.html
          rm -rf publish/details/signal_level_features_parts
          mkdir -p publish/details/signal_level_features_parts
          python - <<'PY'
          import csv
          import html
          import math
          from pathlib import Path

          src=Path("generated/signal_level_features.csv")
          out=Path("publish/details")
          parts=out/"signal_level_features_parts"
          chunk_size=5000

          if not src.is_file():
              raise SystemExit(f"missing {src}")

          css="""
          :root{--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#667085;--line:#d9dee7;--accent:#2457a6}
          *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.5}
          .wrap{max-width:1600px;margin:0 auto;padding:24px}.hero{background:#16243d;color:#fff;border-radius:14px;padding:22px 26px;margin-bottom:18px}
          a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
          .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}table{border-collapse:collapse;width:max-content;min-width:100%;font-size:12px}
          th,td{border-bottom:1px solid #e5e7eb;padding:5px 7px;white-space:nowrap;text-align:right}th{position:sticky;top:0;background:#eef2f7;z-index:1}th:first-child,td:first-child{text-align:left}
          .links{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;padding:7px 11px;border:1px solid #b7c3d4;background:#fff;border-radius:7px}
          .muted{color:var(--muted);font-size:13px}
          """

          def page(title, body, back):
              return f"""<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{html.escape(title)}</title><style>{css}</style></head><body><div class="wrap"><div class="hero"><h1>{html.escape(title)}</h1><p>主要225株 P2 Long / 181,318件</p></div><div class="links"><a class="btn" href="{back}">← 戻る</a></div>{body}</div></body></html>"""

          with src.open("r",encoding="utf-8-sig",newline="") as fh:
              reader=csv.reader(fh)
              header=next(reader)
              chunk=[]
              part_no=0
              total=0
              links=[]

              def flush(rows, n, start_row):
                  if not rows:
                      return
                  end_row=start_row+len(rows)-1
                  name=f"part_{n:03d}.html"
                  th="".join(f"<th>{html.escape(str(x))}</th>" for x in header)
                  trs=[]
                  for row in rows:
                      cells="".join(f"<td>{html.escape(str(v))}</td>" for v in row)
                      trs.append("<tr>"+cells+"</tr>")
                  body=(
                      f'<div class="card"><strong>{start_row:,}〜{end_row:,}件</strong>'
                      f'<div class="muted">全181,318件の分割表示</div></div>'
                      f'<div class="table-wrap"><table><thead><tr>{th}</tr></thead><tbody>'
                      + "".join(trs)
                      + "</tbody></table></div>"
                  )
                  (parts/name).write_text(page(f"シグナル明細 {start_row:,}〜{end_row:,}",body,"../signal_level_features.html"),encoding="utf-8")
                  links.append((name,start_row,end_row))

              for row in reader:
                  if not chunk:
                      start_row=total+1
                  chunk.append(row)
                  total+=1
                  if len(chunk)>=chunk_size:
                      part_no+=1
                      flush(chunk,part_no,start_row)
                      chunk=[]
              if chunk:
                  part_no+=1
                  flush(chunk,part_no,start_row)

          if total != 181318:
              raise SystemExit(f"signal row mismatch: {total} != 181318")

          cards=[]
          for name,a,b in links:
              cards.append(f'<a class="btn" href="signal_level_features_parts/{name}">{a:,}〜{b:,}件</a>')
          body=(
              '<div class="card"><h2>シグナル明細</h2>'
              '<p>GitHubの1ファイル100MB制限に対応するため、181,318件を5,000件単位で分割表示しています。</p>'
              '<p>分析母集団・計算結果はFinal QA済みartifactと同一です。</p></div>'
              '<div class="links">'+"".join(cards)+'</div>'
          )
          (out/"signal_level_features.html").write_text(page("P2 主要225株 シグナル明細",body,"index.html"),encoding="utf-8")
          print(f"signal chunks={part_no} rows={total}")
          PY

          test -f publish/index.html
          test -f publish/report.html
          test -f publish/report_all_period.html
          test -f publish/details/signal_level_features.html
          test -f publish/status.json
          test -f publish/mirror_status.json
          test -f publish/final_qa_status.json

          LARGE="$(find publish -type f -size +95M -print)"
          if [ -n "$LARGE" ]; then
            echo "ERROR: files above 95 MB remain:"
            echo "$LARGE"
            exit 1
          fi

          echo "HTML files: $(find publish -type f -name '*.html' | wc -l)"
          du -sh publish

      - name: Replace 225 HTML mirror target
        shell: bash
        run: |
          set -euo pipefail
          TARGET="core/${{ steps.cfg.outputs.target_path }}"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp -a publish/. "$TARGET"/

      - name: Verify published HTML tree before commit
        shell: bash
        run: |
          set -euo pipefail
          TARGET="core/${{ steps.cfg.outputs.target_path }}"
          grep -R "181,318" "$TARGET/index.html" "$TARGET/report.html" >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("core/preview/kabu/analysis/225_indicator_stageb")
          assert json.loads((root/"status.json").read_text(encoding="utf-8"))["overall_pass"] is True
          assert json.loads((root/"mirror_status.json").read_text(encoding="utf-8"))["overall_pass"] is True
          assert json.loads((root/"final_qa_status.json").read_text(encoding="utf-8"))["overall_pass"] is True
          print("publish tree verified")
          PY

      - name: Commit validated HTML mirror
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ steps.cfg.outputs.target_path }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$TARGET"
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "data: publish raw 181318-row 225 HTML mirror"
          git push origin "HEAD:refs/heads/${{ steps.cfg.outputs.target_branch }}"

      - name: Verify remote head
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin "refs/heads/${{ steps.cfg.outputs.target_branch }}" | cut -f1)"
          test "$LOCAL" = "$REMOTE"
          echo "published_head=$LOCAL"
