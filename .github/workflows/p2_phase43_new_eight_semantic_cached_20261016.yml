# Created 2026-10-16 JST: original canonical core Semantic producers executed,
# with NumPy cached metrics; only eight FRESH CSVs, not full semantic or OR/29.
# Full previously successful Phase40/41 and five Phase42 outputs untouched.
name: P2 Phase43 fresh original canonical 8 Semantic CSV NumPy parity
on:
  push:
    branches: [automation/p2-common-postextract-20261012]
    paths:
      - '.github/workflows/p2_phase43_new_eight_semantic_cached_20261016.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-phase43-eight-new-semantic-source-20261016
  cancel-in-progress: false
env:
  CORE_SHA: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  preflight:
    name: Verify actual prior assembler success and only eight new semantic files computed
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Full previous actual assembler negative SHA controls and new canonical NumPy scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          python -m py_compile scripts/p2_phase43_new_8_semantic_cached_20261016.py
          python scripts/p2_phase43_new_8_semantic_cached_20261016.py --selftest
          gh api repos/yuki746289/product_kabu_actions/actions/runs/38843586335 --jq '.conclusion + " " + .head_sha' | \
            grep -Fx 'success 2a27bfe7d834a3aec5d21b27fd30ff52782cb8cf'

  canary:
    name: Fresh eight canonical semantic outputs with new NumPy cache (${{ matrix.dataset }})
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      max-parallel: 2
      fail-fast: true
      matrix:
        include:
          - dataset: "technology"
            dir: "225_group_all_period/technology"
            sourceRun: 0
            sourceArtifact: ""
    env:
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Read only pinned original Private canonical source, semantic function code and eight saved references
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
            /preview/kabu/analysis/${{ matrix.dir }}/signal_level_features.csv
            /preview/kabu/analysis/${{ matrix.dir }}/all_single_categories.csv
            /preview/kabu/analysis/${{ matrix.dir }}/representative_single_categories.csv
            /preview/kabu/analysis/${{ matrix.dir }}/all_pairwise_combinations.csv
            /preview/kabu/analysis/${{ matrix.dir }}/tested_triple_combinations.csv
            /preview/kabu/analysis/${{ matrix.dir }}/candidate_registry.csv
            /preview/kabu/analysis/${{ matrix.dir }}/advantage_single_candidates.csv
            /preview/kabu/analysis/${{ matrix.dir }}/advantage_pairwise_candidates.csv
            /preview/kabu/analysis/${{ matrix.dir }}/advantage_triple_candidates.csv
          persist-credentials: false
      - name: Original Private core SHA, zero Private Actions, Public runner mandatory architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Private workflows forbidden"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse strictly saved excluded original features, never re-extract signals
        if: ${{ matrix.sourceRun != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sourceArtifact }}
          run-id: ${{ matrix.sourceRun }}
          github-token: ${{ github.token }}
          path: source_external
      - name: Reuse Phase38 SHA-pinned old source and all outputs reference without rerunning original artifact
        uses: actions/download-artifact@v4
        with:
          name: p2-phase38-${{ matrix.dataset }}-saved-29csv-inventory
          run-id: 38524279221
          github-token: ${{ github.token }}
          path: proof38
      - name: Reuse Phase43 source lineage independent original and numeric prior proofs
        uses: actions/download-artifact@v4
        with:
          name: p2-phase43-${{ matrix.dataset }}-saved-lineage-crossproof
          run-id: 38842234272
          github-token: ${{ github.token }}
          path: proof43
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install original canonical P2 runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Compute FRESH original semantic singles, Pairwise, Triple, candidate 8 CSV with NumPy cache only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/p2_phase43_new_8_semantic_cached_20261016.py \
            --dataset "$DATASET" --core core \
            --reference "core/preview/kabu/analysis/${{ matrix.dir }}" \
            --external source_external \
            --phase38 proof38/audit.json --phase43 proof43/report.json \
            --report "$RUNNER_TEMP/report.json"
      - name: Enforce eight actual canonical newly generated source-bound full-row/column numeric and ordering parities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"report.json").read_text(encoding="utf-8"))
          assert d["status"]=="PASS_PHASE43_EIGHT_FRESH_CANONICAL_SEMANTIC_NUMERIC_OUTPUTS"
          assert d["dataset"]==os.environ["DATASET"]
          assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert d["eight_original_semantic_producer_functions_executed"] is True
          assert d["new_semantic_outputs_count"]==len(d["new_semantic_outputs"])==8
          assert d["cached_metrics_versus_original_sample_fields"]==12
          assert all(x["numeric_and_original_order_parity"] is True for x in d["new_semantic_outputs"].values())
          for key in ("source_artifacts_modified","production_p2_v12_changed",
                      "phase40_combination_stability_recomputed","phase41_combination_walkforward_recomputed",
                      "phase42_stability_csvs_recomputed","semantic_all_23_real_output_complete",
                      "full_new_OR_five_producer_executed","new_29_csv_assembler_executed",
                      "full_end_to_end_29_numeric_parity_certified","release_ready","phase48_executed"):
              assert d[key] is False,key
          print("PASS_EIGHT_REAL_FRESH_CANONICAL_SEMANTIC_OUTPUTS",d["dataset"],d["elapsed_seconds"])
          PY
      - name: Old Private tracked source remains unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Upload new numerical source-bound certificate only, no confidential source data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase43-${{ matrix.dataset }}-eight-fresh-canonical-semantic
          path: ${{ runner.temp }}/report.json
          retention-days: 30
          if-no-files-found: error


  remaining:
    name: Fresh eight canonical semantic outputs with new NumPy cache (${{ matrix.dataset }})
    needs: canary
    if: ${{ needs.canary.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      max-parallel: 2
      fail-fast: true
      matrix:
        include:
          - dataset: "financials"
            dir: "225_group_all_period/financials"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "consumer_goods"
            dir: "225_group_all_period/consumer_goods"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "materials"
            dir: "225_group_all_period/materials"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "capital_goods_others"
            dir: "225_group_all_period/capital_goods_others"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "transportation_utilities"
            dir: "225_group_all_period/transportation_utilities"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "exclude_capital_goods_transportation_utilities"
            dir: "225_exclusion_all_period/exclude_capital_goods_transportation_utilities"
            sourceRun: 37201520569
            sourceArtifact: "p2-225-exclusion-no-capital-transport-features"
          - dataset: "exclude_transportation_utilities"
            dir: "225_exclusion_all_period/exclude_transportation_utilities"
            sourceRun: 37201518110
            sourceArtifact: "p2-225-exclusion-no-transport-features"
    env:
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Read only pinned original Private canonical source, semantic function code and eight saved references
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
            /preview/kabu/analysis/${{ matrix.dir }}/signal_level_features.csv
            /preview/kabu/analysis/${{ matrix.dir }}/all_single_categories.csv
            /preview/kabu/analysis/${{ matrix.dir }}/representative_single_categories.csv
            /preview/kabu/analysis/${{ matrix.dir }}/all_pairwise_combinations.csv
            /preview/kabu/analysis/${{ matrix.dir }}/tested_triple_combinations.csv
            /preview/kabu/analysis/${{ matrix.dir }}/candidate_registry.csv
            /preview/kabu/analysis/${{ matrix.dir }}/advantage_single_candidates.csv
            /preview/kabu/analysis/${{ matrix.dir }}/advantage_pairwise_candidates.csv
            /preview/kabu/analysis/${{ matrix.dir }}/advantage_triple_candidates.csv
          persist-credentials: false
      - name: Original Private core SHA, zero Private Actions, Public runner mandatory architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Private workflows forbidden"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse strictly saved excluded original features, never re-extract signals
        if: ${{ matrix.sourceRun != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sourceArtifact }}
          run-id: ${{ matrix.sourceRun }}
          github-token: ${{ github.token }}
          path: source_external
      - name: Reuse Phase38 SHA-pinned old source and all outputs reference without rerunning original artifact
        uses: actions/download-artifact@v4
        with:
          name: p2-phase38-${{ matrix.dataset }}-saved-29csv-inventory
          run-id: 38524279221
          github-token: ${{ github.token }}
          path: proof38
      - name: Reuse Phase43 source lineage independent original and numeric prior proofs
        uses: actions/download-artifact@v4
        with:
          name: p2-phase43-${{ matrix.dataset }}-saved-lineage-crossproof
          run-id: 38842234272
          github-token: ${{ github.token }}
          path: proof43
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install original canonical P2 runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Compute FRESH original semantic singles, Pairwise, Triple, candidate 8 CSV with NumPy cache only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/p2_phase43_new_8_semantic_cached_20261016.py \
            --dataset "$DATASET" --core core \
            --reference "core/preview/kabu/analysis/${{ matrix.dir }}" \
            --external source_external \
            --phase38 proof38/audit.json --phase43 proof43/report.json \
            --report "$RUNNER_TEMP/report.json"
      - name: Enforce eight actual canonical newly generated source-bound full-row/column numeric and ordering parities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"report.json").read_text(encoding="utf-8"))
          assert d["status"]=="PASS_PHASE43_EIGHT_FRESH_CANONICAL_SEMANTIC_NUMERIC_OUTPUTS"
          assert d["dataset"]==os.environ["DATASET"]
          assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert d["eight_original_semantic_producer_functions_executed"] is True
          assert d["new_semantic_outputs_count"]==len(d["new_semantic_outputs"])==8
          assert d["cached_metrics_versus_original_sample_fields"]==12
          assert all(x["numeric_and_original_order_parity"] is True for x in d["new_semantic_outputs"].values())
          for key in ("source_artifacts_modified","production_p2_v12_changed",
                      "phase40_combination_stability_recomputed","phase41_combination_walkforward_recomputed",
                      "phase42_stability_csvs_recomputed","semantic_all_23_real_output_complete",
                      "full_new_OR_five_producer_executed","new_29_csv_assembler_executed",
                      "full_end_to_end_29_numeric_parity_certified","release_ready","phase48_executed"):
              assert d[key] is False,key
          print("PASS_EIGHT_REAL_FRESH_CANONICAL_SEMANTIC_OUTPUTS",d["dataset"],d["elapsed_seconds"])
          PY
      - name: Old Private tracked source remains unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Upload new numerical source-bound certificate only, no confidential source data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase43-${{ matrix.dataset }}-eight-fresh-canonical-semantic
          path: ${{ runner.temp }}/report.json
          retention-days: 30
          if-no-files-found: error

  final_gate:
    name: Verify all 8 original dataset NumPy cached canonical producers of 8 fresh CSVs
    needs: [preflight,canary,remaining]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fail if any producer pair/triple/candidate analysis did not succeed
        env:
          P: ${{ needs.preflight.result }}
          C: ${{ needs.canary.result }}
          R: ${{ needs.remaining.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$P" = success && test "$C" = success && test "$R" = success
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p2-phase43-*-eight-fresh-canonical-semantic
          path: evidence
      - name: Exact eight original dataset x eight fresh complete numerical and ordering CSV proofs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          ds=("technology","financials","consumer_goods","materials","capital_goods_others",
              "transportation_utilities","exclude_capital_goods_transportation_utilities",
              "exclude_transportation_utilities")
          root=Path("evidence")
          want={"p2-phase43-"+n+"-eight-fresh-canonical-semantic" for n in ds}
          found={p.name for p in root.iterdir() if p.is_dir()}
          assert want==found,(want-found,found-want)
          for n in ds:
              j=json.loads((root/("p2-phase43-"+n+"-eight-fresh-canonical-semantic")/"report.json").read_text())
              assert j["status"]=="PASS_PHASE43_EIGHT_FRESH_CANONICAL_SEMANTIC_NUMERIC_OUTPUTS"
              assert j["dataset"]==n and len(j["new_semantic_outputs"])==8
              assert all(x["numeric_and_original_order_parity"] is True for x in j["new_semantic_outputs"].values())
              assert j["semantic_all_23_real_output_complete"] is False
              assert j["full_end_to_end_29_numeric_parity_certified"] is False
              assert j["release_ready"] is False
              print("PASS_PHASE43_REAL_NEW_EIGHT_SEMANTIC",n)
          print("PASS_ALL_EIGHT_DATASETS_CANONICAL_REAL_NEW_EIGHT_SEMANTIC_NUMERIC_PARITY")
          PY
      - name: Enforce truthful incomplete Phase43 and no release
        if: always()
        run: |
          echo "Eight genuinely new canonical semantic CSV outputs from pinned original functions, compared full old rows/order and numeric values, if all jobs successful." >> "$GITHUB_STEP_SUMMARY"
          echo "This is not ALL 23 fresh semantic outputs, not new full OR five producers, and not full 29-CSV end-to-end certification." >> "$GITHUB_STEP_SUMMARY"
          echo "Production P2 v12 / saved reference and success artifacts unchanged. No merge/release/deploy." >> "$GITHUB_STEP_SUMMARY"
