# Created: 2026-10-10 JST
# Approved: autonomous byte-audit of only unverified shards 4..110.
# All previously certified 228 HTML pages are excluded forever.
# Private permanent JSON evidence; STOP on any FAIL, no production deployment.
# Initial one-time push completed; all further runs are validated workflow_dispatch.
name: P2 Conditions automatic private-evidence audit

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Contiguous unverified shard indices as JSON (max 3)"
        required: true
        type: string
        default: "[4]"

permissions:
  contents: read
  actions: write

concurrency:
  group: p2-conditions-auto-audit-20261010
  cancel-in-progress: false

jobs:
  gate:
    name: Verify private ledger and reject previously successful shards
    runs-on: ubuntu-24.04
    outputs:
      shards_json: ${{ steps.preflight.outputs.shards_json }}
    env:
      REQUESTED_SHARDS: ${{ inputs.shards || '[4]' }}
    steps:
      - name: Checkout public controller
        uses: actions/checkout@v4
      - name: Checkout private evidence ledger
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: audit/p2-condition-html-autovalidate-20261010
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: evidence
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/audits/p2_condition_auto/
          persist-credentials: false
      - name: Test and validate cursor before any old HTML checkout
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/p2_condition_autorun_controller_20261010.py selftest
          python scripts/audit_p2_condition_shard_20261010.py --mode selftest
          python scripts/p2_condition_autorun_controller_20261010.py preflight \
            --ledger evidence/docs/audits/p2_condition_auto/ledger.json \
            --shards "$REQUESTED_SHARDS" --github-output "$GITHUB_OUTPUT"

  audit_sector:
    needs: gate
    name: Conditions ${{ matrix.dataset }} shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        dataset: [technology, financials, consumer_goods, materials, capital_goods_others, transportation_utilities]
        shard: ${{ fromJSON(needs.gate.outputs.shards_json) }}
    env:
      CORE_SHA: c0c69be8e28ddfa5812c1bbe4ba3d33f432fbf02
      CORE_BRANCH: research/p2-nikkei-complete-baseline-20260915
      LEGACY_RENDER_SHA: 3dfb14cd0f05125c4bfce81d710db0ced073b7c3
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: scripts
    steps:
      - name: Checkout public Actions repository
        uses: actions/checkout@v4
      - name: Checkout pinned canonical manifest only
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: c0c69be8e28ddfa5812c1bbe4ba3d33f432fbf02
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: manifest_core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /preview/kabu/analysis/225_group_all_period/${{ matrix.dataset }}/condition_detail_manifest.csv
          persist-credentials: false
      - name: Self-test planner and choose unverified conditions only
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_p2_condition_shard_20261010.py --mode selftest
          python scripts/audit_p2_condition_shard_20261010.py --mode plan \
            --manifest "manifest_core/preview/kabu/analysis/225_group_all_period/${{ matrix.dataset }}/condition_detail_manifest.csv" \
            --dataset ${{ matrix.dataset }} --shard ${{ matrix.shard }} \
            --core-sha "$CORE_SHA" --legacy-sha "$LEGACY_RENDER_SHA" \
            --out "$RUNNER_TEMP/p2_shard_plan.json" --github-output "$GITHUB_OUTPUT"
      - name: Checkout private core with just eight selected old HTML files
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: c0c69be8e28ddfa5812c1bbe4ba3d33f432fbf02
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/
            /requirements.txt
            /docs/ACTIONS_MIGRATION.md
            /preview/kabu/analysis/225_group_all_period/${{ matrix.dataset }}/signal_level_features.csv
            /preview/kabu/analysis/225_group_all_period/${{ matrix.dataset }}/condition_detail_manifest.csv
            ${{ steps.plan.outputs.sparse_paths }}
          persist-credentials: false
      - name: Checkout immutable Oct-03 HTML renderer sources only
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 3dfb14cd0f05125c4bfce81d710db0ced073b7c3
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: legacy
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/p2_monthly_chart.py
            /scripts/refine_p2_report_information_architecture.py
            /scripts/postprocess_p2_accuracy_highlight.py
          persist-credentials: false
      - name: Verify Public-only architecture and pinned private SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "yuki746289/product_kabu_actions"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C manifest_core rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C legacy rev-parse HEAD)" = "$LEGACY_RENDER_SHA"
          if git -C core ls-tree -r --name-only HEAD | grep -E '^\.github/workflows/.*\.ya?ml$'; then
            echo "::error::Private repository contains forbidden workflow"
            exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install locked-range dependencies
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
      - name: Audit-gate synthetic unit tests
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_p2_condition_pair_byte_audit_20261010.py' -v
      - name: Prepare isolated legacy-template stage
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          # All files here are temporary and untracked: the pinned current core is immutable.
          test "$(git -C ../legacy rev-parse HEAD)" = "$LEGACY_RENDER_SHA"
          mkdir -p build/shard_legacy_source
          cp -a scripts build/shard_legacy_source/
          for item in \
            "p2_monthly_chart.py:e304d81b17ba73ce98628f7021b8faf219e3a80b" \
            "refine_p2_report_information_architecture.py:f0d915dba0fa9ca479651bbe13e5ee583c57b234" \
            "postprocess_p2_accuracy_highlight.py:77ffb7a0c13e5e754696b23979ce88ba3a330ddb"; do
            name="${item%%:*}"
            blob="${item#*:}"
            test "$(git -C ../legacy hash-object "scripts/$name")" = "$blob"
            cp "../legacy/scripts/$name" "build/shard_legacy_source/scripts/$name"
          done
          printf '{"legacy_renderer_sha":"%s","current_core_sha":"%s","page_scope":"unverified deterministic four-condition shard only","preserved_source":true}\n' "$LEGACY_RENDER_SHA" "$CORE_SHA" > build/shard_legacy_source/legacy_renderer_provenance.json
          python scripts/migrate_p2_html_templates_20261009.py --repo-root build/shard_legacy_source --output-root build/shard_extract > /dev/null
          python scripts/prepare_p2_template_stage_20261009.py --repo-root build/shard_legacy_source --extraction build/shard_extract --destination build/shard_stage > /dev/null
      - name: Generate and audit one four-condition shard
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_p2_condition_shard_20261010.py --mode run \
            --plan "$RUNNER_TEMP/p2_shard_plan.json" \
            --core core --stage core/build/shard_stage \
            --output "core/build/condition_shard_${{ matrix.shard }}_audit" \
            --dataset ${{ matrix.dataset }} \
            --core-sha "$CORE_SHA" --legacy-sha "$LEGACY_RENDER_SHA"
      - name: Verify source and tracked outputs remain unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
          echo "Read-only source contract: PASS"
      - name: Upload complete successful shard audit JSON
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-conditions-${{ matrix.dataset }}-shard-${{ matrix.shard }}-PASS
          path: |
            core/build/condition_shard_${{ matrix.shard }}_audit/shard_audit.json
            core/build/condition_shard_${{ matrix.shard }}_audit/**/p2_condition_pair_byte_audit.json
            core/build/shard_legacy_source/legacy_renderer_provenance.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload failure diagnostic (JSON only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p2-conditions-${{ matrix.dataset }}-shard-${{ matrix.shard }}-FAIL
          path: |
            core/build/condition_shard_${{ matrix.shard }}_audit/shard_audit.json
            core/build/condition_shard_${{ matrix.shard }}_audit/**/p2_condition_pair_byte_audit.json
            core/build/condition_shard_${{ matrix.shard }}_audit/**/build_manifest.json
            core/build/condition_shard_${{ matrix.shard }}_audit/**/unified_build_audit.json
            core/build/shard_legacy_source/legacy_renderer_provenance.json
          if-no-files-found: warn
          retention-days: 7

  finalize:
    name: Verify full wave, save JSON privately, dispatch next only on PASS
    needs: [gate, audit_sector]
    if: ${{ needs.gate.result == 'success' && needs.audit_sector.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout public controller
        uses: actions/checkout@v4
      - name: Checkout private permanent audit evidence
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: audit/p2-condition-html-autovalidate-20261010
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: evidence
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/audits/p2_condition_auto/
          persist-credentials: true
      - name: Download every successful shard JSON from this exact run
        uses: actions/download-artifact@v4
        with:
          pattern: p2-conditions-*-shard-*-PASS
          path: artifacts
          merge-multiple: false
      - name: Independently validate all pages and advance private ledger
        id: evaluate
        shell: bash
        env:
          SHARDS_JSON: ${{ needs.gate.outputs.shards_json }}
        run: |
          set -euo pipefail
          python scripts/p2_condition_autorun_controller_20261010.py finalize \
            --evidence-root evidence --download-root artifacts \
            --shards "$SHARDS_JSON" --github-output "$GITHUB_OUTPUT"
      - name: Permanently commit PASS JSON to a private evidence-only branch
        shell: bash
        run: |
          set -euo pipefail
          git -C evidence config user.name "github-actions[bot]"
          git -C evidence config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C evidence add docs/audits/p2_condition_auto/
          test -n "$(git -C evidence diff --cached --name-only)"
          git -C evidence commit -m "audit(p2): permanently record next verified condition batch"
          git -C evidence push origin HEAD:audit/p2-condition-html-autovalidate-20261010
      - name: Auto-dispatch the next wave only AFTER permanent private evidence save
        if: ${{ steps.evaluate.outputs.should_continue == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_SHARDS: ${{ steps.evaluate.outputs.next_shards }}
        run: |
          set -euo pipefail
          test -n "$NEXT_SHARDS"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/p2_condition_autorun_20261010.yml/dispatches" \
            -f ref=main -f "inputs[shards]=$NEXT_SHARDS"
          echo "Next verified wave submitted: $NEXT_SHARDS" >> "$GITHUB_STEP_SUMMARY"
      - name: Record terminal completion
        if: ${{ steps.evaluate.outputs.should_continue == 'false' }}
        shell: bash
        run: |
          echo "All 5364 condition HTML pages matched existing HTML. Private JSON audit complete. Deployment was not performed." >> "$GITHUB_STEP_SUMMARY"
