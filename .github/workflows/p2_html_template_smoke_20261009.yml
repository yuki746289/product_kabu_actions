# Created: 2026-10-09 JST
# Updated: 2026-10-10 JST (approved materials full-shard continuation)
# Read-only smoke of P2 v12 HTML template generator. No deployment or research-data commits.
name: P2 sector OR detail chart isolated audit

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Approved unverified sector
        type: choice
        required: true
        options:
          - consumer_goods
          - materials
          - capital_goods_others
          - transportation_utilities
      shard_start:
        description: First shard index (0..36)
        type: string
        required: true
        default: '0'
      shard_end:
        description: Last shard index (0..36)
        type: string
        required: true
        default: '0'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2_html_template_smoke_20261009.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: p2-html-template-smoke-20261009
  cancel-in-progress: false

jobs:
  check_and_generate:
    # One-time push bootstrap permitted only by the exact approved commit message.
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci: approved materials shards 0-36' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CORE_SHA: 74ac448a807258fddd32f20edbc1fa6f55ae258b
      CORE_BRANCH: research/p2-nikkei-complete-baseline-20260915
      DATASET: "${{ github.event_name == 'workflow_dispatch' && inputs.dataset || 'materials' }}"
      FIRST_SHARD: "${{ github.event_name == 'workflow_dispatch' && inputs.shard_start || '0' }}"
      LAST_SHARD: "${{ github.event_name == 'workflow_dispatch' && inputs.shard_end || '36' }}"
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout public Actions repository
        uses: actions/checkout@v4
      - name: Checkout pinned private source without modifying it
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 74ac448a807258fddd32f20edbc1fa6f55ae258b
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/
            /requirements.txt
            /docs/ACTIONS_MIGRATION.md
            /preview/kabu/analysis/225_group_all_period/consumer_goods/signal_level_features.csv
            /preview/kabu/analysis/225_group_all_period/consumer_goods/condition_detail_manifest.csv
            /preview/kabu/analysis/225_group_all_period/consumer_goods/analysis/or_details/
            /preview/kabu/analysis/225_group_all_period/consumer_goods/analysis/or_charts/
            /preview/kabu/analysis/225_group_all_period/materials/signal_level_features.csv
            /preview/kabu/analysis/225_group_all_period/materials/condition_detail_manifest.csv
            /preview/kabu/analysis/225_group_all_period/materials/analysis/or_details/
            /preview/kabu/analysis/225_group_all_period/materials/analysis/or_charts/
            /preview/kabu/analysis/225_group_all_period/capital_goods_others/signal_level_features.csv
            /preview/kabu/analysis/225_group_all_period/capital_goods_others/condition_detail_manifest.csv
            /preview/kabu/analysis/225_group_all_period/capital_goods_others/analysis/or_details/
            /preview/kabu/analysis/225_group_all_period/capital_goods_others/analysis/or_charts/
            /preview/kabu/analysis/225_group_all_period/transportation_utilities/signal_level_features.csv
            /preview/kabu/analysis/225_group_all_period/transportation_utilities/condition_detail_manifest.csv
            /preview/kabu/analysis/225_group_all_period/transportation_utilities/analysis/or_details/
            /preview/kabu/analysis/225_group_all_period/transportation_utilities/analysis/or_charts/
          persist-credentials: false
      - name: Verify Public Actions architecture and pinned core
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "yuki746289/product_kabu_actions"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          if git -C core ls-tree -r --name-only HEAD | grep -E '^\.github/workflows/.*\.ya?ml$'; then
            echo "Private repository has forbidden workflows"
            exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install pinned-range research dependencies
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
      - name: Verify deterministic bounded OR shard selection and source contracts
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_p2_or_detail_chart_shard_20261010.py' -v
          python -m unittest discover -s tests -p 'test_p2_or_detail_chart_saved_signals_20261010.py' -v
      - name: Audit selected sector with deterministic existing-HTML comparison
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          case "$DATASET" in
            consumer_goods|materials|capital_goods_others|transportation_utilities) ;;
            *) echo "::error::Unapproved sector: $DATASET"; exit 2 ;;
          esac
          [[ "$FIRST_SHARD" =~ ^(0|[1-9][0-9]*)$ ]]
          [[ "$LAST_SHARD" =~ ^(0|[1-9][0-9]*)$ ]]
          test "$FIRST_SHARD" -ge 0
          test "$LAST_SHARD" -le 36
          test "$FIRST_SHARD" -le "$LAST_SHARD"
          python scripts/migrate_p2_html_templates_20261009.py --repo-root . --output-root build/or_detail_shard/extracted > /dev/null
          python scripts/prepare_p2_template_stage_20261009.py --repo-root . --extraction build/or_detail_shard/extracted --destination build/or_detail_shard/isolated > /dev/null
          for i in $(seq "$FIRST_SHARD" "$LAST_SHARD"); do
            python scripts/verify_p2_or_detail_chart_shard_20261010.py \
              --site-root preview/kabu \
              --renderer-root build/or_detail_shard/isolated \
              --dataset "$DATASET" \
              --shard-index "$i" --shard-size 4 \
              --output-dir "build/or_detail_shard/${DATASET}_${i}"
          done
      - name: Verify source data and working-tree remain unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
          echo "Read-only source contract: PASS"
      - name: Upload limited smoke evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-or-detail-shard-audit
          path: core/build/or_detail_shard/*/or_detail_chart_shard_audit.json
          if-no-files-found: error
          retention-days: 7
