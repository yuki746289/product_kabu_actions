# Created: 2026-10-09 JST
# Read-only smoke of P2 v12 HTML template generator. No deployment or research-data commits.
name: P2 OR detail and chart saved-signal HTML byte pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2_html_template_smoke_20261009.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: p2-html-template-smoke-20261009
  cancel-in-progress: false

jobs:
  check_and_generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CORE_SHA: 0f2fefac918ffe936c7ecab7ebdb5792fc75f076
      CORE_BRANCH: research/p2-nikkei-complete-baseline-20260915
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout public Actions repository
        uses: actions/checkout@v4
      - name: Checkout pinned private source without modifying it
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 0f2fefac918ffe936c7ecab7ebdb5792fc75f076
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/
            /requirements.txt
            /docs/ACTIONS_MIGRATION.md
            /preview/kabu/analysis/225_group_all_period/technology/signal_level_features.csv
            /preview/kabu/analysis/225_group_all_period/technology/condition_detail_manifest.csv
            /preview/kabu/analysis/225_group_all_period/technology/analysis/or_details/or-03cae38f783506d9.html
            /preview/kabu/analysis/225_group_all_period/technology/analysis/or_charts/or-03cae38f783506d9.html
          persist-credentials: false
      - name: Verify Public Actions architecture and pinned core
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "yuki746289/product_kabu_actions"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          if git -C core ls-tree -r --name-only HEAD | grep -E '^\.github/workflows/.*\.ya?ml$'; then
            echo "Private repository has forbidden workflows"
            exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install pinned-range research dependencies
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
      - name: Verify saved-signal OR display input contracts
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_p2_or_detail_chart_saved_signals_20261010.py' -v
          python -m unittest discover -s tests -p 'test_p2_html_numbered_modules_20261010.py' -v
      - name: Extract isolated historic renderer and compare a real detail/chart pair
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          python scripts/migrate_p2_html_templates_20261009.py --repo-root . --output-root build/or_detail_pilot/extracted > /dev/null
          python scripts/prepare_p2_template_stage_20261009.py --repo-root . --extraction build/or_detail_pilot/extracted --destination build/or_detail_pilot/isolated > /dev/null
          python scripts/verify_p2_or_detail_chart_saved_signals_20261010.py \
            --site-root preview/kabu \
            --renderer-root build/or_detail_pilot/isolated \
            --dataset technology --chart-index 0 \
            --output-dir build/or_detail_pilot/technology_sample
      - name: Verify source data and working-tree remain unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
          echo "Read-only source contract: PASS"
      - name: Upload limited smoke evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-or-detail-chart-pilot-audit
          path: core/build/or_detail_pilot/technology_sample/or_detail_chart_pilot_audit.json
          if-no-files-found: warn
          retention-days: 7
