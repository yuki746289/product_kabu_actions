# Created: 2026-10-09 JST
# Read-only smoke of P2 v12 HTML template generator. No deployment or research-data commits.
name: P2 p01-p07 ordered-module compatibility and HTML regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2_html_template_smoke_20261009.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: p2-html-template-smoke-20261009
  cancel-in-progress: false

jobs:
  check_and_generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CORE_SHA: c19cdc174ecb26c76726f3307e9df3af16c3a213
      CORE_BRANCH: research/p2-nikkei-complete-baseline-20260915
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout public Actions repository
        uses: actions/checkout@v4
      - name: Checkout pinned private source without modifying it
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: c19cdc174ecb26c76726f3307e9df3af16c3a213
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/
            /requirements.txt
            /docs/ACTIONS_MIGRATION.md
            /preview/kabu/analysis/225_group_all_period/technology/
            /preview/kabu/analysis/225_group_all_period/financials/
            /preview/kabu/analysis/225_group_all_period/consumer_goods/
            /preview/kabu/analysis/225_group_all_period/materials/
            /preview/kabu/analysis/225_group_all_period/capital_goods_others/
            /preview/kabu/analysis/225_group_all_period/transportation_utilities/
            /preview/kabu/analysis/225_indicator_stageb/index.html
            /preview/kabu/report_225_all_period.html
          persist-credentials: false
      - name: Verify Public Actions architecture and pinned core
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "yuki746289/product_kabu_actions"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          if git -C core ls-tree -r --name-only HEAD | grep -E '^\.github/workflows/.*\.ya?ml$'; then
            echo "Private repository has forbidden workflows"
            exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install pinned-range research dependencies
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
      - name: Assert numbered p01-p07 modules and legacy API contracts
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_p2_html_numbered_modules_20261010.py' -v
          python -m unittest discover -s tests -p 'test_p2_html_core_20261010.py' -v
          python -m unittest discover -s tests -p 'test_p2_or_summary_saved_csv_20261010.py' -v
          python -m unittest discover -s tests -p 'test_p2_or_render_link_diff_20261010.py' -v
          python -m unittest discover -s tests -p 'test_p2_or_detail_inventory_20261010.py' -v
      - name: Validate unchanged P2 v12 data with six-sector rendering and numeric audits
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          python scripts/run_p2_html_shared_smoke_20261010.py --repo-root .
      - name: Reproduce historic OR HTML using p05 render adapters and p06-p07 gates
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          STAGE="$(find build/p2_html_shared_smoke -type d -name isolated -print -quit)"
          test -n "$STAGE"
          python scripts/p2_html_build.py --repo-root . --site-root preview/kabu --stage-root "$STAGE" --dataset technology --family or_lists --output-dir build/p2_numbered_${{ github.run_id }}/technology_or_lists
          python scripts/p2_html_build.py --repo-root . --site-root preview/kabu --stage-root "$STAGE" --dataset financials --family or_lists --output-dir build/p2_numbered_${{ github.run_id }}/financials_or_lists
          python scripts/p2_html_build.py --repo-root . --site-root preview/kabu --stage-root "$STAGE" --dataset technology --family or_summary --allow-experimental --output-dir build/p2_numbered_${{ github.run_id }}/technology_or_summary
      - name: Verify source data and working-tree remain unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
          echo "Read-only source contract: PASS"
      - name: Upload limited smoke evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-numbered-modules-regression-evidence
          path: |
            core/build/p2_html_shared_smoke/*/shared_smoke_summary.json
            core/build/p2_numbered_*/technology_or_lists/or_listing_audit.json
            core/build/p2_numbered_*/financials_or_lists/or_listing_audit.json
            core/build/p2_numbered_*/technology_or_summary/or_summary_audit.json
            core/build/p2_numbered_*/*/unified_build_audit.json
          if-no-files-found: warn
          retention-days: 7
