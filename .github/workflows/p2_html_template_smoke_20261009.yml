# Created: 2026-10-09 JST
# Read-only smoke of P2 v12 HTML template generator. No deployment or research-data commits.
name: P2 HTML shared engine six-sector OR validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2_html_template_smoke_20261009.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: p2-html-template-smoke-20261009
  cancel-in-progress: false

jobs:
  check_and_generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CORE_SHA: 6130532d283f815b80625adb13bac38bf041ec8f
      CORE_BRANCH: research/p2-nikkei-complete-baseline-20260915
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout public Actions repository
        uses: actions/checkout@v4
      - name: Checkout pinned private source without modifying it
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 6130532d283f815b80625adb13bac38bf041ec8f
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/
            /requirements.txt
            /docs/ACTIONS_MIGRATION.md
            /preview/kabu/analysis/225_group_all_period/technology/
            /preview/kabu/analysis/225_group_all_period/financials/
            /preview/kabu/analysis/225_group_all_period/consumer_goods/
            /preview/kabu/analysis/225_group_all_period/materials/
            /preview/kabu/analysis/225_group_all_period/capital_goods_others/
            /preview/kabu/analysis/225_group_all_period/transportation_utilities/
            /preview/kabu/analysis/225_indicator_stageb/index.html
            /preview/kabu/report_225_all_period.html
          persist-credentials: false
      - name: Verify Public Actions architecture and pinned core
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "yuki746289/product_kabu_actions"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          if git -C core ls-tree -r --name-only HEAD | grep -E '^\.github/workflows/.*\.ya?ml$'; then
            echo "Private repository has forbidden workflows"
            exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install pinned-range research dependencies
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
      - name: Validate shared HTML engine and 2 saved datasets
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          python scripts/run_p2_html_shared_smoke_20261010.py --repo-root .
      - name: Verify all six group OR2/OR3 listing HTML bytes with one CLI
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          STAGE="$(find build/p2_html_shared_smoke -type d -name isolated -print -quit)"
          test -n "$STAGE"
          python scripts/p2_html_build.py --repo-root . --site-root preview/kabu --stage-root "$STAGE" --dataset technology --family or_lists --output-dir build/or_lists_${{ github.run_id }}/technology
          python scripts/p2_html_build.py --repo-root . --site-root preview/kabu --stage-root "$STAGE" --dataset financials --family or_lists --output-dir build/or_lists_${{ github.run_id }}/financials
          python scripts/p2_html_build.py --repo-root . --site-root preview/kabu --stage-root "$STAGE" --dataset consumer_goods --family or_lists --output-dir build/or_lists_${{ github.run_id }}/consumer_goods
          python scripts/p2_html_build.py --repo-root . --site-root preview/kabu --stage-root "$STAGE" --dataset materials --family or_lists --output-dir build/or_lists_${{ github.run_id }}/materials
          python scripts/p2_html_build.py --repo-root . --site-root preview/kabu --stage-root "$STAGE" --dataset capital_goods_others --family or_lists --output-dir build/or_lists_${{ github.run_id }}/capital_goods_others
          python scripts/p2_html_build.py --repo-root . --site-root preview/kabu --stage-root "$STAGE" --dataset transportation_utilities --family or_lists --output-dir build/or_lists_${{ github.run_id }}/transportation_utilities
      - name: Verify source data and working-tree remain unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
          echo "Read-only source contract: PASS"
      - name: Upload limited smoke evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-shared-engine-smoke-evidence
          path: |
            core/build/p2_html_shared_smoke/*/shared_smoke_summary.json
            core/build/p2_html_shared_smoke/*/technology/build_manifest.json
            core/build/p2_html_shared_smoke/*/financials/build_manifest.json
            core/build/p2_html_shared_smoke/*/technology_audit/summary.json
            core/build/p2_html_shared_smoke/*/financials_audit/summary.json
            core/build/p2_html_shared_smoke/*/technology/unified_build_audit.json
            core/build/p2_html_shared_smoke/*/financials/unified_build_audit.json
            core/build/or_lists_*/technology/or_listing_audit.json
            core/build/or_lists_*/financials/or_listing_audit.json
            core/build/or_lists_*/technology/unified_build_audit.json
            core/build/or_lists_*/financials/unified_build_audit.json
            core/build/or_lists_*/consumer_goods/or_listing_audit.json
            core/build/or_lists_*/consumer_goods/unified_build_audit.json
            core/build/or_lists_*/materials/or_listing_audit.json
            core/build/or_lists_*/materials/unified_build_audit.json
            core/build/or_lists_*/capital_goods_others/or_listing_audit.json
            core/build/or_lists_*/capital_goods_others/unified_build_audit.json
            core/build/or_lists_*/transportation_utilities/or_listing_audit.json
            core/build/or_lists_*/transportation_utilities/unified_build_audit.json
          if-no-files-found: warn
          retention-days: 7
