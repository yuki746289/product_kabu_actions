          for dataset in datasets:
              values=[]
              for start in starts:
                  d=json.loads((root/("p2-phase31-"+dataset+"-start-"+str(start))/"audit.json").read_text(encoding="utf-8"))
                  assert d["status"]=="PASS_PHASE31_NEW_TRIPLE_DISJOINT_SHARD"
                  assert d["dataset"]==dataset and d["feature_first_start"]==start
                  assert d["new_triple_rows"]==d["old_subset_triple_rows"]>0
                  assert d["numerical_errors"]==[]
                  assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
                  assert d["previous_certified_triples_recalculated"] is False
                  assert d["release_ready"] is False
                  values.append(d)
              assert len({z["source_sha256"] for z in values})==1
              assert len({z["old_full_triple_sha256"] for z in values})==1
              omitted=570 if dataset=="transportation_utilities" else 0
              assert sum(z["new_triple_rows"] for z in values)+omitted==values[0]["original_full_triples"],dataset
              assert sum(z["feature_triples_tested"] for z in values)==(556 if omitted else 560),dataset
              print("PASS_PHASE31_FULL_TRIPLE_PARTITION",dataset,values[0]["original_full_triples"],"prior",omitted)
          print("PASS_PHASE31_ALL_EIGHT_DATASETS_DISJOINT_TRIPLE_NUMERIC_PARITY")
          PY
      - name: Mark exact scope, no release or deployment
        run: |
          echo "Triple candidate rows fully compared for 8 datasets. Prior transport 570 reused." >> "$GITHUB_STEP_SUMMARY"
          echo "Not certified: full OR/combination/29CSV/HTML/major225 adapter/Nikkei890 source." >> "$GITHUB_STEP_SUMMARY"
