# Created: 2026-10-14 JST
# Exact original _triples for each disjoint 3-feature set, never full semantic/OR.
# Run only after Phase30 32 independent successes and fixed head SHA.
# Transport 570 previously proved triples are omitted and prior proof is reused.
# No private workflow, old artifact rerun, production, release, PR merge or deploy.
name: P2 Phase31 disjoint original triple numerical parity chain
on:
  push:
    branches: [automation/p2-common-postextract-20261012]
    paths:
      - '.github/workflows/p2_phase31_full_triples_20261014.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-phase31-disjoint-new-triples-20261014
  cancel-in-progress: false
env:
  CORE_SHA: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  selftest:
    name: Pin completed Phase30 run and verify disjoint triple contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require exact success SHA and syntax before further calculations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          python -m py_compile scripts/p2_common_phase31_full_triple_shard_20261014.py
          python scripts/p2_common_phase31_full_triple_shard_20261014.py --selftest
          gh api repos/yuki746289/product_kabu_actions/actions/runs/38501324654 --jq '.conclusion + " " + .head_sha' | \
            grep -Fx 'success 072332dc06c1f4d8a2ab2abff7f227b1a9181de2'

  canary:
    name: Phase31 new disjoint triples (${{ matrix.dataset }}, first=${{ matrix.start }})
    needs: selftest
    if: ${{ needs.selftest.result == 'success' }}
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        include:
          - dataset: "technology"
            start: 12
            dir: "225_group_all_period/technology"
            sourceRun: 0
            sourceArtifact: ""
            proof4: "p2-common-exact-six-group-identities"
            proof4File: "group.json"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DATASET: ${{ matrix.dataset }}
      START: '${{ matrix.start }}'
    steps:
      - uses: actions/checkout@v4
      - name: Sparse checkout only pinned Private code + original triple CSV
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
            /preview/kabu/analysis/${{ matrix.dir }}/signal_level_features.csv
            /preview/kabu/analysis/${{ matrix.dir }}/tested_triple_combinations.csv
          persist-credentials: false
      - name: Enforce public runner, pinned core SHA, no Private workflows and architecture PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Private workflow detected"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse original saved exclusion source, never reconstruct
        if: ${{ matrix.sourceRun != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sourceArtifact }}
          run-id: ${{ matrix.sourceRun }}
          github-token: ${{ github.token }}
          path: original_source
      - name: Reuse certified Phase4 exact saved source identity
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.proof4 }}
          run-id: 38239501315
          github-token: ${{ github.token }}
          path: phase4
      - name: Reuse already certified transport 570 triples, without recomputation
        if: ${{ matrix.dataset == 'transportation_utilities' }}
        uses: actions/download-artifact@v4
        with:
          name: p2-common-phase26-transport-four-feature-triple-evidence
          run-id: 38492796157
          github-token: ${{ github.token }}
          path: prior_transport
      - name: Reuse all four previously successful Phase30 pairwise shard proofs
        uses: actions/download-artifact@v4
        with:
          pattern: p2-phase30-${{ matrix.dataset }}-start-*
          run-id: 38501324654
          github-token: ${{ github.token }}
          path: phase30_all
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install original canonical dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Rebind each Phase30 source-bound JSON to its exact feature-first interval
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase30
          for start in 0 4 8 12; do
            artifact_dir="phase30_all/p2-phase30-$DATASET-start-$start"
            test -f "$artifact_dir/audit.json"
            mkdir -p "phase30/$start"
            cp "$artifact_dir/audit.json" "phase30/$start/audit.json"
          done
      - name: New isolated canonical triple calculation and comparison by feature triple
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$DATASET" = "transportation_utilities" ]; then
            test -f prior_transport/report.json
            args+=(--transport-proof prior_transport/report.json)
          fi
          python scripts/p2_common_phase31_full_triple_shard_20261014.py \
            --dataset "$DATASET" --start "$START" --core core \
            --reference "core/preview/kabu/analysis/${{ matrix.dir }}" \
            --original-source original_source \
            --proof4 "phase4/${{ matrix.proof4File }}" \
            --pair-proofs phase30 \
            "${args[@]}" \
            --stage "core/build/p2_phase31_$GITHUB_RUN_ID/$DATASET/$START" \
            --report "$RUNNER_TEMP/audit.json"
      - name: Validate exact old/new triple keys, numerical equality and no prior rerun
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"audit.json").read_text(encoding="utf-8"))
          assert d["status"]=="PASS_PHASE31_NEW_TRIPLE_DISJOINT_SHARD"
          assert d["dataset"]==os.environ["DATASET"]
          assert d["feature_first_start"]==int(os.environ["START"])
          assert d["feature_triples_tested"]>0
          assert d["new_triple_rows"]==d["old_subset_triple_rows"]>0
          assert d["numerical_errors"]==[]
          assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          for k in ("previous_certified_triples_recalculated",
                    "previous_artifacts_recalculated","full_semantic_recalculated",
                    "full_or_recalculated","saved_signals_recomputed",
                    "html_generated","production_changed","release_ready"):
              assert d[k] is False,k
          print("PASS_PHASE31_NEW_TRIPLE_SHARD",d["dataset"],
                d["feature_first_start"],d["new_triple_rows"])
          PY
      - name: Confirm original Private tracked bytes unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Save compact audit metadata JSON only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase31-${{ matrix.dataset }}-start-${{ matrix.start }}
          path: ${{ runner.temp }}/audit.json
          retention-days: 14
          if-no-files-found: error


  remaining:
    name: Phase31 new disjoint triples (${{ matrix.dataset }}, first=${{ matrix.start }})
