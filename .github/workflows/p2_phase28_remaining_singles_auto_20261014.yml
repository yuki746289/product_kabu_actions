  final_gate:
    name: Verify exactly eight independent complete single-candidate certificates
    needs: [selftest, canary, remaining]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any upstream work did not pass
        env:
          SELF: ${{ needs.selftest.result }}
          CANARY: ${{ needs.canary.result }}
          REST: ${{ needs.remaining.result }}
        run: |
          set -euo pipefail
          test "$SELF" = success && test "$CANARY" = success && test "$REST" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: p2-phase28-*-all-remaining-single-candidates
          path: evidence
      - name: Read-only final aggregated SHA and dataset coverage check
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          candidates={
              "technology":54,"financials":64,"consumer_goods":64,
              "materials":56,"capital_goods_others":57,"transportation_utilities":64,
              "exclude_capital_goods_transportation_utilities":64,
              "exclude_transportation_utilities":55,
          }
          root=Path("evidence")
          expected={"p2-phase28-"+ds+"-all-remaining-single-candidates" for ds in candidates}
          found={p.name for p in root.iterdir() if p.is_dir()}
          assert found==expected,(found,expected)
          for ds,total in sorted(candidates.items()):
              path=root/("p2-phase28-"+ds+"-all-remaining-single-candidates")/"summary.json"
              d=json.loads(path.read_text(encoding="utf-8"))
              assert d["status"]=="PASS_PHASE28_ALL_REMAINING_SINGLES_BOUNDED"
              assert d["dataset"]==ds and d["candidate_total"]==total
              assert d["previously_certified_candidates"]==9
              assert d["new_candidates"]==total-9
              assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
              assert d["mismatches"]==[]
              assert d["production_changed"] is False and d["release_ready"] is False
              print("PASS_PHASE28_FULL_SAVED_SINGLE_CANDIDATE_COVERAGE",ds,total)
          print("PASS_PHASE28_EIGHT_DATASETS_ALL_SAVED_CANDIDATE_SINGLES_LIMITED_6_CSV")
          PY
      - name: Prevent accidental full release certification
        run: |
          echo "Only saved single candidate conditions on six stability/rolling CSVs are numerically certified." >> "$GITHUB_STEP_SUMMARY"
          echo "Still unverified: full pair/triple/combination/OR, all 29 CSVs, all_225 adapter, HTML QA, Nikkei 890 CSV source." >> "$GITHUB_STEP_SUMMARY"
          echo "PR #62 Draft; no merge, release or deployment." >> "$GITHUB_STEP_SUMMARY"
