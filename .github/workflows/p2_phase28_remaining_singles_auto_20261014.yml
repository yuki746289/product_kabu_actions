            proof26_run: 38496510859
            proof26_artifact: "p2-common-phase26-rolling-candidate-financials"
            proof26_file: "report.json"
          - dataset: "consumer_goods"
            total: 64
            reference_dir: "225_group_all_period/consumer_goods"
            source_run: 0
            source_artifact: ""
            proof4: "p2-common-exact-six-group-identities"
            proof4_file: "group.json"
            proof26_run: 38496510859
            proof26_artifact: "p2-common-phase26-rolling-candidate-consumer_goods"
            proof26_file: "report.json"
          - dataset: "materials"
            total: 56
            reference_dir: "225_group_all_period/materials"
            source_run: 0
            source_artifact: ""
            proof4: "p2-common-exact-six-group-identities"
            proof4_file: "group.json"
            proof26_run: 38496510859
            proof26_artifact: "p2-common-phase26-rolling-candidate-materials"
            proof26_file: "report.json"
          - dataset: "capital_goods_others"
            total: 57
            reference_dir: "225_group_all_period/capital_goods_others"
            source_run: 0
            source_artifact: ""
            proof4: "p2-common-exact-six-group-identities"
            proof4_file: "group.json"
            proof26_run: 38496510859
            proof26_artifact: "p2-common-phase26-rolling-candidate-capital_goods_others"
