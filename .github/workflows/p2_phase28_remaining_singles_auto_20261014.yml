            proof26_run: 38495878262
            proof26_artifact: "p2-common-phase26-transport-three-condition-rolling-candidate-evidence"
            proof26_file: "report.json"
          - dataset: "exclude_capital_goods_transportation_utilities"
            total: 64
            reference_dir: "225_exclusion_all_period/exclude_capital_goods_transportation_utilities"
            source_run: 37201520569
            source_artifact: "p2-225-exclusion-no-capital-transport-features"
            proof4: "p2-common-exact-exclude_capital_goods_transportation_utilities-identities"
            proof4_file: "audit.json"
            proof26_run: 38496915820
            proof26_artifact: "p2-common-phase26-exclusion-six-csv-exclude_capital_goods_transportation_utilities"
            proof26_file: "audit.json"
          - dataset: "exclude_transportation_utilities"
            total: 55
            reference_dir: "225_exclusion_all_period/exclude_transportation_utilities"
            source_run: 37201518110
            source_artifact: "p2-225-exclusion-no-transport-features"
            proof4: "p2-common-exact-exclude_transportation_utilities-identities"
            proof4_file: "audit.json"
            proof26_run: 38496915820
            proof26_artifact: "p2-common-phase26-exclusion-six-csv-exclude_transportation_utilities"
            proof26_file: "audit.json"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DATASET: ${{ matrix.dataset }}
      EXPECTED_TOTAL: '${{ matrix.total }}'
    steps:
