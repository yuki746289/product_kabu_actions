name: P2 v12 100 sample charts

on:
  push:
    paths:
      - ".github/workflows/p2_v12_sample_charts_100.yml"
      - "trigger/p2_v12_sample_charts_100.txt"

permissions:
  contents: read
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private prototype
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: fix/p2-daily-anchor-pullback-cases
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: _core
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _core/requirements.txt

      - name: Install Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r _core/requirements.txt

      - name: Verify rendering rules exist
        run: test -f _core/docs/10_HISTORICAL_REVIEW_CHART_RULES.md

      - name: Reuse validated P2 v12 signal artifact
        uses: actions/download-artifact@v4
        with:
          name: p2-v12-fast-full
          path: _core/data/diagnostics/p2_v12_fast
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: yuki746289/product_kabu_actions
          run-id: 34230258166

      - name: Generate 50 long + 50 short charts using canonical renderer
        working-directory: _core
        run: python scripts/generate_p2_v12_review_samples.py --per-direction 50

      - name: Verify 100 charts, membership and marker counts
        working-directory: _core
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('data/diagnostics/p2_v12_review_samples')
          status = json.loads((root / 'status.json').read_text(encoding='utf-8'))
          manifest = pd.read_csv(root / 'manifest.csv')
          render_manifest = pd.read_csv(root / 'rendered' / 'chart_manifest.csv')

          assert status['verification'] == 'PASS', status
          assert status['long_images'] == 50, status
          assert status['short_images'] == 50, status
          assert status['long_membership_ok'], status
          assert status['short_membership_ok'], status
          assert status['marker_counts_match_v12'], status
          assert status['triangle_labels_ok'], status
          assert status['multi_marker_chart_count'] > 0, status
          assert len(manifest) == 100, len(manifest)
          assert (manifest.loc[manifest.bucket == 'long', 'long_signal_count'] >= 1).all()
          assert (manifest.loc[manifest.bucket == 'short', 'short_signal_count'] >= 1).all()
          assert len(list((root / 'long').glob('*.png'))) == 50
          assert len(list((root / 'short').glob('*.png'))) == 50
          assert (render_manifest['signal_count'].astype(int) >= 1).all()
          assert 'generate_backtest_review_charts.py' in status['renderer']
          assert status['rules'] == 'docs/10_HISTORICAL_REVIEW_CHART_RULES.md'
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: p2-v12-sample-charts-100
          path: _core/data/diagnostics/p2_v12_review_samples
          if-no-files-found: error
          retention-days: 14
