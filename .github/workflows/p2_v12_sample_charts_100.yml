name: P2 v12 100 sample charts

on:
  push:
    paths:
      - ".github/workflows/p2_v12_sample_charts_100.yml"
      - "trigger/p2_v12_sample_charts_100.txt"

permissions:
  contents: read
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private prototype
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: fix/p2-daily-anchor-pullback-cases
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: _core
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _core/requirements.txt

      - name: Install Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r _core/requirements.txt

      - name: Reuse validated P2 v12 signal artifact
        uses: actions/download-artifact@v4
        with:
          name: p2-v12-fast-full
          path: _core/data/diagnostics/p2_v12_fast
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: yuki746289/product_kabu_actions
          run-id: 34230258166

      - name: Generate 50 long + 50 short charts from v12 signals
        working-directory: _core
        run: python scripts/generate_p2_v12_sample_charts.py --per-direction 50

      - name: Verify 100 charts and marker directions
        working-directory: _core
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root = Path('data/diagnostics/p2_v12_sample_charts')
          status = json.loads((root / 'status.json').read_text(encoding='utf-8'))
          manifest = pd.read_csv(root / 'manifest.csv')
          assert status['verification'] == 'PASS', status
          assert status['long_images'] == 50, status
          assert status['short_images'] == 50, status
          assert status['total_images'] == 100, status
          assert len(manifest) == 100
          assert set(manifest.loc[manifest.direction == 'long', 'symbol']) == {'△'}
          assert set(manifest.loc[manifest.direction == 'short', 'symbol']) == {'▽'}
          assert (manifest['target_marker_count'] == 1).all()
          assert (manifest['old_marker_count'] == 0).all()
          images = list((root / 'long').glob('*.png')) + list((root / 'short').glob('*.png'))
          assert len(images) == 100, len(images)
          print(status)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: p2-v12-sample-charts-100
          path: _core/data/diagnostics/p2_v12_sample_charts
          if-no-files-found: error
          retention-days: 14
