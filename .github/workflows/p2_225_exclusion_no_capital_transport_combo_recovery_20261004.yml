name: P2 225 exclusion no capital transport combo stability recovery 20261004

on:
  push:
    branches: [main]
    paths:
      - '.github/p2_225_exclusion_no_capital_transport_combo_recovery_trigger'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  SOURCE_RUN_ID: "37201520569"
  SOURCE_FEATURE_ARTIFACT: "p2-225-exclusion-no-capital-transport-features"
  SEMANTIC_RUN_ID: "37201967494"

jobs:
  recover_triple:
    strategy:
      fail-fast: false
      matrix:
        shard: [8,11,24,27]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Resolve core SHA
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(awk -F': ' '$1=="expected_core_head"{print $2}' .github/p2_225_exclusion_no_capital_transport_combo_recovery_trigger)"
          test -n "$SHA"
          echo "core_sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: ${{ steps.cfg.outputs.core_sha }}
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements.txt
      - run: pip install -r core/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_FEATURE_ARTIFACT }}
          path: /tmp/features
          repository: yuki746289/product_kabu_actions
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: p2-225-exclusion-no-capital-transport-structural
          path: /tmp/structural
          repository: yuki746289/product_kabu_actions
          run-id: ${{ env.SEMANTIC_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover split triple stability shard
        working-directory: core
        run: |
          python scripts/build_p2_225_combo_stability_shard.py \
            --features /tmp/features/features.csv \
            --structural-dir /tmp/structural \
            --kind triple \
            --shard-index ${{ matrix.shard }} \
            --shard-count 32 \
            --output-dir /tmp/recovery
      - uses: actions/upload-artifact@v4
        with:
          name: p2-225-exclusion-no-capital-transport-combo-stability-recovery-${{ matrix.shard }}
          path: /tmp/recovery
          retention-days: 30
