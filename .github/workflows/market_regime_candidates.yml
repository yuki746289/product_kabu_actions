name: P1/P2 market regime candidates

on:
  push:
    paths:
      - ".github/workflows/market_regime_candidates.yml"
      - "trigger/market_regime_candidates.txt"

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private core
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: fix/p2-daily-anchor-pullback-cases
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: _core
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _core/requirements.txt

      - name: Install dependencies
        run: pip install -r _core/requirements.txt

      - name: Calculate extended P1/P2 market-regime candidate periods
        working-directory: _core
        run: python scripts/select_market_regime_periods.py --analysis-start 2005-01-01 --fetch-start 2003-01-01 --topn 5

      - name: Verify outputs
        working-directory: _core
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('data/diagnostics/market_regimes')
          status = json.loads((root / 'status.json').read_text(encoding='utf-8'))
          p1 = pd.read_csv(root / 'p1_candidates.csv')
          p2 = pd.read_csv(root / 'p2_candidates.csv')
          summary = pd.read_csv(root / 'selected_summary.csv')
          expected = {'uptrend','downtrend','range','consolidation','mixed'}
          assert status['overall_pass'], status
          assert len(p1) == 25, len(p1)
          assert len(p2) == 25, len(p2)
          assert len(summary) == 10, len(summary)
          assert set(p1['regime']) == expected
          assert set(p2['regime']) == expected
          assert set(summary['scope']) == {'p1','p2'}
          print(summary.to_string(index=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: market-regime-candidates-p1-p2-extended
          path: _core/data/diagnostics/market_regimes
          if-no-files-found: error
          retention-days: 30
