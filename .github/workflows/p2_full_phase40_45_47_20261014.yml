  html_full_qa:
    name: Full existing HTML links + Chromium responsive smoke (${{ matrix.dataset }})
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - dataset: "technology"
            dir: "225_group_all_period/technology"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "financials"
            dir: "225_group_all_period/financials"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "consumer_goods"
            dir: "225_group_all_period/consumer_goods"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "materials"
            dir: "225_group_all_period/materials"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "capital_goods_others"
            dir: "225_group_all_period/capital_goods_others"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "transportation_utilities"
            dir: "225_group_all_period/transportation_utilities"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "exclude_capital_goods_transportation_utilities"
            dir: "225_exclusion_all_period/exclude_capital_goods_transportation_utilities"
            sourceRun: 37201520569
            sourceArtifact: "p2-225-exclusion-no-capital-transport-features"
          - dataset: "exclude_transportation_utilities"
            dir: "225_exclusion_all_period/exclude_transportation_utilities"
            sourceRun: 37201518110
            sourceArtifact: "p2-225-exclusion-no-transport-features"
    env:
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Read original Private HTML files and shared pinned manifest
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /preview/kabu/index.html
            /preview/kabu/analysis/${{ matrix.dir }}/
          persist-credentials: false
      - name: Mandatory SHA and Public architecture before browser test
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium-only browser driver in ephemeral Public job
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'playwright>=1.55,<2.0'
          python -m playwright install --with-deps chromium
      - name: Inspect every original dataset HTML link then Chromium desktop/mobile representative flows
        shell: bash
        run: |
          set -euo pipefail
          python scripts/p2_full_original_html_browser_20261014.py \
            --core core --dataset "$DATASET" --out "$RUNNER_TEMP/report.json"
      - name: Independent real-browser smoke and full link SHA gate
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"report.json").read_text())
          assert d["status"]=="PASS_FULL_ORIGINAL_HTML_LINK_SCAN_AND_BROWSER_SMOKE"
          assert d["dataset"]==os.environ["DATASET"]
          assert d["pages_scanned"]>=20 and d["in_site_links_verified"]>=20
          assert d["browser_smokes"]>=4 and d["unresolved_internal_links"]==0
          assert d["old_html_modified"] is False and d["release_ready"] is False
          print("PASS_PINNED_ALL_HTML_LINKS_BROWSER_SMOKE",d["dataset"])
          PY
      - name: Verify tracked Private HTML still untouched
        if: always()
        run: |
          set -euo pipefail
          test -z "$(git -C core diff --name-only)"
