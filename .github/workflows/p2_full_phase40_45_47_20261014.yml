# User-approved unified full producer and browser QA attempt. Phase46 deferred, Phase48 prohibited.
# No changes to original signals / Production P2 v12 / existing successful CSV/HTML artifacts.
name: P2 full Phase40-45 and 47 independent certification attempt
on:
  push:
    branches: [automation/p2-common-postextract-20261012]
    paths:
      - '.github/workflows/p2_full_phase40_45_47_20261014.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-full-phase40-45-47-20261014
  cancel-in-progress: false
env:
  CORE_SHA: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  preflight:
    name: Require previous Phase38,39,40-47 scoped gates; selftest actual full producer code
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify successful SHA-pinned prior gate and static full producer contracts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          python -m py_compile scripts/p2_full_newproducer_29csv_20261014.py scripts/p2_full_original_html_browser_20261014.py
          python scripts/p2_full_newproducer_29csv_20261014.py --selftest
          python scripts/p2_full_original_html_browser_20261014.py --selftest
          gh api repos/yuki746289/product_kabu_actions/actions/runs/38528887409 --jq '.conclusion + " " + .head_sha' | \
            grep -Fx 'success 8435ec20b812fb38571c22b8422eae6327f005d5'
          gh api repos/yuki746289/product_kabu_actions/actions/runs/38524279221 --jq '.conclusion + " " + .head_sha' | \
            grep -Fx 'success b596d5709e0a2e7905651f18200c83d72bee99ae'

  new_full_canary:
    name: Fully new semantic->OR->29CSV numeric (${{ matrix.dataset }})
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - dataset: "technology"
            dir: "225_group_all_period/technology"
            sourceRun: 0
            sourceArtifact: ""
    env:
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-checkout immutable original Private full 29 CSV and actual new producers
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
            /preview/kabu/analysis/${{ matrix.dir }}/*.csv
          persist-credentials: false
      - name: Non-negotiable public runner / pinned Private SHA and zero private workflow gates
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "yuki746289/product_kabu_actions"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Forbidden Private Actions"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse saved SHA-pinned original exclusion source only
        if: ${{ matrix.sourceRun != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sourceArtifact }}
          run-id: ${{ matrix.sourceRun }}
          github-token: ${{ github.token }}
          path: input_artifact
      - name: Reuse certified Phase38 exact saved 29 CSV original SHA ledger
        uses: actions/download-artifact@v4
        with:
          name: p2-phase38-${{ matrix.dataset }}-saved-29csv-inventory
          run-id: 38524279221
          github-token: ${{ github.token }}
          path: prior38
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install exact original canonical producer requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Reproduce only fresh staged new producer output and independently compare 29 original CSVs
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="core/preview/kabu/analysis/${{ matrix.dir }}/signal_level_features.csv"
          if [ "${{ matrix.sourceRun }}" != "0" ]; then
            SOURCE="$(find input_artifact -name features.csv -type f -print -quit)"
            test -n "$SOURCE"
          fi
          test -f prior38/audit.json
          python scripts/p2_full_newproducer_29csv_20261014.py \
            --dataset "$DATASET" \
            --core core --reference "core/preview/kabu/analysis/${{ matrix.dir }}" \
            --source "$SOURCE" --phase38 prior38/audit.json \
            --report "$RUNNER_TEMP/report.json"
      - name: Independently enforce all 29 new producer parity certificates and no source mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"report.json").read_text(encoding="utf-8"))
          assert d["status"]=="PASS_FULL_29_CSV_NEW_PRODUCER_NUMERIC_PARITY"
          assert d["dataset"]==os.environ["DATASET"]
          assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert d["new_producer_executed"]==["semantic","or","normalized"]
          assert d["csv_count"]==len(d["files"])==29
          assert d["all_29_csv_rows_order_columns_numeric_equal"] is True
          assert d["mismatches"]==[]
          assert all(x["numerically_equal"] is True for x in d["files"].values())
          assert d["original_artifact_overwritten"] is False
          assert d["original_csv_or_html_modified"] is False
          assert d["production_p2_changed"] is False and d["release_ready"] is False
          print("PASS_FULL_NEW_PRODUCER_29_CSV",d["dataset"])
          PY
      - name: Confirm original Private tracked source and output files remain unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Upload only non-sensitive SHA, row counts and parity JSON
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: full-p2-${{ matrix.dataset }}-29csv-numeric
          path: ${{ runner.temp }}/report.json
          retention-days: 30
          if-no-files-found: error

