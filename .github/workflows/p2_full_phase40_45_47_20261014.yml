        with:
          name: full-p2-${{ matrix.dataset }}-html-browser
          path: ${{ runner.temp }}/report.json
          retention-days: 30
          if-no-files-found: error

  phase47_release_hold:
    name: Independent full-coverage Phase47 final gate excluding Nikkei46, NO DEPLOY
    needs: [preflight, new_full_canary, new_full_remaining, html_full_qa]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch actual completed new numerical and HTML proof artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: full-p2-*
          path: evidence
      - name: Require exact eight dataset full producer and Chromium proofs, record Phase46 deferral and 225 blocker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          ds=("technology","financials","consumer_goods","materials","capital_goods_others",
              "transportation_utilities","exclude_capital_goods_transportation_utilities",
              "exclude_transportation_utilities")
          root=Path("evidence")
          reports={}
          for dataset in ds:
              for typ in ("29csv-numeric","html-browser"):
                  p=root/("full-p2-"+dataset+"-"+typ)/"report.json"
                  if p.exists():reports[dataset,typ]=json.loads(p.read_text(encoding="utf-8"))
          complete=len(reports)==len(ds)*2
          numeric=all(reports.get((d,"29csv-numeric"),{}).get("status")==
              "PASS_FULL_29_CSV_NEW_PRODUCER_NUMERIC_PARITY" for d in ds)
          html=all(reports.get((d,"html-browser"),{}).get("status")==
              "PASS_FULL_ORIGINAL_HTML_LINK_SCAN_AND_BROWSER_SMOKE" for d in ds)
          # The existing all225 original 29-CSV authoritative reference is
          # absent, so its full new numerical equivalence is NOT certified.
          # Phase46 exact 890-row Nikkei is explicitly DEFERRED by user.
          source225_only=True
          final={
              "schema":1,"status":"RESEARCH_NO_GO_UNCERTIFIED_ALL225_REFERENCE",
              "phase":"47","full_numeric_dataset_count":sum(
                 reports.get((d,"29csv-numeric"),{}).get("status")==
                 "PASS_FULL_29_CSV_NEW_PRODUCER_NUMERIC_PARITY" for d in ds),
              "all_saved_html_browser_dataset_count":sum(
                 reports.get((d,"html-browser"),{}).get("status")==
                 "PASS_FULL_ORIGINAL_HTML_LINK_SCAN_AND_BROWSER_SMOKE" for d in ds),
              "total_expected_evidence":len(ds)*2,"actual_evidence":len(reports),
              "all_eight_phase40_43_complete":complete and numeric,
              "html_full_link_and_representative_browser_complete":html,
              "all225_input_previously_certified":source225_only,
              "all225_new29_numeric_reference_certified":False,
              "nikkei_phase46":"DEFERRED_BY_USER",
              "phase48_executed":False,"release_ready":False,
              "pr62_merge_permitted":False,"production_p2_v12_changed":False,
              "artifact_released":False,
              "unresolved":["all225 full numerical reference and output producer",
                            "any missing full 29CSV / HTML independent parity reports",
                            "full UI behavior beyond representative browser smoke"],
          }
          out=Path("final.json")
          out.write_text(json.dumps(final,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(final,ensure_ascii=False))
          PY
      - name: Upload explicit phase47 independent limited certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-p2-phase47-final-no-go
          path: final.json
          retention-days: 30
          if-no-files-found: warn
      - name: Report final no-go and blocked subset to GitHub run summary
        if: always()
        run: |
          echo "Full research audit attempted. Phase46 excluded by user; Phase48 never included." >> "$GITHUB_STEP_SUMMARY"
          echo "No merger/deployment. Reference-verified full 29 CSV numeric proof for all225 is not certified." >> "$GITHUB_STEP_SUMMARY"
