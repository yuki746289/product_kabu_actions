          test -z "$(git -C core diff --cached --name-only)"
      - name: Upload only compact numerical metadata JSON
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase30-${{ matrix.dataset }}-start-${{ matrix.start }}
          path: ${{ runner.temp }}/audit.json
          retention-days: 14
          if-no-files-found: error

  final_gate:
    name: Exactly eight complete disjoint 10476-row pairwise certifications
    needs: [selftest, canary, remaining]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse final PASS if any shard failed or was skipped
        env:
          A: ${{ needs.selftest.result }}
          B: ${{ needs.canary.result }}
          C: ${{ needs.remaining.result }}
        run: |
          set -euo pipefail
          test "$A" = success && test "$B" = success && test "$C" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: p2-phase30-*-start-*
          path: evidence
      - name: Confirm SHA, completeness, no source overlap and exact old pair universe
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          ds=("technology","financials","consumer_goods","materials",
              "capital_goods_others","transportation_utilities",
              "exclude_capital_goods_transportation_utilities",
              "exclude_transportation_utilities")
          root=Path("evidence")
          expected={"p2-phase30-"+d+"-start-"+str(s) for d in ds for s in (0,4,8,12)}
          actual={p.name for p in root.iterdir() if p.is_dir()}
          assert expected==actual,(len(actual),len(expected),expected-actual,actual-expected)
          for name in ds:
              counts=0; source=None; complete=None; pair_families=0
              for start in (0,4,8,12):
                  p=root/("p2-phase30-"+name+"-start-"+str(start))/"audit.json"
                  j=json.loads(p.read_text(encoding="utf-8"))
                  assert j["status"]=="PASS_PHASE30_NEW_PAIRWISE_NONOVERLAP_SHARD"
                  assert j["dataset"]==name and j["feature_first_start"]==start
                  assert j["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
                  assert j["numerical_errors"]==[] and j["saved_full_reference_rows"]==10476
                  assert source is None or source==j["source_sha256"]
                  assert complete is None or complete==j["original_full_pair_sha256"]
                  source=j["source_sha256"]; complete=j["original_full_pair_sha256"]
                  counts+=j["new_subset_pair_rows"]; pair_families+=j["tested_feature_pairs"]
              previously=1800 if name=="transportation_utilities" else 0
              assert counts+previously==10476,(name,counts,previously)
              expected_families=120-15 if previously else 120
              assert pair_families==expected_families,(name,pair_families)
              print("PASS_PHASE30_OLD_PAIRWISE_UNIVERSE",name,counts,previously)
          print("PASS_PHASE30_EIGHT_DATASETS_FULL_NEW_PAIRWISE_NUMERIC_PARITY_ONLY")
          PY
      - name: Clearly separate pairwise parity from outstanding semantic/OR outputs
        run: |
          echo "New producer pairwise all feature pairs certified; Phase26 prior 1,800 transport pair rows reused." >> "$GITHUB_STEP_SUMMARY"
          echo "Uncertified: full triple, combination, OR, 29 CSV, HTML, all_225 adapter and Nikkei 890 original." >> "$GITHUB_STEP_SUMMARY"
          echo "No Production P2, historical saved data/artifact, main, release or deployment changes." >> "$GITHUB_STEP_SUMMARY"
