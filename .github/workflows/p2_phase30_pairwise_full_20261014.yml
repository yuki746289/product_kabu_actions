# Created: 2026-10-14T12:35:00+09:00
# Phase30 independent full pairwise parity with nonoverlapping feature-first shards.
# Existing Phase26 transport first-six-feature 1,800 pair rows are NEVER recalculated.
# Fail fast at first failed shard; no full semantic/OR/release/HTML generation.
name: P2 Phase30 full pairwise disjoint new-producer chain
on:
  push:
    branches: [automation/p2-common-postextract-20261012]
    paths:
      - '.github/workflows/p2_phase30_pairwise_full_20261014.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-phase30-new-pairwise-full-20261014
  cancel-in-progress: false
env:
  CORE_SHA: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  selftest:
    name: Require successful Phase29 and exact fixed prior SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assert Phase29 source audit success and Phase30 shard contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          python -m py_compile scripts/p2_common_phase30_full_pairwise_shard_20261014.py
          python scripts/p2_common_phase30_full_pairwise_shard_20261014.py --selftest
          gh api repos/yuki746289/product_kabu_actions/actions/runs/38500718243 --jq '.conclusion + " " + .head_sha' | \
            grep -Fx 'success e5fa2f8dc94529691118700ea36494b6ddb8f81c'

  canary:
    name: Phase30 new pairwise (${{ matrix.dataset }}, first=${{ matrix.start }})
    needs: selftest
    if: ${{ needs.selftest.result == 'success' }}
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        include:
          - dataset: "technology"
            start: 12
            dir: "225_group_all_period/technology"
            sourceRun: 0
            sourceArtifact: ""
            proof4: "p2-common-exact-six-group-identities"
            proof4File: "group.json"
            priorRun: 38500718243
            priorArtifact: "p2-phase29-technology-monthly-walkforward"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DATASET: ${{ matrix.dataset }}
      START: '${{ matrix.start }}'
    steps:
      - uses: actions/checkout@v4
      - name: Sparse immutable Private code and exact old pair reference
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
            /preview/kabu/analysis/${{ matrix.dir }}/signal_level_features.csv
            /preview/kabu/analysis/${{ matrix.dir }}/all_pairwise_combinations.csv
          persist-credentials: false
      - name: Enforce public-only architecture, pinned private SHA and no private workflows
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Private workflows forbidden"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse certified original exclusion features, never regenerate
        if: ${{ matrix.sourceRun != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sourceArtifact }}
          run-id: ${{ matrix.sourceRun }}
          github-token: ${{ github.token }}
          path: original_source
      - name: Reuse immutable Phase4 original dataset source identity
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.proof4 }}
          run-id: 38239501315
          github-token: ${{ github.token }}
          path: proof4
      - name: Reuse successful Phase29 or previously certified Phase26 pairwise proof
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.priorArtifact }}
          run-id: ${{ matrix.priorRun }}
          github-token: ${{ github.token }}
          path: prior_proof
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install pinned original requirements
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: New disjoint original producer pairwise shard numeric parity
        run: |
          set -euo pipefail
          test -f "proof4/${{ matrix.proof4File }}"
          test -f prior_proof/report.json
          python scripts/p2_common_phase30_full_pairwise_shard_20261014.py \
            --core core --dataset "$DATASET" --start "$START" \
            --reference "core/preview/kabu/analysis/${{ matrix.dir }}" \
            --original-source original_source \
            --proof4 "proof4/${{ matrix.proof4File }}" \
            --previous prior_proof/report.json \
            --stage "core/build/p2_phase30_$GITHUB_RUN_ID/$DATASET/$START" \
            --report "$RUNNER_TEMP/audit.json"
      - name: Independent new pairwise scoped SHA/row/value contract check
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"audit.json").read_text(encoding="utf-8"))
          assert d["status"]=="PASS_PHASE30_NEW_PAIRWISE_NONOVERLAP_SHARD"
          assert d["dataset"]==os.environ["DATASET"]
          assert d["feature_first_start"]==int(os.environ["START"])
          assert d["saved_full_reference_rows"]==10476
          assert d["tested_feature_pairs"]>0 and d["new_subset_pair_rows"]>0
          assert d["new_subset_pair_rows"]==d["old_subset_pair_rows"]
          assert d["numerical_errors"]==[]
          assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert d["certified_prior_pairwise_recomputed"] is False
          for key in ("previous_artifacts_recalculated","full_semantic_recalculated",
                      "full_or_recalculated","historical_signals_recomputed",
                      "html_generated","production_changed","release_ready"):
              assert d[key] is False,key
          print("PASS_PHASE30_INDEPENDENT_PAIRWISE_SHARD",d["dataset"],
                d["feature_first_start"],d["new_subset_pair_rows"])
          PY
      - name: Assert no original tracked Private source modification
        if: always()
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Upload only compact numerical metadata JSON
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase30-${{ matrix.dataset }}-start-${{ matrix.start }}
          path: ${{ runner.temp }}/audit.json
          retention-days: 14
          if-no-files-found: error


