# Created: 2026-10-10 JST
# Read-only P2 OR summary recreation. Never re-run OR analysis or change private artifacts.
name: P2 OR summary saved CSV byte fidelity

on:
  push:
    branches: [main]
    paths: ['.github/workflows/p2_html_or_summary_saved_csv_20261010.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: p2-or-summary-saved-csv-20261010
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CORE_SHA: b3c0d34e9404d2e02f97cc2629191fe856adacdb
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout Public Actions
        uses: actions/checkout@v4
      - name: Checkout pinned private research data read-only
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: b3c0d34e9404d2e02f97cc2629191fe856adacdb
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/
            /requirements.txt
            /docs/ACTIONS_MIGRATION.md
            /preview/kabu/analysis/225_group_all_period/technology/or_pairwise_all.csv
            /preview/kabu/analysis/225_group_all_period/technology/or_pairwise_unique.csv
            /preview/kabu/analysis/225_group_all_period/technology/or_triple_all.csv
            /preview/kabu/analysis/225_group_all_period/technology/or_triple_unique.csv
            /preview/kabu/analysis/225_group_all_period/technology/or_candidate_summary.csv
            /preview/kabu/analysis/225_group_all_period/technology/signal_level_features.csv
            /preview/kabu/analysis/225_group_all_period/technology/analysis/or_combinations.html
            /preview/kabu/analysis/225_group_all_period/technology/analysis/or_details/
            /preview/kabu/analysis/225_group_all_period/technology/analysis/or_charts/
          persist-credentials: false
      - name: Enforce public-only SHA-pinned architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "yuki746289/product_kabu_actions"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          if git -C core ls-tree -r --name-only HEAD | grep -E '^\.github/workflows/.*\.ya?ml$'; then exit 1; fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install validated analysis read libraries
        working-directory: core
        run: python -m pip install -r requirements.txt
      - name: Unit-test saved CSV summary selection and HTML extractor
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_p2_template*.py' -v
          python -m unittest discover -s tests -p 'test_p2_or_render_link_diff_20261010.py' -v
          python -m unittest discover -s tests -p 'test_p2_or_summary_saved_csv_20261010.py' -v
          python scripts/migrate_p2_html_templates_20261009.py --repo-root . --output-root build/or_summary_trial/extracted > /dev/null
          python scripts/prepare_p2_template_stage_20261009.py --repo-root . --extraction build/or_summary_trial/extracted --destination build/or_summary_trial/isolated
      - name: Verify OR summary HTML against historical exact bytes
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_p2_or_summary_saved_csv_20261010.py --source-root preview/kabu/analysis/225_group_all_period/technology --renderer-root build/or_summary_trial/isolated --output-dir build/or_summary_trial/technology
      - name: Verify no tracked file modified
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Save audit JSON only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-or-summary-saved-csv-audit
          retention-days: 7
          if-no-files-found: warn
          path: core/build/or_summary_trial/technology/or_summary_audit.json
