name: P2 profitability detail regenerate 20261007

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/p2_profitability_regenerate_trigger'

permissions:
  contents: read

env:
  CORE_REPO: yuki746289/product_kabu
  CORE_BRANCH: research/p2-nikkei-complete-baseline-20260915
  CORE_SHA: 96bc4360bd3ecc19ca9a16846828a0b2f184c285

jobs:
  regenerate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ env.CORE_BRANCH }}
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 0
          persist-credentials: true
          sparse-checkout: |
            scripts
            requirements.txt
            config
            preview/kabu/analysis/225_group_all_period/*/signal_level_features.csv
            preview/kabu/analysis/225_group_all_period/*/advantage_single_candidates.csv
            preview/kabu/analysis/225_group_all_period/*/advantage_pairwise_candidates.csv
            preview/kabu/analysis/225_group_all_period/*/advantage_triple_candidates.csv
            preview/kabu/analysis/225_group_all_period/*/analysis/high_entry_charts
            preview/kabu/analysis/225_exclusion_all_period/*/advantage_single_candidates.csv
            preview/kabu/analysis/225_exclusion_all_period/*/advantage_pairwise_candidates.csv
            preview/kabu/analysis/225_exclusion_all_period/*/advantage_triple_candidates.csv
            preview/kabu/analysis/225_exclusion_all_period/*/analysis/high_entry_charts
          sparse-checkout-cone-mode: false

      - name: Verify source SHA
        shell: pwsh
        run: |
          $actual=(git -C core rev-parse HEAD).Trim()
          if ($actual -ne $env:CORE_SHA) { throw "core SHA mismatch: $actual" }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet -r core/requirements.txt

      - name: Regenerate detail pages only
        shell: pwsh
        run: |
          python core/scripts/regenerate_p2_profitability_detail_pages.py --site-root core/preview/kabu

      - name: Verify changed paths and content
        shell: pwsh
        run: |
          $changed=@(git -C core status --porcelain)
          Write-Host "Changed files: $($changed.Count)"
          if ($changed.Count -ne 904) {
            $changed | Select-Object -First 30 | ForEach-Object { Write-Host $_ }
            throw "Expected exactly 904 modified detail pages"
          }
          $bad=@($changed | Where-Object {
            $_ -notmatch 'preview/kabu/analysis/(225_group_all_period|225_exclusion_all_period)/.+/analysis/high_entry_charts/h-[0-9a-f]+\.html$'
          })
          if ($bad.Count) {
            $bad | Select-Object -First 30 | ForEach-Object { Write-Host $_ }
            throw "Non-detail paths were modified"
          }

          $pages=@(
            Get-ChildItem core/preview/kabu/analysis/225_group_all_period -Recurse -Filter 'h-*.html' |
              Where-Object { $_.FullName -match 'analysis\\high_entry_charts' }
          ) + @(
            Get-ChildItem core/preview/kabu/analysis/225_exclusion_all_period -Recurse -Filter 'h-*.html' |
              Where-Object { $_.FullName -match 'analysis\\high_entry_charts' }
          )
          if ($pages.Count -ne 904) { throw "Expected 904 checked-out detail pages, got $($pages.Count)" }

          foreach($p in $pages) {
            $txt=Get-Content -Raw -LiteralPath $p.FullName
            foreach($needle in @('損益分布と期待値','平均損益幅差','Profit Factor','エントリー損益分布','const PROFITABILITY=')) {
              if(-not $txt.Contains($needle)) { throw "Missing $needle in $($p.FullName)" }
            }
          }

          $sample='core/preview/kabu/analysis/225_exclusion_all_period/exclude_transportation_utilities/analysis/high_entry_charts/h-a0a5ecdec45df4a9.html'
          if(-not (Test-Path $sample)) { throw "Reference sample page missing" }
          Write-Host "Reference sample updated: $sample"

      - name: Commit generated detail pages
        shell: pwsh
        run: |
          git -C core config user.name "github-actions[bot]"
          git -C core config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C core add preview/kabu/analysis/225_group_all_period preview/kabu/analysis/225_exclusion_all_period
          git -C core commit -m "feat: add profitability analysis to high-entry detail pages"
          git -C core push origin HEAD:${{ env.CORE_BRANCH }}
