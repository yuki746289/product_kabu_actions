# Created: 2026-10-13 JST
# Bounded new semantic producer subset on immutable saved 14848-row transportation data.
# Produces only 4 fresh temporary files, compares to original saved reference.
name: P2 common Phase20 bounded new semantic output parity
on:
  push:
    branches: [automation/p2-common-postextract-20261012]
    paths:
      - '.github/workflows/p2_common_phase20_semantic_subset_20261013.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-common-phase20-bounded-semantic-20261013
  cancel-in-progress: false
env:
  CORE_SHA: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  synthetic:
    name: Compile QA code and assert bounded output contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Guard source SHA and checked producer scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          python -m py_compile scripts/p2_common_phase20_new_semantic_bounded_20261013.py
          python scripts/p2_common_phase20_new_semantic_bounded_20261013.py --selftest

  bounded_producer:
    name: Calculate only 4 new semantic CSVs and compare saved original numeric data
    needs: synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Sparse Private pinned source and existing common producer modules
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
            /preview/kabu/analysis/225_group_all_period/transportation_utilities/signal_level_features.csv
            /preview/kabu/analysis/225_group_all_period/transportation_utilities/all_single_categories.csv
            /preview/kabu/analysis/225_group_all_period/transportation_utilities/representative_single_categories.csv
            /preview/kabu/analysis/225_group_all_period/transportation_utilities/candidate_registry.csv
            /preview/kabu/analysis/225_group_all_period/transportation_utilities/parameter_plateau.csv
            /preview/kabu/analysis/225_group_all_period/transportation_utilities/semantic_status.json
          persist-credentials: false
      - name: Mandatory Public runner private source SHA and architecture preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "yuki746289/product_kabu_actions"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Private Actions workflow detected"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
          test -f core/preview/kabu/analysis/225_group_all_period/transportation_utilities/signal_level_features.csv
      - name: Reuse prior immutable original transportation source identity evidence
        uses: actions/download-artifact@v4
        with:
          name: p2-common-exact-six-group-identities
          run-id: 38239501315
          github-token: ${{ github.token }}
          path: source_pin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse original Private Python dependency constraints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Execute exact bounded new common semantic producer inner functions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/p2_common_phase20_new_semantic_bounded_20261013.py \
            --core core \
            --reference core/preview/kabu/analysis/225_group_all_period/transportation_utilities \
            --proof source_pin/group.json \
            --staging "core/build/p2_phase20_$GITHUB_RUN_ID/semantic" \
            --report "$RUNNER_TEMP/p2_phase20/report.json"
          echo "New common semantic INNER subset was computed from pinned saved signals." >> "$GITHUB_STEP_SUMMARY"
          echo "Four files compared to immutable original; full semantic, OR, P2 and HTML were NOT rerun." >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce no original source or tracked output mutated
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Publish compact Phase20 diagnostic JSON only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-common-phase20-bounded-transport-semantic-numeric-evidence
          path: ${{ runner.temp }}/p2_phase20/report.json
          retention-days: 14
          if-no-files-found: warn

  final_gate:
    name: Limit certification to four fresh semantic CSVs only
    needs: [synthetic, bounded_producer]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require synthetic and new producer numeric QA success
        shell: bash
        env:
          TEST: ${{ needs.synthetic.result }}
          NEW: ${{ needs.bounded_producer.result }}
        run: |
          set -euo pipefail
          echo "Private source SHA: $CORE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Synthetic guard: $TEST, new bounded common semantic: $NEW" >> "$GITHUB_STEP_SUMMARY"
          if test "$TEST" != success || test "$NEW" != success; then
            echo "::error::New semantic numeric parity not established; stop without OR run"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: p2-common-phase20-bounded-transport-semantic-numeric-evidence
          path: evidence
      - name: Verify four new-output certified reports, not full semantic QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("evidence/report.json").read_text(encoding="utf-8"))
          assert result["status"]=="PASS_PHASE20_NEW_COMMON_SEMANTIC_SUBSET_NUMERIC_PARITY"
          assert result["dataset"]=="transportation_utilities"
          assert result["private_code_and_data_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert result["source_rows"]==14848 and result["source_tickers"]==20
          assert result["expected_csvs"]==result["csvs_independently_numeric_equal"]==4
          assert not result["mismatches"]
          assert result["previous_successful_artifacts_reexecuted"] is False
          assert result["full_semantic_recomputed"] is False
          assert result["or_recomputed"] is False
          assert result["p2_signals_recomputed"] is False
          assert result["release_ready"] is False
          print("PASS_PHASE20_FOUR_NEW_SEMANTIC_CSV_NUMERIC_PARITY_ONLY")
          PY
          echo "Phase20 PASS for 4 bounded NEW semantic files ONLY. Full semantic/OR/HTML still outstanding." >> "$GITHUB_STEP_SUMMARY"
