name: P2 Stage B boosting model comparison

on:
  push:
    branches: [research/p2-stage-b-boosting-20260912]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        model: [xgboost, lightgbm, catboost]
        variant: [b1, b1_compact, b1_price, b1_all_path]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: research/p2-hypotheses-20260911
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        env:
          MODEL: ${{ matrix.model }}
        run: |
          python -m pip install pandas numpy scikit-learn tabulate
          case "$MODEL" in
            xgboost) python -m pip install xgboost ;;
            lightgbm) python -m pip install lightgbm ;;
            catboost) python -m pip install catboost ;;
          esac
      - name: Download B3 aggregate feature matrix
        uses: actions/download-artifact@v4
        with:
          name: p2-stage-b-b3-aggregate
          path: core/data/diagnostics/p2_stage_b/boosting/input
          repository: yuki746289/product_kabu_actions
          run-id: 34671952644
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run annual walk-forward
        working-directory: core
        run: |
          python scripts/run_p2_stage_b_boosting_walkforward.py \
            --features data/diagnostics/p2_stage_b/boosting/input/features.csv \
            --output-dir data/diagnostics/p2_stage_b/boosting/${{ matrix.model }}_${{ matrix.variant }} \
            --model ${{ matrix.model }} \
            --variant ${{ matrix.variant }}
      - name: Verify result
        working-directory: core
        env:
          KEY: ${{ matrix.model }}_${{ matrix.variant }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('data/diagnostics/p2_stage_b/boosting')/os.environ['KEY']
          s=json.loads((p/'status.json').read_text())
          assert s['overall_pass'] is True, s
          assert s['causal_violations'] == 0, s
          assert (p/'summary.csv').exists()
          print(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2-stage-b-boosting-${{ matrix.model }}-${{ matrix.variant }}
          path: core/data/diagnostics/p2_stage_b/boosting/${{ matrix.model }}_${{ matrix.variant }}
          retention-days: 7

  compare:
    needs: models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas tabulate
      - uses: actions/download-artifact@v4
        with:
          pattern: p2-stage-b-boosting-*
          path: results
          merge-multiple: false
      - name: Build comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, pandas as pd
          frames=[pd.read_csv(p) for p in Path('results').glob('**/summary.csv')]
          x=pd.concat(frames,ignore_index=True)
          Path('final').mkdir(exist_ok=True)
          x.to_csv('final/comparison.csv',index=False)
          r=x.loc[x.target_retention_pct.eq(60)].copy()
          long=r.loc[r.direction.eq('long')].sort_values(['pooled_win_uplift_20d_pp','pooled_win_uplift_10d_pp','mean_auc'],ascending=False)
          short=r.loc[r.direction.eq('short')].sort_values(['pooled_win_uplift_20d_pp','pooled_win_uplift_10d_pp','mean_auc'],ascending=False)
          long.to_csv('final/rank_long_retention60.csv',index=False)
          short.to_csv('final/rank_short_retention60.csv',index=False)
          cols=['model','variant','direction','mean_auc','pooled_baseline_n','pooled_kept_n','pooled_retention_pct','pooled_baseline_win_pct_5d','pooled_kept_win_pct_5d','pooled_win_uplift_5d_pp','pooled_baseline_win_pct_10d','pooled_kept_win_pct_10d','pooled_win_uplift_10d_pp','pooled_baseline_win_pct_20d','pooled_kept_win_pct_20d','pooled_win_uplift_20d_pp','positive_win_year_share_20d_pct']
          report='# Boosting model comparison - retention ~60%\n\n## Long\n\n'+long[cols].to_markdown(index=False)+'\n\n## Short\n\n'+short[cols].to_markdown(index=False)+'\n'
          Path('final/report.md').write_text(report,encoding='utf-8')
          Path('final/status.json').write_text(json.dumps({'models':sorted(x.model.unique().tolist()),'variants':sorted(x.variant.unique().tolist()),'rows':len(x),'overall_pass':len(x)==96},indent=2)+'\n')
          print(long[cols].to_string(index=False)); print(short[cols].to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2-stage-b-boosting-final
          path: final
          retention-days: 7
