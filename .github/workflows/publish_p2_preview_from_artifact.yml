name: Publish P2 preview from completed artifact

on:
  push:
    branches:
      - research/p2-nikkei-complete-baseline-20260915
    paths:
      - .github/workflows/publish_p2_preview_from_artifact.yml

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download completed P2 artifact
        uses: actions/download-artifact@v4
        with:
          name: p2-nikkei-complete-baseline-20260915
          path: generated
          github-token: ${{ github.token }}
          repository: yuki746289/product_kabu_actions
          run-id: 35813159518

      - name: Checkout product_kabu latest research branch
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: research/p2-nikkei-complete-baseline-20260915
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight report dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Regenerate OR HTML only from completed artifact
        working-directory: core
        run: |
          set -euo pipefail
          OUT="data/diagnostics/p2_stage_b/nikkei_complete_baseline_20260915"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp -a ../generated/. "$OUT/"
          python scripts/analyze_p2_or_combinations.py

          grep -q 'or-head-scroll' "$OUT/analysis/or_pairwise_all.html"
          grep -q 'or-body-scroll' "$OUT/analysis/or_pairwise_all.html"
          grep -q 'hlBottom' "$OUT/analysis/or_pairwise_all.html"
          grep -q 'or-head-scroll' "$OUT/analysis/or_triple_all.html"
          grep -q 'or-body-scroll' "$OUT/analysis/or_triple_all.html"

      - name: Publish static HTML preview
        working-directory: core
        run: |
          set -euo pipefail
          OUT="data/diagnostics/p2_stage_b/nikkei_complete_baseline_20260915"
          PREVIEW="preview/kabu"

          git fetch origin research/p2-nikkei-complete-baseline-20260915
          git reset --hard origin/research/p2-nikkei-complete-baseline-20260915

          rm -rf "$PREVIEW"
          mkdir -p "$PREVIEW"
          while IFS= read -r -d '' file; do
            rel="${file#$OUT/}"
            mkdir -p "$PREVIEW/$(dirname "$rel")"
            cp "$file" "$PREVIEW/$rel"
          done < <(find "$OUT" -type f -name '*.html' -print0)

          cp "$OUT/report.html" "$PREVIEW/index.html"
          printf 'Generated from completed artifact with latest OR UI\nSource run: 35813159518\n' > "$PREVIEW/GENERATED.txt"

          test -f "$PREVIEW/report.html"
          test -f "$PREVIEW/analysis/or_combinations.html"
          test -f "$PREVIEW/analysis/or_pairwise_all.html"
          test -f "$PREVIEW/analysis/or_triple_all.html"
          grep -q 'or-head-scroll' "$PREVIEW/analysis/or_pairwise_all.html"
          grep -q 'or-body-scroll' "$PREVIEW/analysis/or_pairwise_all.html"
          grep -q '横へ →' "$PREVIEW/analysis/or_pairwise_all.html"
          grep -q 'or-head-scroll' "$PREVIEW/analysis/or_triple_all.html"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A preview/kabu
          if git diff --cached --quiet; then
            echo "Static preview is already up to date."
          else
            git commit -m "report: publish split-scroll P2 OR preview"
            git push origin HEAD:research/p2-nikkei-complete-baseline-20260915
          fi
