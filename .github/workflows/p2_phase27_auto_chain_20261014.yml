# Created: 2026-10-14T10:27:00+09:00
# First bounded P2 auto-chain. Only future unverified candidate positions 3..8.
# Prior successful runs/artifacts NEVER re-executed or regenerated.
# Fail closed on mismatch, unavailable artifact, source SHA drift or any job failure.
# No Private workflow, production, release, PR merge, or deployment actions.
name: P2 Phase27 new-candidate automatic gated chain
on:
  push:
    branches: [automation/p2-common-postextract-20261012]
    paths:
      - '.github/workflows/p2_phase27_auto_chain_20261014.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-phase27-fixed-candidate-chain-20261014
  cancel-in-progress: false
env:
  CORE_SHA: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  selftest:
    name: Check fixed manifest, deterministic non-overlap and script syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Guard runner and bounded novel-slice contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          python -m py_compile scripts/p2_common_phase27_candidate_chain_20261014.py
          python scripts/p2_common_phase27_candidate_chain_20261014.py --selftest

  canary:
    name: New candidate 3-5 parity (${{ matrix.dataset }})
    needs: selftest
    if: ${{ needs.selftest.result == 'success' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - dataset: "transportation_utilities"
            reference_dir: "225_group_all_period/transportation_utilities"
            source_run: 0
            source_artifact: ""
            proof4: "p2-common-exact-six-group-identities"
            proof4_file: "group.json"
            proof26_run: 38495878262
            proof26_artifact: "p2-common-phase26-transport-three-condition-rolling-candidate-evidence"
            proof26_file: "report.json"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DATASET: ${{ matrix.dataset }}
      OFFSET: '3'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout only fixed historical code and exact dataset reference CSVs
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
            /preview/kabu/analysis/${{ matrix.reference_dir }}/signal_level_features.csv
            /preview/kabu/analysis/${{ matrix.reference_dir }}/candidate_registry.csv
            /preview/kabu/analysis/${{ matrix.reference_dir }}/yearly_stability.csv
            /preview/kabu/analysis/${{ matrix.reference_dir }}/monthly_stability.csv
            /preview/kabu/analysis/${{ matrix.reference_dir }}/regime_stability.csv
            /preview/kabu/analysis/${{ matrix.reference_dir }}/rolling_3y_stability.csv
            /preview/kabu/analysis/${{ matrix.reference_dir }}/rolling_5y_stability.csv
            /preview/kabu/analysis/${{ matrix.reference_dir }}/monthly_candidate_stability_summary.csv
          persist-credentials: false
      - name: Mandatory architecture and private SHA preflight before calculations
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Private GitHub Actions workflows are forbidden"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse original saved exclusion features without regeneration
        if: ${{ matrix.source_run != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.source_artifact }}
          run-id: ${{ matrix.source_run }}
          github-token: ${{ github.token }}
          path: original_source
      - name: Reuse immutable original source identity proof
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.proof4 }}
          run-id: 38239501315
          github-token: ${{ github.token }}
          path: phase4
      - name: Reuse successful Phase26 numerical proof, never rerun
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.proof26_artifact }}
          run-id: ${{ matrix.proof26_run }}
          github-token: ${{ github.token }}
          path: phase26
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install canonical pinned requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Independently calculate only never-certified candidate conditions
        shell: bash
        run: |
          set -euo pipefail
          test -f "phase4/${{ matrix.proof4_file }}"
          test -f "phase26/${{ matrix.proof26_file }}"
          python scripts/p2_common_phase27_candidate_chain_20261014.py \
            --core core \
            --reference "core/preview/kabu/analysis/${{ matrix.reference_dir }}" \
            --source-root original_source \
            --dataset "$DATASET" \
            --offset "$OFFSET" \
            --proof4 "phase4/${{ matrix.proof4_file }}" \
            --proof26 "phase26/${{ matrix.proof26_file }}" \
            --stage "core/build/p2_phase27_$GITHUB_RUN_ID/canary_$DATASET" \
            --report "$RUNNER_TEMP/report.json"
      - name: Strict new-condition proof and provenance checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"report.json").read_text(encoding="utf-8"))
          assert d["status"]=="PASS_PHASE27_NEW_UNCERTIFIED_SINGLES_SIX_CSV"
          assert d["dataset"]==os.environ["DATASET"]
          assert d["candidate_offset"]==int(os.environ["OFFSET"])
          assert d["candidate_count"]==3 and len(d["selected_condition_hashes"])==3
          assert len(set(d["selected_condition_hashes"]))==3
          assert len(d["source_sha256"])==64
          assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert d["mismatches"]==[]
          assert set(d["checked_files"])=={
              "yearly_stability.csv", "monthly_stability.csv", "regime_stability.csv",
              "rolling_3y_stability.csv", "rolling_5y_stability.csv",
              "monthly_candidate_stability_summary.csv"}
          for s in d["checked_files"].values():
              assert 0 < s["old_subset_rows"] == s["new_subset_rows"] <= s["original_complete_rows"]
              assert s["columns"] > 2
          assert d["canonical_inner_functions_executed"] is True
          for k in ("previous_certified_conditions_recomputed","full_semantic_recalculated",
