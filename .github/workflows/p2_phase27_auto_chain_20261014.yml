          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Save only compact SHA-bound JSON evidence for new candidate batch
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase27-${{ matrix.dataset }}-offset-3
          path: ${{ runner.temp }}/report.json
          retention-days: 14
          if-no-files-found: error


