# Created: 2026-10-10 JST
# Approved scope: technology S:fan=CONVERGED, 1 detail + 1 chart. No deployment.
name: P2 S condition pair read-only byte audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2_condition_pair_pilot_20261010.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: p2-condition-s-pair-pilot-20261010
  cancel-in-progress: false

jobs:
  pilot:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci: approved S-condition pair pilot bootstrap' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CORE_SHA: c0c69be8e28ddfa5812c1bbe4ba3d33f432fbf02
      CORE_BRANCH: research/p2-nikkei-complete-baseline-20260915
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: scripts
    steps:
      - name: Checkout public Actions repository
        uses: actions/checkout@v4
      - name: Checkout immutable private core (S pilot inputs only)
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: c0c69be8e28ddfa5812c1bbe4ba3d33f432fbf02
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/
            /requirements.txt
            /docs/ACTIONS_MIGRATION.md
            /preview/kabu/analysis/225_group_all_period/technology/signal_level_features.csv
            /preview/kabu/analysis/225_group_all_period/technology/condition_detail_manifest.csv
            /preview/kabu/analysis/225_group_all_period/technology/conditions/s-a7c0898c14b3170f.html
            /preview/kabu/analysis/225_group_all_period/technology/conditions/charts/s-a7c0898c14b3170f.html
          persist-credentials: false
      - name: Verify Public-only architecture and pinned private SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "yuki746289/product_kabu_actions"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          if git -C core ls-tree -r --name-only HEAD | grep -E '^\.github/workflows/.*\.ya?ml$'; then
            echo "::error::Private repository contains forbidden workflow"
            exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install locked-range dependencies
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
      - name: Audit-gate synthetic unit tests
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_p2_condition_pair_byte_audit_20261010.py' -v
      - name: Prepare isolated legacy-template stage
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          python scripts/migrate_p2_html_templates_20261009.py --repo-root . --output-root build/s_pair_extract > /dev/null
          python scripts/prepare_p2_template_stage_20261009.py --repo-root . --extraction build/s_pair_extract --destination build/s_pair_stage > /dev/null
      - name: Generate only approved technology S detail and chart
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          python scripts/p2_html_build.py --repo-root . --site-root preview/kabu --stage-root build/s_pair_stage --dataset technology --family conditions --condition-id P2C-A7C0898C14B3 --output-dir build/s_pair_html
      - name: Compare exactly 2 pages with legacy HTML and SHA-256
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_p2_condition_pair_byte_audit_20261010.py --repo-root . --site-root preview/kabu --build-root build/s_pair_html --output-dir build/s_pair_audit --dataset technology --condition-key 'S:fan=CONVERGED'
      - name: Verify source and tracked outputs remain unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
          echo "Read-only source contract: PASS"
      - name: Upload mandatory successful pair audit JSON
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-s-condition-pair-audit
          path: core/build/s_pair_audit/p2_condition_pair_byte_audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload failure diagnostic if generated
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p2-s-condition-pair-failure-diagnostic
          path: |
            core/build/s_pair_audit/p2_condition_pair_byte_audit.json
            core/build/s_pair_html/build_manifest.json
            core/build/s_pair_html/unified_build_audit.json
          if-no-files-found: warn
          retention-days: 7
