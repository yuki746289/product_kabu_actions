            --core core \
            --reference "core/preview/kabu/analysis/225_exclusion_all_period/$DATASET" \
            --saved_source original_source \
            --proof4 phase4_proof/audit.json \
            --proof25 phase25_proof/audit.json \
            --stage "core/build/p2_phase26_$GITHUB_RUN_ID/$DATASET" \
            --report "$RUNNER_TEMP/audit.json"
      - name: Enforce original-source status, six file checks and zero numerical mismatches
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"audit.json").read_text(encoding="utf-8"))
          assert d["status"]=="PASS_PHASE26_EXCLUSIONS_SIX_CSV_BOUNDED_PARITY"
          assert d["dataset"]==os.environ["DATASET"]
          assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert d["selected_candidate_conditions"]==3 and d["mismatches"]==[]
          assert set(d["files"])=={"yearly_stability.csv","monthly_stability.csv",
              "regime_stability.csv","rolling_3y_stability.csv",
              "rolling_5y_stability.csv","monthly_candidate_stability_summary.csv"}
          for v in d["files"].values():
              assert 0<v["old_selected_rows"]==v["new_selected_rows"]<=v["old_full_rows"]
          assert d["canonical_inner_stability_rolling_candidate_functions_called"] is True
          for flag in ("full_semantic_recalculated","full_or_recalculated",
                       "previous_artifacts_recalculated","p2_signals_recomputed",
                       "html_generated","production_changed","release_ready"):
              assert d[flag] is False,flag
          print("PASS_PHASE26_EXCLUSION_SIX_CSV_LIMITED_PARITY",d["dataset"])
          PY
      - name: Confirm immutable Private tracked bytes unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Upload only compact numerical audit JSON
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-common-phase26-exclusion-six-csv-exclude_transportation_utilities
          path: ${{ runner.temp }}/audit.json
          retention-days: 14
          if-no-files-found: error

  final_gate:
    name: Verify both exclusion limited six-output numeric parity artifacts
    needs: [selftest, double, transport]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all three predecessor jobs succeed
        env:
          SELF: ${{ needs.selftest.result }}
          DOUBLE: ${{ needs.double.result }}
          TRANSPORT: ${{ needs.transport.result }}
        run: |
          set -euo pipefail
          test "$SELF" = success && test "$DOUBLE" = success && test "$TRANSPORT" = success
      - name: Fetch just this run's JSON audits
        uses: actions/download-artifact@v4
        with:
          pattern: p2-common-phase26-exclusion-six-csv-*
          path: evidence
      - name: Confirm two independent complete 6-file bounded audit contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          names={"exclude_transportation_utilities",
                 "exclude_capital_goods_transportation_utilities"}
          root=Path("evidence")
          found={p.name.removeprefix("p2-common-phase26-exclusion-six-csv-")
                 for p in root.iterdir() if p.is_dir()}
          assert found==names,(found,names)
          for name in sorted(names):
              d=json.loads((root/("p2-common-phase26-exclusion-six-csv-"+name)/"audit.json").read_text(encoding="utf-8"))
              assert d["status"]=="PASS_PHASE26_EXCLUSIONS_SIX_CSV_BOUNDED_PARITY"
              assert d["dataset"]==name and d["mismatches"]==[]
              assert len(d["files"])==6 and d["selected_candidate_conditions"]==3
              print("PASS",name,{k:v["new_selected_rows"] for k,v in d["files"].items()})
          print("PASS_PHASE26_TWO_EXCLUSIONS_SIX_CSV_BOUNDED_ONLY")
          PY
