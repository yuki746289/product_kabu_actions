# Created: 2026-10-08 JST
# Research-only: eight growth ranking HTML pages from existing semantic CSVs.
name: P2 225 eight growth rankings 20261008

on:
  push:
    branches: [main]
    paths:
      - '.github/p2_225_eight_growth_rankings_20261008_trigger'

permissions:
  contents: read
  actions: read

concurrency:
  group: p2-225-eight-growth-rankings
  cancel-in-progress: false

jobs:
  update_eight:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      CORE_SHA: 96f5882cda98606bb6572708dec39fd8618e50fb
      CORE_BRANCH: research/p2-nikkei-complete-baseline-20260915
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout public Actions repository
        uses: actions/checkout@v4
      - name: Checkout pinned private research branch
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 96f5882cda98606bb6572708dec39fd8618e50fb
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          persist-credentials: true
      - name: Verify immutability and Actions architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "${CORE_SHA}"
          test -z "$(git -C core status --porcelain)"
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "${CORE_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Check syntax and run tests before reading source data
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python -m py_compile scripts/refresh_p2_growth_from_csv.py scripts/refresh_p2_growth_all_datasets.py
          python -m unittest discover -s tests -p 'test_refresh_p2_growth_from_csv.py' -v
          python -m unittest discover -s tests -p 'test_refresh_p2_growth_all_datasets.py' -v
          python -m unittest discover -s tests -p 'test_p2_high_entry_growth_ranking.py' -v
      - name: Reuse eight completed semantic datasets, append growth only
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          for dataset in \
            technology \
            financials \
            consumer_goods \
            materials \
            capital_goods_others \
            transportation_utilities \
            exclude_transportation_utilities \
            exclude_capital_goods_transportation_utilities
          do
            echo "===== Existing dataset: $dataset ====="
            python scripts/refresh_p2_growth_all_datasets.py --dataset "$dataset"
          done
      - name: Verify eight pages, 30 links each, and unchanged original markup
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess,sys
          sys.path.insert(0,str(Path('scripts').resolve()))
          import refresh_p2_growth_all_datasets as datasets
          import refresh_p2_growth_from_csv as refresh
          roots = []
          for name,base in datasets.TARGETS.items():
              p = base/'analysis/high_entry_accuracy.html'
              old = subprocess.check_output(['git','show',f'HEAD:{p.as_posix()}']).decode('utf-8')
              current = p.read_text(encoding='utf-8')
              section = refresh.extract_growth(current)
              n, links = refresh.inspect_growth(section)
              assert n == 30 and links == 30, (name, n, links)
              assert refresh.ANCHOR not in old, name
              assert current.replace(section,'',1) == old, f'{name}: previous sections/layout altered'
              for token in ('product_kabu_favorites_v1','p2-growth-500','p2-growth-1000'):
                  assert token in current, (name,token)
              roots.append(p.parent.as_posix())
              print('PASS', name, 'rows=',n,'links=',links)
          names = [r[3:] for r in subprocess.check_output(
              ['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()]
          assert names
          for p in names:
              assert any(
                  p == root+'/high_entry_accuracy.html' or
                  (p.startswith(root+'/high_entry_charts/') and p.endswith('.html'))
                  for root in roots
              ), f'Unapproved path changed: {p}'
          print({'updated_datasets':len(roots),'modified_or_new_files':len(names),
                 'preserve_previous_sections':True})
          PY
          git diff --check
          git add \
            preview/kabu/analysis/225_group_all_period/*/analysis/high_entry_accuracy.html \
            preview/kabu/analysis/225_group_all_period/*/analysis/high_entry_charts \
            preview/kabu/analysis/225_exclusion_all_period/*/analysis/high_entry_accuracy.html \
            preview/kabu/analysis/225_exclusion_all_period/*/analysis/high_entry_charts
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
      - name: Commit research HTML after branch-head lease
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(git ls-remote origin "refs/heads/${CORE_BRANCH}" | cut -f1)"
          test "$CURRENT" = "$CORE_SHA" || {
            echo "Branch advanced. Refusing to overwrite changes."; exit 1;
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(research): append growth-priority to six group and two exclusion reports"
          git push origin "HEAD:refs/heads/${CORE_BRANCH}"
