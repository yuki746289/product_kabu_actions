name: P2 v12 target cases

on:
  push:
    paths:
      - ".github/workflows/p2_v12_targets.yml"
      - "trigger/p2_v12_targets.txt"

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private prototype
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: fix/p2-daily-anchor-pullback-cases
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: _core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _core/requirements.txt
      - run: pip install -r _core/requirements.txt
      - name: Run target-case checks
        working-directory: _core
        run: python scripts/diagnose_p2_v12_targets.py
