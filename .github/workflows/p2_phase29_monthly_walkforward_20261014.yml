# Created: 2026-10-14T12:05:00+09:00
# Seven datasets only. Transportation/utilities 4 CSVs Phase26 prior PASS, not rerun.
# Previous saved data/artifact/HTML signals immutable, PR Draft, no release/deploy.
name: P2 Phase29 monthly and walkforward seven dataset parity
on:
  push:
    branches: [automation/p2-common-postextract-20261012]
    paths:
      - '.github/workflows/p2_phase29_monthly_walkforward_20261014.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-phase29-monthly-walkforward-seven-20261014
  cancel-in-progress: false
env:
  CORE_SHA: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  selftest:
    name: Verify Phase28 exact overall success and immutable SHA + contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Phase28 success provenance, scoped contract and syntax
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          python -m py_compile scripts/p2_common_phase29_monthly_walkforward_20261014.py
          python scripts/p2_common_phase29_monthly_walkforward_20261014.py --selftest
          gh api repos/yuki746289/product_kabu_actions/actions/runs/38498978072 --jq '.conclusion + " " + .head_sha' | \
            grep -Fx 'success 08780f4874bb7d8788213329abd4acc01073fb3b'
  canary:
    name: Phase29 four new semantic CSVs (${{ matrix.dataset }})
    needs: selftest
    if: ${{ needs.selftest.result == 'success' }}
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - dataset: "technology"
            source_dir: "225_group_all_period/technology"
            source_run: 0
            source_artifact: ""
            proof4: "p2-common-exact-six-group-identities"
            proof4_file: "group.json"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout only Private fixed core and exact saved reference CSVs
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
            /preview/kabu/analysis/${{ matrix.source_dir }}/signal_level_features.csv
            /preview/kabu/analysis/${{ matrix.source_dir }}/monthly_baseline_performance.csv
            /preview/kabu/analysis/${{ matrix.source_dir }}/monthly_baseline_stability_summary.csv
            /preview/kabu/analysis/${{ matrix.source_dir }}/month_of_year_baseline_summary.csv
            /preview/kabu/analysis/${{ matrix.source_dir }}/walkforward_results.csv
          persist-credentials: false
      - name: Enforce Public-only Actions, immutable private SHA and no Private workflow
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Private workflow detected"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse original saved exclusion feature artifact, no extraction
        if: ${{ matrix.source_run != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.source_artifact }}
          run-id: ${{ matrix.source_run }}
          github-token: ${{ github.token }}
          path: original_source
      - name: Reuse fixed Phase4 original source SHA identity proof
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.proof4 }}
          run-id: 38239501315
          github-token: ${{ github.token }}
          path: proof4
      - name: Reuse Phase28 complete candidate numerical proof, never recalculate
        uses: actions/download-artifact@v4
        with:
          name: p2-phase28-${{ matrix.dataset }}-all-remaining-single-candidates
          run-id: 38498978072
          github-token: ${{ github.token }}
          path: proof28
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install pinned canonical requirements
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Compare exactly four new canonical monthly and walkforward calculations
        run: |
          set -euo pipefail
          test -f "proof4/${{ matrix.proof4_file }}"
          test -f proof28/summary.json
          python scripts/p2_common_phase29_monthly_walkforward_20261014.py \
            --core core \
            --dataset "$DATASET" \
            --reference "core/preview/kabu/analysis/${{ matrix.source_dir }}" \
            --source-root original_source \
            --proof4 "proof4/${{ matrix.proof4_file }}" \
            --proof28 proof28/summary.json \
            --stage "core/build/p2_phase29_$GITHUB_RUN_ID/$DATASET" \
            --report "$RUNNER_TEMP/report.json"
      - name: Fail-closed numerical equality and immutable source provenance gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"report.json").read_text(encoding="utf-8"))
          assert d["status"]=="PASS_PHASE29_NEW_MONTHLY_WALKFORWARD_FOUR_CSV"
          assert d["dataset"]==os.environ["DATASET"]
          assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert d["source_rows"]>0 and d["source_tickers"]>0
          assert d["mismatches"]==[] and len(d["files"])==4
          assert all(r["reference_rows"]==r["new_rows"]>0 and
                     len(r["reference_sha256"])==64 and len(r["new_sha256"])==64
                     for r in d["files"].values())
          assert d["new_canonical_inner_functions_executed"] is True
          for key in ("previous_artifacts_recalculated","source_signals_recomputed",
                      "full_semantic_or_computed","html_generated","production_changed",
                      "release_ready"):
              assert d[key] is False,key
          print("PASS_PHASE29_NEW_FOUR_CSV",d["dataset"])
          PY
      - name: Confirm Private original tracked bytes remain unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Upload JSON-only proof, never private data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase29-${{ matrix.dataset }}-monthly-walkforward
          path: ${{ runner.temp }}/report.json
          retention-days: 14
          if-no-files-found: error

  remaining:
    name: Phase29 four new semantic CSVs (${{ matrix.dataset }})
    needs: canary
    if: ${{ needs.canary.result == 'success' }}
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - dataset: "financials"
            source_dir: "225_group_all_period/financials"
            source_run: 0
            source_artifact: ""
            proof4: "p2-common-exact-six-group-identities"
            proof4_file: "group.json"
          - dataset: "consumer_goods"
            source_dir: "225_group_all_period/consumer_goods"
            source_run: 0
            source_artifact: ""
            proof4: "p2-common-exact-six-group-identities"
            proof4_file: "group.json"
          - dataset: "materials"
            source_dir: "225_group_all_period/materials"
            source_run: 0
            source_artifact: ""
            proof4: "p2-common-exact-six-group-identities"
            proof4_file: "group.json"
          - dataset: "capital_goods_others"
            source_dir: "225_group_all_period/capital_goods_others"
            source_run: 0
            source_artifact: ""
            proof4: "p2-common-exact-six-group-identities"
            proof4_file: "group.json"
          - dataset: "exclude_capital_goods_transportation_utilities"
            source_dir: "225_exclusion_all_period/exclude_capital_goods_transportation_utilities"
            source_run: 37201520569
            source_artifact: "p2-225-exclusion-no-capital-transport-features"
            proof4: "p2-common-exact-exclude_capital_goods_transportation_utilities-identities"
            proof4_file: "audit.json"
          - dataset: "exclude_transportation_utilities"
            source_dir: "225_exclusion_all_period/exclude_transportation_utilities"
            source_run: 37201518110
            source_artifact: "p2-225-exclusion-no-transport-features"
            proof4: "p2-common-exact-exclude_transportation_utilities-identities"
            proof4_file: "audit.json"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout only Private fixed core and exact saved reference CSVs
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
            /preview/kabu/analysis/${{ matrix.source_dir }}/signal_level_features.csv
            /preview/kabu/analysis/${{ matrix.source_dir }}/monthly_baseline_performance.csv
            /preview/kabu/analysis/${{ matrix.source_dir }}/monthly_baseline_stability_summary.csv
            /preview/kabu/analysis/${{ matrix.source_dir }}/month_of_year_baseline_summary.csv
            /preview/kabu/analysis/${{ matrix.source_dir }}/walkforward_results.csv
          persist-credentials: false
      - name: Enforce Public-only Actions, immutable private SHA and no Private workflow
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Private workflow detected"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse original saved exclusion feature artifact, no extraction
        if: ${{ matrix.source_run != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.source_artifact }}
          run-id: ${{ matrix.source_run }}
          github-token: ${{ github.token }}
          path: original_source
      - name: Reuse fixed Phase4 original source SHA identity proof
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.proof4 }}
          run-id: 38239501315
          github-token: ${{ github.token }}
          path: proof4
      - name: Reuse Phase28 complete candidate numerical proof, never recalculate
        uses: actions/download-artifact@v4
        with:
          name: p2-phase28-${{ matrix.dataset }}-all-remaining-single-candidates
          run-id: 38498978072
          github-token: ${{ github.token }}
          path: proof28
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install pinned canonical requirements
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Compare exactly four new canonical monthly and walkforward calculations
        run: |
          set -euo pipefail
          test -f "proof4/${{ matrix.proof4_file }}"
          test -f proof28/summary.json
          python scripts/p2_common_phase29_monthly_walkforward_20261014.py \
            --core core \
            --dataset "$DATASET" \
            --reference "core/preview/kabu/analysis/${{ matrix.source_dir }}" \
            --source-root original_source \
            --proof4 "proof4/${{ matrix.proof4_file }}" \
            --proof28 proof28/summary.json \
            --stage "core/build/p2_phase29_$GITHUB_RUN_ID/$DATASET" \
            --report "$RUNNER_TEMP/report.json"
      - name: Fail-closed numerical equality and immutable source provenance gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"report.json").read_text(encoding="utf-8"))
          assert d["status"]=="PASS_PHASE29_NEW_MONTHLY_WALKFORWARD_FOUR_CSV"
          assert d["dataset"]==os.environ["DATASET"]
          assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert d["source_rows"]>0 and d["source_tickers"]>0
          assert d["mismatches"]==[] and len(d["files"])==4
          assert all(r["reference_rows"]==r["new_rows"]>0 and
                     len(r["reference_sha256"])==64 and len(r["new_sha256"])==64
                     for r in d["files"].values())
          assert d["new_canonical_inner_functions_executed"] is True
          for key in ("previous_artifacts_recalculated","source_signals_recomputed",
                      "full_semantic_or_computed","html_generated","production_changed",
                      "release_ready"):
              assert d[key] is False,key
          print("PASS_PHASE29_NEW_FOUR_CSV",d["dataset"])
          PY
      - name: Confirm Private original tracked bytes remain unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Upload JSON-only proof, never private data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase29-${{ matrix.dataset }}-monthly-walkforward
          path: ${{ runner.temp }}/report.json
          retention-days: 14
          if-no-files-found: error

  final_gate:
    name: Independent seven dataset 4 CSV full numerical parity gate
    needs: [selftest, canary, remaining]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Stop on any failure
        env:
          A: ${{ needs.selftest.result }}
          B: ${{ needs.canary.result }}
          C: ${{ needs.remaining.result }}
        run: |
          set -euo pipefail
          test "$A" = success && test "$B" = success && test "$C" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: p2-phase29-*-monthly-walkforward
          path: evidence
      - name: Count all seven independently certified new four CSV calculations
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          datasets={"technology","financials","consumer_goods","materials",
                    "capital_goods_others","exclude_capital_goods_transportation_utilities",
                    "exclude_transportation_utilities"}
          root=Path("evidence")
          expected={"p2-phase29-"+d+"-monthly-walkforward" for d in datasets}
          found={p.name for p in root.iterdir() if p.is_dir()}
          assert found==expected,(found,expected)
          for ds in sorted(datasets):
              d=json.loads((root/("p2-phase29-"+ds+"-monthly-walkforward")/
                            "report.json").read_text(encoding="utf-8"))
              assert d["status"]=="PASS_PHASE29_NEW_MONTHLY_WALKFORWARD_FOUR_CSV"
              assert d["dataset"]==ds and d["mismatches"]==[]
              assert len(d["files"])==4
              assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
              assert d["release_ready"] is False
              print("PASS",ds,{n:q["new_rows"] for n,q in d["files"].items()})
          print("PASS_PHASE29_7_DATASETS_NEW_FOUR_CSV_BOUNDED_NUMERIC_PARITY")
          PY
      - name: State intentionally unverified downstream calculations
        run: |
          echo "PASS: seven more datasets 4 monthly/walkforward CSVs compared against saved references." >> "$GITHUB_STEP_SUMMARY"
          echo "Uncertified: full pair/triple/combination/OR/29CSV/HTML and Nikkei 890 original." >> "$GITHUB_STEP_SUMMARY"
          echo "No Production P2, old CSV, HTML, release or deployment changes." >> "$GITHUB_STEP_SUMMARY"
