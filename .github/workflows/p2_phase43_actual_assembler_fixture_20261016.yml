# User approved Phase43 continuation. Executes REAL original pinned Private
# 29-CSV assembler on isolated temporary SAVED-FIXTURE inputs, with two negative
# tamper/source-lineage gate checks. NOT a new Semantic or OR numeric producer.
name: P2 Phase43 real assembler 29-CSV fixture and corruption gates
on:
  push:
    branches: [automation/p2-common-postextract-20261012]
    paths:
      - '.github/workflows/p2_phase43_actual_assembler_fixture_20261016.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-phase43-actual-assembler-saved-fixture-20261016
  cancel-in-progress: false
env:
  CORE_SHA: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  preflight:
    name: Require actual previous Phase43 SHA crossproof success and only assembler fixture contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fix exact old successful Phase43 lineage SHA and valid fixture script
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          python -m py_compile scripts/p2_phase43_actual_assembler_fixture_20261016.py
          python scripts/p2_phase43_actual_assembler_fixture_20261016.py --selftest
          gh api repos/yuki746289/product_kabu_actions/actions/runs/38842234272 --jq '.conclusion + " " + .head_sha' | \
            grep -Fx 'success 06a93cf7c87b9a7481d766f29a3ef6cdd9632ed2'

  canary:
    name: Real original P2 assembler and negative SHA gates (${{ matrix.dataset }})
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - dataset: "technology"
            dir: "225_group_all_period/technology"
            sourceRun: 0
            sourceArtifact: ""
    env:
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Sparse immutable original Private assembler, I/O contract and archived 29 CSV fixture
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/assemble_p2_common_dataset_csv.py
            /scripts/p2_html_core/
            /preview/kabu/analysis/${{ matrix.dir }}/*.csv
          persist-credentials: false
      - name: Mandatory fixed Private original SHA, Public-only runner, zero Private workflow gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Original Private core must have zero workflows"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse external original saved feature source for original exclusion population
        if: ${{ matrix.sourceRun != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sourceArtifact }}
          run-id: ${{ matrix.sourceRun }}
          github-token: ${{ github.token }}
          path: original_features
      - name: Reuse original Phase38 29 CSV exact source census/SHA audit
        uses: actions/download-artifact@v4
        with:
          name: p2-phase38-${{ matrix.dataset }}-saved-29csv-inventory
          run-id: 38524279221
          github-token: ${{ github.token }}
          path: proof38
      - name: Reuse actual prior full Phase43 saved source-bound crossproof
        uses: actions/download-artifact@v4
        with:
          name: p2-phase43-${{ matrix.dataset }}-saved-lineage-crossproof
          run-id: 38842234272
          github-token: ${{ github.token }}
          path: proof43
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install exact Private I/O assembler Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Call real original fixed-SHA assembler with clearly synthetic immutable fixtures
        shell: bash
        run: |
          set -euo pipefail
          test -f proof38/audit.json
          test -f proof43/report.json
          python scripts/p2_phase43_actual_assembler_fixture_20261016.py \
            --dataset "$DATASET" --core core \
            --reference "core/preview/kabu/analysis/${{ matrix.dir }}" \
            --external original_features \
            --proof38 proof38/audit.json --proof43 proof43/report.json \
            --report "$RUNNER_TEMP/report.json"
      - name: Require positive 29 SHA, negative tamper and wrong lineage rejected, never certify new producer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"report.json").read_text())
          assert q["status"]=="PASS_PHASE43_ACTUAL_ASSEMBLER_FIXTURE_AND_NEGATIVE_GATES"
          assert q["dataset"]==os.environ["DATASET"]
          assert q["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert q["actual_private_assemble_function_called"] is True
          assert q["sha_bound_old_original_fixture_files"]==29
          assert q["assembler_copied_and_SHA_verified_outputs"]==29
          assert "tampered_OR_intermediate_rejected" in q["pass_checks"]
          assert "wrong_OR_semantic_lineage_rejected" in q["pass_checks"]
          assert q["intentional_negative_gate_test_count"]==2
          for field in ("actual_new_semantic_numeric_producer_run",
                        "actual_new_or_numeric_producer_run",
                        "semantic_status_is_original_producer_generated",
                        "or_status_is_original_producer_generated",
                        "full_new_producer_29_csv_numerical_parity_certified",
                        "phase43_full_complete",
                        "previous_successful_producer_outputs_recomputed",
                        "original_saved_source_files_modified",
                        "production_p2_v12_changed",
                        "phase48_merge_or_deploy","release_ready"):
              assert q[field] is False,field
          print("PASS_REAL_ASSEMBLER_FIXTURE_NEGATIVE_TESTS_ONLY",q["dataset"])
          PY
      - name: Old Private source unchanged, temp fixtures removed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Upload only SHA/positive-and-negative-test verdict metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase43-${{ matrix.dataset }}-actual-assembler-fixture
          path: ${{ runner.temp }}/report.json
          retention-days: 30
          if-no-files-found: error


  remaining:
    name: Real original P2 assembler and negative SHA gates (${{ matrix.dataset }})
    needs: canary
    if: ${{ needs.canary.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - dataset: "financials"
            dir: "225_group_all_period/financials"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "consumer_goods"
            dir: "225_group_all_period/consumer_goods"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "materials"
            dir: "225_group_all_period/materials"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "capital_goods_others"
            dir: "225_group_all_period/capital_goods_others"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "transportation_utilities"
            dir: "225_group_all_period/transportation_utilities"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "exclude_capital_goods_transportation_utilities"
            dir: "225_exclusion_all_period/exclude_capital_goods_transportation_utilities"
            sourceRun: 37201520569
            sourceArtifact: "p2-225-exclusion-no-capital-transport-features"
          - dataset: "exclude_transportation_utilities"
            dir: "225_exclusion_all_period/exclude_transportation_utilities"
            sourceRun: 37201518110
            sourceArtifact: "p2-225-exclusion-no-transport-features"
    env:
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Sparse immutable original Private assembler, I/O contract and archived 29 CSV fixture
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/assemble_p2_common_dataset_csv.py
            /scripts/p2_html_core/
            /preview/kabu/analysis/${{ matrix.dir }}/*.csv
          persist-credentials: false
      - name: Mandatory fixed Private original SHA, Public-only runner, zero Private workflow gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Original Private core must have zero workflows"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse external original saved feature source for original exclusion population
        if: ${{ matrix.sourceRun != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sourceArtifact }}
          run-id: ${{ matrix.sourceRun }}
          github-token: ${{ github.token }}
          path: original_features
      - name: Reuse original Phase38 29 CSV exact source census/SHA audit
        uses: actions/download-artifact@v4
        with:
          name: p2-phase38-${{ matrix.dataset }}-saved-29csv-inventory
          run-id: 38524279221
          github-token: ${{ github.token }}
          path: proof38
      - name: Reuse actual prior full Phase43 saved source-bound crossproof
        uses: actions/download-artifact@v4
        with:
          name: p2-phase43-${{ matrix.dataset }}-saved-lineage-crossproof
          run-id: 38842234272
          github-token: ${{ github.token }}
          path: proof43
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install exact Private I/O assembler Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Call real original fixed-SHA assembler with clearly synthetic immutable fixtures
        shell: bash
        run: |
          set -euo pipefail
          test -f proof38/audit.json
          test -f proof43/report.json
          python scripts/p2_phase43_actual_assembler_fixture_20261016.py \
            --dataset "$DATASET" --core core \
            --reference "core/preview/kabu/analysis/${{ matrix.dir }}" \
            --external original_features \
            --proof38 proof38/audit.json --proof43 proof43/report.json \
            --report "$RUNNER_TEMP/report.json"
      - name: Require positive 29 SHA, negative tamper and wrong lineage rejected, never certify new producer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json
          from pathlib import Path
          q=json.loads((Path(os.environ["RUNNER_TEMP"])/"report.json").read_text())
          assert q["status"]=="PASS_PHASE43_ACTUAL_ASSEMBLER_FIXTURE_AND_NEGATIVE_GATES"
          assert q["dataset"]==os.environ["DATASET"]
          assert q["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert q["actual_private_assemble_function_called"] is True
          assert q["sha_bound_old_original_fixture_files"]==29
          assert q["assembler_copied_and_SHA_verified_outputs"]==29
          assert "tampered_OR_intermediate_rejected" in q["pass_checks"]
          assert "wrong_OR_semantic_lineage_rejected" in q["pass_checks"]
          assert q["intentional_negative_gate_test_count"]==2
          for field in ("actual_new_semantic_numeric_producer_run",
                        "actual_new_or_numeric_producer_run",
                        "semantic_status_is_original_producer_generated",
                        "or_status_is_original_producer_generated",
                        "full_new_producer_29_csv_numerical_parity_certified",
                        "phase43_full_complete",
                        "previous_successful_producer_outputs_recomputed",
                        "original_saved_source_files_modified",
                        "production_p2_v12_changed",
                        "phase48_merge_or_deploy","release_ready"):
              assert q[field] is False,field
          print("PASS_REAL_ASSEMBLER_FIXTURE_NEGATIVE_TESTS_ONLY",q["dataset"])
          PY
      - name: Old Private source unchanged, temp fixtures removed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Upload only SHA/positive-and-negative-test verdict metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase43-${{ matrix.dataset }}-actual-assembler-fixture
          path: ${{ runner.temp }}/report.json
          retention-days: 30
          if-no-files-found: error

  final_gate:
    name: Confirm all 8 real original assemblers reject tamper and false upstream provenance
    needs: [preflight,canary,remaining]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: All upstream SHAs and negative controls must PASS
        shell: bash
        env:
          P: ${{ needs.preflight.result }}
          C: ${{ needs.canary.result }}
          R: ${{ needs.remaining.result }}
        run: |
          set -euo pipefail
          test "$P" = success && test "$C" = success && test "$R" = success
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p2-phase43-*-actual-assembler-fixture
          path: evidence
      - name: Independent eight-original-source real assembled fixture accounting no full producer claim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          ds=("technology","financials","consumer_goods","materials","capital_goods_others",
              "transportation_utilities","exclude_capital_goods_transportation_utilities",
              "exclude_transportation_utilities")
          root=Path("evidence")
          wanted={"p2-phase43-"+d+"-actual-assembler-fixture" for d in ds}
          observed={p.name for p in root.iterdir() if p.is_dir()}
          assert wanted==observed,(wanted-observed,observed-wanted)
          for d in ds:
              q=json.loads((root/("p2-phase43-"+d+"-actual-assembler-fixture")/"report.json").read_text())
              assert q["status"]=="PASS_PHASE43_ACTUAL_ASSEMBLER_FIXTURE_AND_NEGATIVE_GATES"
              assert q["dataset"]==d
              assert q["actual_private_assemble_function_called"] is True
              assert q["assembler_copied_and_SHA_verified_outputs"]==29
              assert q["intentional_negative_gate_test_count"]==2
              assert len(q["pass_checks"])==8
              assert q["full_new_producer_29_csv_numerical_parity_certified"] is False
              assert q["phase43_full_complete"] is False and q["release_ready"] is False
              print("PASS_PHASE43_REAL_ASSEMBLER_SAVED_FIXTURE_GATE",d)
          print("PASS_PHASE43_REAL_ORIGINAL_ASSEMBLER_AND_NEGATIVE_GATES_ALL_EIGHT_SAVED_FIXTURES")
          PY
      - name: State exactly what is and is not complete
        if: always()
        run: |
          echo "Original Private core's actual CSV assembler invoked with 29 SHA-bound old saved FIXTURE files and two fail-closed negative controls per dataset." >> "$GITHUB_STEP_SUMMARY"
          echo "This is NOT full new semantic/OR producer numerical parity. The 6-hour original Semantic build is NOT rerun." >> "$GITHUB_STEP_SUMMARY"
          echo "No saved sources changed, no PR merge/release/deploy, Phase46 remains deferred." >> "$GITHUB_STEP_SUMMARY"
