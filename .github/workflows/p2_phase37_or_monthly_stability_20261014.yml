          path: ${{ runner.temp }}/audit.json
          retention-days: 14
          if-no-files-found: error

  final_gate:
    name: Verify all 51 disjoint candidate OR monthly shards and original counts
    needs: [selftest, canary, remaining]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any previous stage unsuccessful
        env:
          A: ${{ needs.selftest.result }}
          B: ${{ needs.canary.result }}
          C: ${{ needs.remaining.result }}
        run: |
          set -euo pipefail
          test "$A" = success && test "$B" = success && test "$C" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: p2-phase37-*-offset-*
          path: evidence
      - name: Original population, SHA and all disjoint condition-key coverage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          totals={"technology":60,"financials":75,"consumer_goods":60,
              "materials":60,"capital_goods_others":60,"transportation_utilities":61,
              "exclude_capital_goods_transportation_utilities":60,
              "exclude_transportation_utilities":60}
          base=Path("evidence")
          expected={"p2-phase37-"+ds+"-offset-"+str(i)
              for ds,total in totals.items() for i in range(0,total,10)}
          actual={p.name for p in base.iterdir() if p.is_dir()}
          assert expected==actual,(sorted(expected-actual),sorted(actual-expected))
          for ds,total in totals.items():
              reports=[]
              for offset in range(0,total,10):
                  d=json.loads((base/("p2-phase37-"+ds+"-offset-"+str(offset))/"audit.json")
                               .read_text(encoding="utf-8"))
                  assert d["status"]=="PASS_PHASE37_NEW_OR_MONTHLY_STABILITY_SHARD"
                  assert d["dataset"]==ds and d["candidate_offset"]==offset
                  assert d["candidate_rows"]==min(10,total-offset)
                  assert d["mismatches"]==[]
                  assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
                  assert d["previous_artifacts_recalculated"] is False
                  assert d["previous_rank_recalculated"] is False
                  assert d["release_ready"] is False
                  reports.append(d)
              assert len({r["original_source_sha256"] for r in reports})==1
              assert len({r["old_candidate_sha256"] for r in reports})==1
              allkeys=[k for r in reports for k in r["candidate_key_hashes"]]
              assert len(allkeys)==len(set(allkeys))==total
              assert sum(r["candidate_rows"] for r in reports)==total
              print("PASS_PHASE37_ALL_RANKED_MONTHLY",ds,total)
          print("PASS_PHASE37_EIGHT_DATASETS_OR_MONTHLY_STABILITY_NUMERIC_PARITY")
          PY
      - name: Declare exact certified scope and release hold
        run: |
          echo "All saved OR ranked candidates monthly stability metrics verified across 8 datasets." >> "$GITHUB_STEP_SUMMARY"
          echo "Full new common 29 CSV, all225 adapter, HTML/browser, Nikkei890 remain uncertified." >> "$GITHUB_STEP_SUMMARY"
          echo "No successful old artifacts reexecuted, old data modified, PR merged, release or deploy." >> "$GITHUB_STEP_SUMMARY"
