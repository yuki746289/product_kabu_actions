name: P2 local Alias validation 20261007

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/p2_local_junction_trigger'

permissions:
  contents: read

env:
  CORE_REPO: yuki746289/product_kabu
  CORE_SHA: ad535ad8147ad7301bf801bba7fc19ddb4fd3f6f

jobs:
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ env.CORE_SHA }}
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            deploy_local.bat
            apache/product_kabu_local.conf
            preview/kabu/_runtime/p2_local_runtime.js
            preview/kabu/_runtime/p2_local_runtime.css
          sparse-checkout-cone-mode: false

      - name: Verify fixed core SHA
        shell: pwsh
        run: |
          $actual=(git -C core rev-parse HEAD).Trim()
          if ($actual -ne $env:CORE_SHA) { throw "core SHA mismatch: $actual" }

      - name: Reproduce PowerShell path normalization
        shell: pwsh
        run: |
          $raw='C:\Users\yuki_\OneDrive\Documents\github\product_kabu\preview\kabu'
          $current=$raw.Replace('\\','/')
          $correct=$raw.Replace('\','/')
          Write-Host "raw=$raw"
          Write-Host "current=$current"
          Write-Host "correct=$correct"
          if ($current -ne $raw) { throw 'Expected current expression to leave single backslashes unchanged' }
          if ($correct -ne 'C:/Users/yuki_/OneDrive/Documents/github/product_kabu/preview/kabu') { throw 'Correct expression did not normalize path' }

      - name: JavaScript syntax check
        shell: pwsh
        run: |
          node --check core/preview/kabu/_runtime/p2_local_runtime.js

      - name: Runtime and deploy contract check
        shell: pwsh
        run: |
          $js=Get-Content -Raw core/preview/kabu/_runtime/p2_local_runtime.js
          $css=Get-Content -Raw core/preview/kabu/_runtime/p2_local_runtime.css
          $conf=Get-Content -Raw core/apache/product_kabu_local.conf
          $bat=Get-Content -Raw core/deploy_local.bat

          @(
            'p2-favorites-table',
            'p2-growth-500',
            'p2-growth-1000',
            'correctLegend',
            'incorrectLegend',
            '#2457a6',
            '#c2413b',
            '__P2_LOCAL_RUNTIME_V1__'
          ) | ForEach-Object {
            if (-not $js.Contains($_)) { throw "runtime contract missing: $_" }
          }

          if (-not $css.Contains('.p2-favorites-table')) { throw 'favorites CSS missing' }
          if (-not $conf.Contains('Alias "/kabu/" "__KABU_SOURCE__/"')) { throw 'Apache Alias template missing' }
          if (-not $conf.Contains('AddOutputFilter SUBSTITUTE .html')) { throw 'Apache extension SUBSTITUTE filter missing' }
          if (-not $conf.Contains('/kabu/_runtime/p2_local_runtime.js')) { throw 'runtime JS injection missing' }
          if (-not $conf.Contains('/kabu/_runtime/p2_local_runtime.css')) { throw 'runtime CSS injection missing' }

          if ($bat -match '(?i)mklink\s+/J') { throw 'junction command must not remain' }
          if ($bat -match '(?i)\bxcopy\b') { throw 'xcopy must not remain' }
          if ($bat -match 'postprocess_p2_accuracy_highlight\.py') { throw 'disk postprocess must not remain in deploy' }
          if ($bat -match '(?im)^\s*pause\s*$') { throw 'pause must not remain for Git Bash execution' }
          if ($bat -match '(?i)(^|\s)timeout(?:\.exe)?\s+/t') { throw 'timeout.exe wait must not remain' }
          if (-not $bat.Contains('__KABU_SOURCE__')) { throw 'Alias source replacement missing' }
          if (-not $bat.Contains('Mode          : Apache Alias')) { throw 'Alias success marker missing' }
          if (-not $bat.Contains('Remove-Item -LiteralPath')) { throw 'legacy duplicate cleanup missing' }

      - name: Alias template materialization
        shell: pwsh
        run: |
          $template=Get-Content -Raw core/apache/product_kabu_local.conf
          $src='C:/Users/test/project/preview/kabu'
          $rendered=$template.Replace('__KABU_SOURCE__',$src)
          if (-not $rendered.Contains('Alias "/kabu/" "C:/Users/test/project/preview/kabu/"')) { throw 'Alias render failed' }
          if (-not $rendered.Contains('<Directory "C:/Users/test/project/preview/kabu">')) { throw 'Directory render failed' }

      - name: Simulate Apache response injection
        shell: pwsh
        run: |
          $sample='<!doctype html><html><head></head><body><script id="p2-accuracy-highlight-script">old()</script></body></html>'
          $sample=$sample.Replace('<script id="p2-accuracy-highlight-script">','<script type="text/plain" id="p2-accuracy-highlight-script">')
          $sample=$sample.Replace('</head>','<link rel="stylesheet" href="/kabu/_runtime/p2_local_runtime.css"></head>')
          $sample=$sample.Replace('</body>','<script src="/kabu/_runtime/p2_local_runtime.js"></script></body>')
          if (-not $sample.Contains('type="text/plain" id="p2-accuracy-highlight-script"')) { throw 'old inline script was not disabled' }
          if (-not $sample.Contains('/kabu/_runtime/p2_local_runtime.css')) { throw 'CSS was not injected' }
          if (-not $sample.Contains('/kabu/_runtime/p2_local_runtime.js')) { throw 'JS was not injected' }
