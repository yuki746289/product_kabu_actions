name: P2 Oracle continuation multi-period pilot

on:
  push:
    branches:
      - research/p2-oracle-pilot-20260911
    paths:
      - '.github/workflows/p2_oracle_multiperiod_pilot.yml'
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout actions repository
        uses: actions/checkout@v4

      - name: Checkout private core research branch
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: research/p2-hypotheses-20260911
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy

      - name: Run multi-period Oracle pilot
        working-directory: core
        run: |
          python scripts/pilot_p2_oracle_multiperiod.py \
            --max-tickers 60 \
            --blocks 6 \
            --block-days 60 \
            --warmup-days 260 \
            --reserve-future-days 30 \
            --output-dir data/diagnostics/p2_oracle_multiperiod
          echo '--- status.json ---'
          cat data/diagnostics/p2_oracle_multiperiod/status.json
          echo '--- periods.csv ---'
          cat data/diagnostics/p2_oracle_multiperiod/periods.csv
          echo '--- period_effects.csv ---'
          cat data/diagnostics/p2_oracle_multiperiod/period_effects.csv

      - name: Verify pilot outputs
        working-directory: core
        run: |
          test -f data/diagnostics/p2_oracle_multiperiod/signals.csv
          test -f data/diagnostics/p2_oracle_multiperiod/periods.csv
          test -f data/diagnostics/p2_oracle_multiperiod/period_effects.csv
          test -f data/diagnostics/p2_oracle_multiperiod/status.json
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root = Path('data/diagnostics/p2_oracle_multiperiod')
          status = json.loads((root/'status.json').read_text(encoding='utf-8'))
          effects = pd.read_csv(root/'period_effects.csv')
          assert status['causal_violations'] == 0, status
          assert status['periods'] >= 3, status
          assert status['signals'] > 0, status
          assert not effects.empty
          print({'periods': status['periods'], 'signals': status['signals'], 'rows': len(effects)})
          PY

      - name: Upload pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2-oracle-multiperiod-pilot
          path: core/data/diagnostics/p2_oracle_multiperiod
          retention-days: 7
          compression-level: 6
