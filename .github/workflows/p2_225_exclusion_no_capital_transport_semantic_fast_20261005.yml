name: P2 225 exclusion no capital transport semantic fast 20261005

on:
  push:
    branches: [main]
    paths:
      - '.github/p2_225_exclusion_no_capital_transport_semantic_fast_trigger'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  FOUNDATION_RUN_ID: "37201520569"
  ORIGINAL_SEMANTIC_RUN_ID: "37201967494"
  FINE_RUN_ID: "37207975979"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Resolve core SHA
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(awk -F': ' '$1=="expected_core_head"{print $2}' .github/p2_225_exclusion_no_capital_transport_semantic_fast_trigger)"
          test -n "$SHA"
          echo "core_sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: ${{ steps.cfg.outputs.core_sha }}
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements.txt

      - run: pip install -r core/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: p2-225-exclusion-no-capital-transport-features
          path: /tmp/features
          repository: yuki746289/product_kabu_actions
          run-id: ${{ env.FOUNDATION_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: p2-225-exclusion-no-capital-transport-semantic-base
          path: /tmp/base
          repository: yuki746289/product_kabu_actions
          run-id: ${{ env.ORIGINAL_SEMANTIC_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: p2-225-exclusion-no-capital-transport-structural
          path: /tmp/structural
          repository: yuki746289/product_kabu_actions
          run-id: ${{ env.ORIGINAL_SEMANTIC_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: p2-225-exclusion-no-capital-transport-condition-fine
          path: /tmp/condition
          repository: yuki746289/product_kabu_actions
          run-id: ${{ env.FINE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: p2-225-exclusion-no-capital-transport-combo-walkforward-*
          path: /tmp/combo_walkforward
          merge-multiple: false
          repository: yuki746289/product_kabu_actions
          run-id: ${{ env.ORIGINAL_SEMANTIC_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build contract-validated fast combo stability
        working-directory: core
        run: |
          python scripts/build_p2_225_combo_stability_fast.py \
            --features /tmp/features/features.csv \
            --structural-dir /tmp/structural \
            --output-dir /tmp/combo_stability \
            --validate-first 2

      - name: Patch ticker invariant in runner only
        working-directory: core
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("scripts/assemble_p2_225_semantic_bundle.py")
          s=p.read_text(encoding="utf-8")
          old='int(bs["source_tickers"])==225'
          assert old in s
          p.write_text(s.replace(old,'int(bs["source_tickers"])==170',1),encoding="utf-8")
          PY

      - name: Assemble semantic bundle
        working-directory: core
        run: |
          python scripts/assemble_p2_225_semantic_bundle.py \
            --base-dir /tmp/base \
            --structural-dir /tmp/structural \
            --condition-dir /tmp/condition \
            --combo-stability-root /tmp/combo_stability \
            --combo-walkforward-root /tmp/combo_walkforward \
            --output-dir /tmp/semantic
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/semantic/semantic_status.json")
          s=json.loads(p.read_text(encoding="utf-8"))
          assert s.get("overall_pass") is True, s
          assert s.get("source_rows")==137426, s
          assert s.get("source_tickers")==170, s
          print("FAST semantic PASS", s["combination_stability_rows"], s["combination_walkforward_rows"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: p2-225-exclusion-no-capital-transport-semantic-split-fast
          path: /tmp/semantic
          retention-days: 30
