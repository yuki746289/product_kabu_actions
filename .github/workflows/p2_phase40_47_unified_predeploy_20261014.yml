# Created: 2026-10-14 JST. User approved unified Phase40-47 single-run research QA.
# Honest NO_GO if original 890 absent, new 29-CSV producer not certified, or missing browser QA.
# No Private Actions, no Production P2 v12 or old artifacts recalculation, no deploy.
name: P2 Phase40-47 unified predeployment audit NO-GO-safe
on:
  push:
    branches: [automation/p2-common-postextract-20261012]
    paths:
      - '.github/workflows/p2_phase40_47_unified_predeploy_20261014.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-unified-phase40-47-20261014
  cancel-in-progress: false
env:
  CORE_SHA: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
  PYTHONUNBUFFERED: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  preflight:
    name: P2 fixed Phase39 success + fail-closed unified scope preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assert no production/release and pinned prior successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          python -m py_compile scripts/p2_common_phase40_47_batch_20261014.py
          python scripts/p2_common_phase40_47_batch_20261014.py --phase selftest
          gh api repos/yuki746289/product_kabu_actions/actions/runs/38525185498 --jq '.conclusion + " " + .head_sha' | \
            grep -Fx 'success a029df1f61a72a428a143f12a2f03bf9024245af'
          gh api repos/yuki746289/product_kabu_actions/actions/runs/38524279221 --jq '.conclusion + " " + .head_sha' | \
            grep -Fx 'success b596d5709e0a2e7905651f18200c83d72bee99ae'
          echo "Phase40-47 batch has no production actions, PR merge or deploy steps" >> "$GITHUB_STEP_SUMMARY"

  candidate_stability:
    name: R&D Phase40 (${{ matrix.dataset }})
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - dataset: "technology"
            dir: "225_group_all_period/technology"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "financials"
            dir: "225_group_all_period/financials"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "consumer_goods"
            dir: "225_group_all_period/consumer_goods"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "materials"
            dir: "225_group_all_period/materials"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "capital_goods_others"
            dir: "225_group_all_period/capital_goods_others"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "transportation_utilities"
            dir: "225_group_all_period/transportation_utilities"
            sourceRun: 0
            sourceArtifact: ""
          - dataset: "exclude_capital_goods_transportation_utilities"
            dir: "225_exclusion_all_period/exclude_capital_goods_transportation_utilities"
            sourceRun: 37201520569
            sourceArtifact: "p2-225-exclusion-no-capital-transport-features"
          - dataset: "exclude_transportation_utilities"
            dir: "225_exclusion_all_period/exclude_transportation_utilities"
            sourceRun: 37201518110
            sourceArtifact: "p2-225-exclusion-no-transport-features"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@v4
      - name: Sparse pinned Private original research code and saved reference only
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
            /preview/kabu/analysis/${{ matrix.dir }}/*.csv

          persist-credentials: false
      - name: Mandatory public-only, pinned Private SHA and architecture gate
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Forbidden private workflow"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"

      - name: Reuse original saved exclusion feature source
        if: ${{ matrix.sourceRun != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sourceArtifact }}
          run-id: ${{ matrix.sourceRun }}
          github-token: ${{ github.token }}
          path: original_source

      - name: Reuse exact successful Phase38 saved SHA contract
        uses: actions/download-artifact@v4
        with:
          name: p2-phase38-${{ matrix.dataset }}-saved-29csv-inventory
          run-id: 38524279221
          github-token: ${{ github.token }}
          path: proof38

      - name: Reuse exact Phase39 bounded stability success evidence
        uses: actions/download-artifact@v4
        with:
          name: p2-phase39-${{ matrix.dataset }}-combo-stability-bounded
          run-id: 38525185498
          github-token: ${{ github.token }}
          path: proof39

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install pinned original library dependencies before analysis
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt

      - name: Run bounded read-only Phase40 and record actual certification scope
        run: |
          set -euo pipefail
          python scripts/p2_common_phase40_47_batch_20261014.py --phase 40 \
            --core core --dataset "$DATASET" --phase38 proof38/audit.json --source-root original_source --phase39 proof39/audit.json \
            --report "$RUNNER_TEMP/report.json"
      - name: Require no raw data publication, no failed diagnostics and no release
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/"report.json").read_text(encoding="utf-8"))
          assert str(data["phase"])=="40"
          assert data["dataset"]==os.environ["DATASET"]
          assert data["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert data["status"]=="PASS_SCOPED" and data["errors"]==[]
          assert data["full_producer_certified"] is False
          assert data["deployed"] is False
          if data["phase"]=="40":
              assert data["previous_success_recomputed"] is False
              assert data["details"]["column_and_order_numeric_mismatches"]==0
          print("PASS_SCOPED_NOT_RELEASE_CERTIFIED",data["phase"],data["dataset"])
          PY
      - name: Verify Private checked-out tracked bytes unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Preserve only audit JSON, never source rows
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: batch-40-${{ matrix.dataset }}
          path: ${{ runner.temp }}/report.json
          retention-days: 14
          if-no-files-found: error

