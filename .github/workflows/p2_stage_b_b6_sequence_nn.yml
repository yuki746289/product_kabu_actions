name: P2 Stage B B6 sequence NN

on:
  push:
    branches: [research/p2-stage-b-b6-20260912]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [lightgbm_compact_purged, mlp_seq, cnn_seq, cnn_seq_compact]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: research/p2-hypotheses-20260911
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy scikit-learn tabulate
      - if: matrix.model == 'lightgbm_compact_purged'
        run: python -m pip install lightgbm
      - if: startsWith(matrix.model, 'cnn_')
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download B3 aggregate feature matrix
        uses: actions/download-artifact@v4
        with:
          name: p2-stage-b-b3-aggregate
          path: core/data/diagnostics/p2_stage_b/b6/input
          repository: yuki746289/product_kabu_actions
          run-id: 34671952644
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run strict annual walk-forward
        working-directory: core
        run: |
          python scripts/run_p2_stage_b_b6_sequence_nn.py \
            --features data/diagnostics/p2_stage_b/b6/input/features.csv \
            --output-dir data/diagnostics/p2_stage_b/b6/${{ matrix.model }} \
            --model ${{ matrix.model }} \
            --direction long \
            --embargo-days 35
      - name: Verify result
        working-directory: core
        env:
          MODEL: ${{ matrix.model }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('data/diagnostics/p2_stage_b/b6')/os.environ['MODEL']
          s=json.loads((p/'status.json').read_text())
          assert s['overall_pass'] is True and s['causal_violations']==0 and s['embargo_days']==35, s
          assert (p/'summary.csv').exists() and (p/'oos_predictions.csv').exists()
          print(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2-stage-b-b6-${{ matrix.model }}
          path: core/data/diagnostics/p2_stage_b/b6/${{ matrix.model }}
          retention-days: 7

  compare:
    needs: models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas tabulate
      - uses: actions/download-artifact@v4
        with:
          pattern: p2-stage-b-b6-*
          path: results
          merge-multiple: false
      - name: Build comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, pandas as pd
          frames=[pd.read_csv(p) for p in Path('results').glob('**/summary.csv')]
          x=pd.concat(frames,ignore_index=True)
          Path('final').mkdir(exist_ok=True)
          x.to_csv('final/model_comparison.csv',index=False)
          r=x.loc[x.target_retention_pct.eq(60)].copy().sort_values(['pooled_win_uplift_20d_pp','mean_auc'],ascending=[False,False])
          r.to_csv('final/rank_retention60.csv',index=False)
          cols=['model','mean_auc','baseline_entries','kept_entries','pooled_retention_pct','baseline_win_5d_pct','kept_win_5d_pct','pooled_win_uplift_5d_pp','baseline_win_10d_pct','kept_win_10d_pct','pooled_win_uplift_10d_pp','baseline_win_20d_pct','kept_win_20d_pct','pooled_win_uplift_20d_pp','positive_win_year_share_20d_pct','embargo_days']
          Path('final/report.md').write_text('# B6 sequence NN comparison - Long retention ~60%\n\n'+r[cols].to_markdown(index=False)+'\n',encoding='utf-8')
          Path('final/status.json').write_text(json.dumps({'models':sorted(x.model.unique().tolist()),'rows':len(x),'strict_embargo_days':35,'overall_pass':len(x)==16},indent=2)+'\n')
          print(r[cols].to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2-stage-b-b6-final
          path: final
          retention-days: 7
