name: P2 weekly continuation Oracle pilot

on:
  push:
    branches:
      - research/p2-oracle-pilot-20260911
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout actions repository
        uses: actions/checkout@v4

      - name: Checkout private core research branch
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: research/p2-hypotheses-20260911
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy

      - name: Run lightweight Oracle pilot
        working-directory: core
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/pilot_p2_oracle_weekly_continuation.py \
            --max-tickers 80 \
            --output-dir data/diagnostics/p2_oracle_pilot
          echo '--- report.md ---'
          cat data/diagnostics/p2_oracle_pilot/report.md
          echo '--- status.json ---'
          cat data/diagnostics/p2_oracle_pilot/status.json

      - name: Verify pilot outputs
        working-directory: core
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root = Path('data/diagnostics/p2_oracle_pilot')
          status = json.loads((root / 'status.json').read_text(encoding='utf-8'))
          signals = pd.read_csv(root / 'signals.csv')
          summary = pd.read_csv(root / 'summary.csv')
          assert status['causal_violations'] == 0, status
          assert len(signals) == status['signals']
          assert len(summary) > 0
          assert status['signals'] >= 20, f"too few signals for even a pilot: {status['signals']}"
          print({'signals': status['signals'], 'tickers': status['tickers_selected'], 'effects': status['effect_readout']})
          PY

      - name: Upload pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2-oracle-continuation-pilot
          path: core/data/diagnostics/p2_oracle_pilot
          retention-days: 7
          compression-level: 6
