name: P2 Stage B logic validation v2 categorical

on:
  push:
    branches: [research/p2-stage-b-logic-v2-20260912]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  individual:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        direction: [long, short]
        group: [fan, ema, price, rci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: research/p2-hypotheses-20260911
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Download causal weekly-state aggregate
        uses: actions/download-artifact@v4
        with:
          name: p2-stage-b-b9w-aggregate
          path: core/data/diagnostics/p2_stage_b/logic_v2/input
          repository: yuki746289/product_kabu_actions
          run-id: 34681101657
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run categorical individual validation
        working-directory: core
        run: |
          python scripts/run_p2_stage_b_logic_validation_v2.py \
            --mode individual \
            --features data/diagnostics/p2_stage_b/logic_v2/input/features.csv \
            --output-dir data/diagnostics/p2_stage_b/logic_v2/individual/${{ matrix.direction }}_${{ matrix.group }} \
            --direction ${{ matrix.direction }} \
            --group ${{ matrix.group }}
      - name: Verify individual result
        working-directory: core
        env:
          DIRECTION: ${{ matrix.direction }}
          GROUP: ${{ matrix.group }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('data/diagnostics/p2_stage_b/logic_v2/individual')/(os.environ['DIRECTION']+'_'+os.environ['GROUP'])/'status.json'
          s=json.loads(p.read_text())
          assert s['test']=='p2_stage_b_logic_v2_individual', s
          assert s['causal_violations']==0, s
          assert s['rows']>0, s
          print(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2-stage-b-logic-v2-ind-${{ matrix.direction }}-${{ matrix.group }}
          path: core/data/diagnostics/p2_stage_b/logic_v2/individual/${{ matrix.direction }}_${{ matrix.group }}
          retention-days: 7

  select:
    needs: individual
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: research/p2-hypotheses-20260911
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Download individual artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: p2-stage-b-logic-v2-ind-*
          path: core/data/diagnostics/p2_stage_b/logic_v2/individual_downloaded
          merge-multiple: false
      - name: Select stable individual categories
        working-directory: core
        run: |
          python scripts/run_p2_stage_b_logic_validation_v2.py \
            --mode select \
            --features /tmp/unused.csv \
            --individual-root data/diagnostics/p2_stage_b/logic_v2/individual_downloaded \
            --output-dir data/diagnostics/p2_stage_b/logic_v2/selected \
            --top-per-group 6
      - name: Verify selection
        working-directory: core
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/diagnostics/p2_stage_b/logic_v2/selected/status.json').read_text())
          assert s['test']=='p2_stage_b_logic_v2_select', s
          assert s['selected']>0, s
          print(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2-stage-b-logic-v2-selected
          path: core/data/diagnostics/p2_stage_b/logic_v2/selected
          retention-days: 7

  combine:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        direction: [long, short]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: research/p2-hypotheses-20260911
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Download causal weekly-state aggregate
        uses: actions/download-artifact@v4
        with:
          name: p2-stage-b-b9w-aggregate
          path: core/data/diagnostics/p2_stage_b/logic_v2/input
          repository: yuki746289/product_kabu_actions
          run-id: 34681101657
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download selected categories
        uses: actions/download-artifact@v4
        with:
          name: p2-stage-b-logic-v2-selected
          path: core/data/diagnostics/p2_stage_b/logic_v2/selected
      - name: Run category combinations
        working-directory: core
        run: |
          python scripts/run_p2_stage_b_logic_validation_v2.py \
            --mode combine \
            --features data/diagnostics/p2_stage_b/logic_v2/input/features.csv \
            --selected data/diagnostics/p2_stage_b/logic_v2/selected/selected_conditions.csv \
            --output-dir data/diagnostics/p2_stage_b/logic_v2/combine/${{ matrix.direction }} \
            --direction ${{ matrix.direction }}
      - name: Verify combinations
        working-directory: core
        env:
          DIRECTION: ${{ matrix.direction }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads((Path('data/diagnostics/p2_stage_b/logic_v2/combine')/os.environ['DIRECTION']/'status.json').read_text())
          assert s['test']=='p2_stage_b_logic_v2_combine', s
          assert s['rows']>0, s
          print(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2-stage-b-logic-v2-combine-${{ matrix.direction }}
          path: core/data/diagnostics/p2_stage_b/logic_v2/combine/${{ matrix.direction }}
          retention-days: 7

  finalize:
    needs: combine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: research/p2-hypotheses-20260911
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Download individual artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: p2-stage-b-logic-v2-ind-*
          path: core/data/diagnostics/p2_stage_b/logic_v2/final_individual
          merge-multiple: false
      - name: Download combination artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: p2-stage-b-logic-v2-combine-*
          path: core/data/diagnostics/p2_stage_b/logic_v2/final_combinations
          merge-multiple: false
      - name: Finalize categorical validation
        working-directory: core
        run: |
          python scripts/run_p2_stage_b_logic_validation_v2.py \
            --mode finalize \
            --features /tmp/unused.csv \
            --individual-root data/diagnostics/p2_stage_b/logic_v2/final_individual \
            --combination-root data/diagnostics/p2_stage_b/logic_v2/final_combinations \
            --output-dir data/diagnostics/p2_stage_b/logic_v2/final
      - name: Verify final
        working-directory: core
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/diagnostics/p2_stage_b/logic_v2/final/status.json').read_text())
          assert s['test']=='p2_stage_b_logic_v2_final', s
          assert s['individual_rows']>0 and s['combination_rows']>0, s
          print(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2-stage-b-logic-v2-final
          path: core/data/diagnostics/p2_stage_b/logic_v2/final
          retention-days: 7
