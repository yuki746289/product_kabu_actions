name: P2 225 industry all-period pages 20261002

on:
  push:
    branches: [main]
    paths:
      - '.github/p2_225_sector_pages_trigger'

permissions:
  contents: read
  actions: read

concurrency:
  group: p2-225-sector-pages-20261002
  cancel-in-progress: true

jobs:
  build_publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve contract
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/p2_225_sector_pages_trigger
          awk -F': ' '
            $1=="target_branch"{print "target_branch="$2}
            $1=="expected_core_head"{print "expected_core_head="$2}
            $1=="source_run_id"{print "source_run_id="$2}
            $1=="source_artifact"{print "source_artifact="$2}
          ' "$FILE" >> "$GITHUB_OUTPUT"

      - name: Checkout private core
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: ${{ steps.cfg.outputs.target_branch }}
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Actions architecture
        run: |
          python scripts/check_actions_architecture.py \
            --core-dir core \
            --expected-core-sha "${{ steps.cfg.outputs.expected_core_head }}"

      - name: Verify target head
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ steps.cfg.outputs.expected_core_head }}"
          echo "expected=$EXPECTED"
          echo "actual=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Install dependencies
        run: |
          pip install -r core/requirements.txt
          pip install beautifulsoup4 lxml requests

      - name: Download validated 225 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.source_artifact }}
          path: generated
          repository: yuki746289/product_kabu_actions
          run-id: ${{ steps.cfg.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify source artifact
        run: |
          set -euo pipefail
          test -f generated/signal_level_features.csv
          test -f generated/final_qa_status.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("generated")
          q=json.loads((root/"final_qa_status.json").read_text(encoding="utf-8"))
          s=json.loads((root/"status.json").read_text(encoding="utf-8"))
          assert q.get("overall_pass") is True, q
          assert s.get("overall_pass") is True, s
          assert s.get("baseline_rows")==181318, s
          assert s.get("unique_tickers")==225, s
          print("source QA PASS rows=181318 tickers=225")
          PY

      - name: Generate industry pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf core/preview/kabu/analysis/225_sector_all_period
          PYTHONPATH=core/scripts python core/scripts/generate_p2_225_sector_all_period_reports.py \
            --features-csv "$GITHUB_WORKSPACE/generated/signal_level_features.csv" \
            --output-dir "$GITHUB_WORKSPACE/core/preview/kabu/analysis/225_sector_all_period" \
            --canonical-report "$GITHUB_WORKSPACE/core/preview/kabu/analysis/225_indicator_stageb/report_all_period.html" \
            --expected-rows 181318 \
            --expected-tickers 225

      - name: QA industry pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          root=Path("core/preview/kabu")
          out=root/"analysis"/"225_sector_all_period"
          st=json.loads((out/"status.json").read_text(encoding="utf-8"))
          assert st["overall_pass"] is True, st
          assert st["source_rows"] == 181318, st
          assert st["source_tickers"] == 225, st
          assert st["mapped_tickers"] == 225, st
          assert st["sector_signal_sum"] == 181318, st
          assert st["sector_ticker_sum"] == 225, st
          assert st["generated_industry_pages"] >= 30, st
          assert st["generated_chart_pages"] == st["generated_industry_pages"] * 6, st
          assert st["production_changed"] is False, st

          canonical=(root/"analysis"/"225_indicator_stageb"/"report_all_period.html").read_text(encoding="utf-8")
          assert 'id="p2-sector-switch"' in canonical
          assert "全225株" in canonical
          assert "../225_sector_all_period/foods.html" in canonical

          foods=(out/"foods.html").read_text(encoding="utf-8")
          assert "主要225株・食品" in foods
          assert 'id="sectorSwitch"' in foods
          assert 'value="foods.html" selected' in foods
          assert "全225株と同じ5条件" in foods
          assert "52,938" not in foods

          # Check local href targets from every industry page/chart.
          missing=[]
          for p in out.rglob("*.html"):
              text=p.read_text(encoding="utf-8")
              for href in re.findall(r'href="([^"]+)"',text):
                  if href.startswith(("http://","https://","#","javascript:")):
                      continue
                  target=(p.parent/href.split("#",1)[0]).resolve()
                  if not target.exists():
                      missing.append((str(p.relative_to(root)),href))
          assert not missing, missing[:20]

          summary=(out/"sector_summary.csv").read_text(encoding="utf-8")
          assert "Foods" in summary and "Other Manufacturing" in summary
          print(json.dumps(st,ensure_ascii=False,indent=2))
          print("broken_local_links=0")
          PY

      - name: Commit industry pages
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A preview/kabu/analysis/225_sector_all_period
          git add preview/kabu/analysis/225_indicator_stageb/report_all_period.html
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: add Nikkei 225 industry all-period pages"
          git push origin "HEAD:refs/heads/${{ steps.cfg.outputs.target_branch }}"

      - name: Verify remote head
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin "refs/heads/${{ steps.cfg.outputs.target_branch }}" | cut -f1)"
          test "$LOCAL" = "$REMOTE"
          echo "published_head=$LOCAL"
