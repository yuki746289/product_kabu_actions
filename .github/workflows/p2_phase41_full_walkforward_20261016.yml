              assert {j["status"] for j in parts}=={"PASS_PHASE41_NEW_ORIGINAL_WALKFORWARD_TWO_YEARS"}
              assert len({j["source_sha256"] for j in parts})==1
              assert len({j["original_reference_sha256"] for j in parts})==1
              years=[int(y) for j in parts for y in j["years"]]
              assert years==list(range(2013,2027))
              assert sum(j["old_rows"] for j in parts)==84
              assert sum(j["new_rows"] for j in parts)==84
              assert all(j["mismatches"]==[] for j in parts)
              assert all(j["previous_success_artifacts_recomputed"] is False for j in parts)
              print("PASS_PHASE41_ALL_YEARS_OLD_NEW_NUMERIC_PARITY",d)
          print("PASS_PHASE41_ALL_EIGHT_DATASETS_FULL_WALKFORWARD_NEW_PRODUCER_NUMERIC_PARITY")
