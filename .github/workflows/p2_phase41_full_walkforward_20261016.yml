# Created 2026-10-16 JST
# Full original Walkforward numerical parity, 8 datasets x 7 disjoint two-year shards.
# Phase40 full original combination stability Run38582105679 verified, not rerun.
# Strict no private source changes, successful artifact re-computation, release/merge/deploy.
name: P2 Phase41 full walkforward numerical year shards
on:
  push:
    branches: [automation/p2-common-postextract-20261012]
    paths:
      - '.github/workflows/p2_phase41_full_walkforward_20261016.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: p2-phase41-full-walkforward-disjoint-20261016
  cancel-in-progress: false
env:
  CORE_SHA: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  selftest:
    name: Verify Phase40 final exhaustive PASS and disjoint walkforward years
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exact Phase40 successful source SHA and script selftest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          python -m py_compile scripts/p2_full_walkforward_year_shard_20261016.py
          python scripts/p2_full_walkforward_year_shard_20261016.py --selftest
          gh api repos/yuki746289/product_kabu_actions/actions/runs/38582105679 --jq '.conclusion + " " + .head_sha' | \
            grep -Fx 'success 99d884384661054e281552633fffaf4749e747b1'

  canary:
    name: Phase41 original walkforward numerics (${{ matrix.dataset }}, years=${{ matrix.shard }})
    needs: selftest
    if: ${{ needs.selftest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      max-parallel: 3
      fail-fast: true
      matrix:
        include:
          - dataset: "technology"
            dir: "225_group_all_period/technology"
            sourceRun: 0
            sourceArtifact: ""
            shard: 0
    env:
      DATASET: ${{ matrix.dataset }}
      SHARD: '${{ matrix.shard }}'
    steps:
      - uses: actions/checkout@v4
      - name: Sparse checkout immutable original historical research source and code
        uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: 52df33a6b26f988a1f71f0b61839d6888a96e1b8
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ACTIONS_MIGRATION.md
            /requirements.txt
            /scripts/
            /preview/kabu/analysis/${{ matrix.dir }}/signal_level_features.csv
            /preview/kabu/analysis/${{ matrix.dir }}/all_pairwise_combinations.csv
            /preview/kabu/analysis/${{ matrix.dir }}/tested_triple_combinations.csv
            /preview/kabu/analysis/${{ matrix.dir }}/combination_walkforward_results.csv
          persist-credentials: false
      - name: Enforce Public-only architecture, fixed SHA and zero Private workflows
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yuki746289/product_kabu_actions
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -f core/docs/ACTIONS_MIGRATION.md
          if git -C core ls-tree -r --name-only HEAD .github/workflows | grep -E '\.ya?ml$'; then
            echo "::error::Prohibited Private Actions workflows"; exit 1
          fi
          python scripts/check_actions_architecture.py --core-dir core --expected-core-sha "$CORE_SHA"
      - name: Reuse externally saved pinned original exclusion signal features
        if: ${{ matrix.sourceRun != 0 }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sourceArtifact }}
          run-id: ${{ matrix.sourceRun }}
          github-token: ${{ github.token }}
          path: saved_features
      - name: Reuse immutable Phase38 29-CSV source SHA ledger
        uses: actions/download-artifact@v4
        with:
          name: p2-phase38-${{ matrix.dataset }}-saved-29csv-inventory
          run-id: 38524279221
          github-token: ${{ github.token }}
          path: proof38
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install canonical pinned producer packages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r core/requirements.txt
      - name: Recompute ONLY current two-year full-walkforward selection independent numerical proof
        shell: bash
        run: |
          set -euo pipefail
          python scripts/p2_full_walkforward_year_shard_20261016.py \
            --core core --dataset "$DATASET" --shard "$SHARD" \
            --reference "core/preview/kabu/analysis/${{ matrix.dir }}" \
            --source-root saved_features --proof38 proof38/audit.json \
            --report "$RUNNER_TEMP/report.json"
      - name: Verify original candidate order, all six rows each year and independent numerical parity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"report.json").read_text(encoding="utf-8"))
          assert d["status"]=="PASS_PHASE41_NEW_ORIGINAL_WALKFORWARD_TWO_YEARS",d.get("mismatches")
          assert d["dataset"]==os.environ["DATASET"] and d["shard"]==int(os.environ["SHARD"])
          assert d["old_rows"]==d["new_rows"]==12
          assert d["private_core_sha"]=="52df33a6b26f988a1f71f0b61839d6888a96e1b8"
          assert d["mismatches"]==[]
          assert d["previous_success_artifacts_recomputed"] is False
          assert d["original_signal_recomputed"] is False and d["old_csv_modified"] is False
          assert d["production_changed"] is False and d["release_ready"] is False
          print("PASS_WALKFORWARD_YEAR_SOURCE_BOUND",d["dataset"],d["years"])
          PY
      - name: Private original tracked data must not change
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test -z "$(git -C core diff --name-only)"
          test -z "$(git -C core diff --cached --name-only)"
      - name: Upload only non-private SHA and numerical parity evidence JSON
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2-phase41-${{ matrix.dataset }}-years-part-${{ matrix.shard }}
          path: ${{ runner.temp }}/report.json
          retention-days: 21
          if-no-files-found: error


