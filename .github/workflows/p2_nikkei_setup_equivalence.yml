name: P2 Nikkei setup equivalence audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2_nikkei_setup_equivalence.yml'
      - '.github/p2_nikkei_setup_equivalence_trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve core SHA
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(awk -F': ' '$1=="core_expected_commit"{print $2}' .github/p2_nikkei_setup_equivalence_trigger)"
          START="$(awk -F': ' '$1=="analysis_start"{print $2}' .github/p2_nikkei_setup_equivalence_trigger)"
          END="$(awk -F': ' '$1=="analysis_end"{print $2}' .github/p2_nikkei_setup_equivalence_trigger)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: yuki746289/product_kabu
          ref: ${{ steps.cfg.outputs.sha }}
          token: ${{ secrets.KABU_PRIVATE_REPO_TOKEN }}
          path: core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements.txt
      - run: pip install -r core/requirements.txt
      - name: Run common-period setup audit
        working-directory: core
        run: |
          python scripts/audit_p2_nikkei_setup_equivalence.py \
            --analysis-start "${{ steps.cfg.outputs.start }}" \
            --analysis-end "${{ steps.cfg.outputs.end }}" \
            --output-dir /tmp/p2_nikkei_setup_equivalence
      - uses: actions/upload-artifact@v4
        with:
          name: p2-nikkei-setup-equivalence-audit
          path: /tmp/p2_nikkei_setup_equivalence
          retention-days: 30
